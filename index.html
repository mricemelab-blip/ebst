<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBST · Evidence-Based Strength Training Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* ========== MACROFACTOR LIGHT THEME ========== */
:root {
  --bg-primary: #f5f5f5;
  --bg-card: #ffffff;
  --bg-dark: #111111;
  --text-primary: #111111;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border: #e0e0e0;
  --accent: #111111;
  --accent-hover: #333333;
  --dot-color: #d5d5d5;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --card-shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
a { color: inherit; }

/* ========== HEADER ========== */
.site-header {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}
.site-header .container { display: flex; align-items: center; justify-content: space-between; }
.brand-mark {
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.header-nav a {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-decoration: none;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color var(--transition);
}
.header-nav a:hover { color: var(--text-primary); }

/* ========== HERO ========== */
.hero { padding: 100px 0 60px; text-align: center; }
.hero-eyebrow {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hero-title {
  font-family: var(--font-sans);
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -2px;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.hero-subtitle-en {
  font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: var(--text-secondary);
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 400;
}
.hero-subtitle-zh {
  font-size: 1.1rem;
  color: var(--text-muted);
  font-weight: 300;
  margin-bottom: 48px;
}
.hero-line { width: 40px; height: 2px; background: var(--text-primary); margin: 0 auto 48px; }

/* ========== LOGIN FORM ========== */
.login-section { max-width: 400px; margin: 0 auto 100px; }
.input-group { position: relative; margin-bottom: 20px; }
.input-group input {
  width: 100%;
  padding: 16px 20px;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  color: var(--text-primary);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: all var(--transition);
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group input:focus { border-color: var(--text-primary); }
.input-group .input-line { display: none; }
.btn-enter {
  width: 100%;
  padding: 16px;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #ffffff;
  background: var(--bg-dark);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-enter:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-enter:active { transform: translateY(0); }

/* ========== SECTION ========== */
.section-header { text-align: center; margin-bottom: 60px; }
.section-tag {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.section-title {
  font-family: var(--font-sans);
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}

/* ========== CHAPTER GRID ========== */
.chapters-section { padding: 40px 0 100px; }
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
}
.chapter-card::before { display: none; }
.chapter-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-shadow-hover);
}
.card-number {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-transform: uppercase;
}
.card-title {
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.4;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 1.5;
}
.card-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.card-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

/* ========== AI CHAT ========== */
.chat-fab {
  position: fixed;
  bottom: 32px; right: 32px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--bg-dark);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: all var(--transition);
  z-index: 1000;
}
.chat-fab:hover { transform: scale(1.05); background: var(--accent-hover); }
.chat-fab svg { width: 24px; height: 24px; fill: #ffffff; }
.chat-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
}
.chat-modal-overlay.active { display: flex; }
.chat-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}
.chat-modal-icon {
  width: 48px; height: 48px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--bg-primary);
  display: flex; align-items: center; justify-content: center;
}
.chat-modal-icon svg { width: 24px; height: 24px; fill: var(--text-primary); }
.chat-modal h3 { font-family: var(--font-sans); font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
.chat-modal p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px; }
.chat-modal-close {
  padding: 10px 28px;
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  background: var(--bg-dark);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.chat-modal-close:hover { background: var(--accent-hover); }

/* ========== FOOTER ========== */
.site-footer { padding: 40px 0; border-top: 1px solid var(--border); text-align: center; }
.footer-text {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ========== PRINT ========== */
@media print {
  body { background: #fff; color: #000; }
  body::before { display: none; }
  .chat-fab, .chat-modal-overlay { display: none !important; }
  .chapter-card { break-inside: avoid; }
}
@media (max-width: 768px) {
  .hero { padding: 60px 0 40px; }
  .chapter-grid { grid-template-columns: 1fr; }
  .chat-fab { bottom: 20px; right: 20px; width: 48px; height: 48px; }
}

</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <div class="brand-mark">EBST</div>
    <nav class="header-nav">
      <a href="#">Curriculum</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div class="hero-eyebrow">Science-Driven · Evidence-Based</div>
    <h1 class="hero-title">EBST</h1>
    <p class="hero-subtitle-en">Evidence-Based Strength Training Specialist</p>
    <p class="hero-subtitle-zh">循证抗阻训练专家</p>
    <div class="hero-line"></div>

    <div class="login-section">
      <div class="input-group">
        <input type="text" id="studentName" placeholder="输入学员姓名 / Enter your name" autocomplete="off">
        <div class="input-line"></div>
      </div>
      <button class="btn-enter" onclick="enterDashboard()">Enter →</button>
    </div>
  </div>
</section>

<!-- CHAPTERS -->
<section class="chapters-section">
  <div class="container">
    <div class="section-header">
      <div class="section-tag">Curriculum</div>
      <h2 class="section-title">14 Chapters</h2>
    </div>
    <div class="chapter-grid" id="chapterGrid"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <p class="footer-text">© 2026 3HFIT × Arise — All Rights Reserved</p>
  </div>
</footer>

<!-- AI CHAT FAB -->
<button class="chat-fab" onclick="openChat()" aria-label="AI 助教">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
</button>

<!-- AI CHAT OVERLAY -->
<div class="chat-modal-overlay" id="chatModal" onclick="if(event.target===this)closeChat()">
  <div style="width:420px;height:600px;max-height:calc(100vh - 120px);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.12);border:1px solid #e0e0e0;">
    <iframe id="chatFrame" src="" style="width:100%;height:100%;border:none;" title="EBST AI 助教"></iframe>
  </div>
</div>

<script>
/* ========== CHAPTER DATA ========== */
const chapters = [
  { num: '01', title: 'Breathing: Mechanics & Training', desc: '呼吸：力学基础与训练应用', file: 'ch1.html', status: 'live' },
  { num: '02', title: 'Curl-Up', desc: '卷腹', file: 'ch2.html', status: 'live' },
  { num: '03', title: 'Dead Bug & Trunk Control', desc: '死虫与躯干控制', file: 'ch3.html', status: 'live' },
  { num: '04', title: 'Plank & Push-Up', desc: '平板支撑与俯卧撑', file: 'ch4.html', status: 'live' },
  { num: '05', title: 'Bench Press', desc: '卧推', file: 'ch5.html', status: 'live' },
  { num: '06', title: 'Overhead Press', desc: '肩推', file: 'ch6.html', status: 'live' },
  { num: '07', title: 'Arms & Deltoids', desc: '臂部与三角肌', file: 'ch7.html', status: 'live' },
  { num: '08', title: 'Squat', desc: '深蹲', file: 'ch8.html', status: 'live' },
  { num: '09', title: 'Split Squat', desc: '分腿蹲', file: 'ch9.html', status: 'live' },
  { num: '10', title: 'Lat Pulldown & Straight-Arm Pulldown', desc: '高位下拉与直臂下压', file: 'ch10.html', status: 'live' },
  { num: '11', title: 'Pull-Up', desc: '引体向上', file: 'ch11.html', status: 'live' },
  { num: '12', title: 'Row', desc: '划船', file: 'ch12.html', status: 'live' },
  { num: '13', title: 'Face Pull', desc: '面拉', file: 'ch13.html', status: 'live' },
  { num: '14', title: 'Glute Training', desc: '臀部训练', file: 'ch14.html', status: 'coming-soon' }
];

/* ========== RENDER CHAPTERS ========== */
const grid = document.getElementById('chapterGrid');
chapters.forEach(ch => {
  if (ch.status === 'live' && ch.file) {
    grid.innerHTML += `
    <a class="chapter-card" href="${ch.file}" style="text-decoration:none;display:block;">
      <div class="card-number">CH ${ch.num}</div>
      <div class="card-title">${ch.title}</div>
      <div class="card-desc">${ch.desc}</div>
      <div class="card-status"><span class="dot" style="background:var(--accent);"></span> Available</div>
    </a>`;
  } else {
    grid.innerHTML += `
    <div class="chapter-card">
      <div class="card-number">CH ${ch.num}</div>
      <div class="card-title">${ch.title}</div>
      <div class="card-desc">${ch.desc}</div>
      <div class="card-status"><span class="dot"></span> Coming Soon</div>
    </div>`;
  }
});

/* ========== LOGIN ========== */
function enterDashboard() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) {
    document.getElementById('studentName').focus();
    return;
  }
  localStorage.setItem('sbst_student', JSON.stringify({ name, loginAt: Date.now() }));
  window.location.href = 'dashboard.html';
}

document.getElementById('studentName').addEventListener('keydown', e => {
  if (e.key === 'Enter') enterDashboard();
});

/* ========== CHAT MODAL ========== */
function openChat() {
  var overlay = document.getElementById('chatModal');
  var frame = document.getElementById('chatFrame');
  if (!frame.src) frame.src = 'chat-widget.html';
  overlay.classList.add('active');
}
function closeChat() { document.getElementById('chatModal').classList.remove('active'); }
window.addEventListener('message', function(e) {
  if (e.data === 'close-chat') closeChat();
});
</script>
</body>
</html>
