<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBST · Evidence-Based Strength Training Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* ========== MACROFACTOR LIGHT THEME ========== */
:root {
  --bg-primary: #f5f5f5;
  --bg-card: #ffffff;
  --bg-dark: #111111;
  --text-primary: #111111;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border: #e0e0e0;
  --accent: #111111;
  --accent-hover: #333333;
  --dot-color: #d5d5d5;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --card-shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
a { color: inherit; }

/* ========== HEADER ========== */
.site-header {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}
.site-header .container { display: flex; align-items: center; justify-content: space-between; }
.brand-mark {
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.header-nav a {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-decoration: none;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color var(--transition);
}
.header-nav a:hover { color: var(--text-primary); }

/* ========== HERO ========== */
.hero { padding: 100px 0 60px; text-align: center; }
.hero-eyebrow {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hero-title {
  font-family: var(--font-sans);
  font-size: clamp(1.5rem, 4vw, 3rem);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.hero-subtitle-en {
  font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: var(--text-secondary);
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 400;
}
.hero-subtitle-zh {
  font-size: 1.1rem;
  color: var(--text-muted);
  font-weight: 300;
  margin-bottom: 48px;
}
.hero-line { width: 40px; height: 2px; background: var(--text-primary); margin: 0 auto 48px; }

/* ========== LOGIN FORM ========== */
.login-section { max-width: 400px; margin: 0 auto 100px; }
.input-group { position: relative; margin-bottom: 20px; }
.input-group input {
  width: 100%;
  padding: 16px 20px;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  color: var(--text-primary);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: all var(--transition);
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group input:focus { border-color: var(--text-primary); }
.input-group .input-line { display: none; }
.btn-enter {
  width: 100%;
  padding: 16px;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #ffffff;
  background: var(--bg-dark);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-enter:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-enter:active { transform: translateY(0); }

/* ========== SECTION ========== */
.section-header { text-align: center; margin-bottom: 60px; }
.section-tag {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.section-title {
  font-family: var(--font-sans);
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}

/* ========== CHAPTER GRID ========== */
.chapters-section { padding: 40px 0 100px; }
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
}
.chapter-card::before { display: none; }
.chapter-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-shadow-hover);
}
.card-number {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-transform: uppercase;
}
.card-title {
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.4;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 1.5;
}
.card-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.card-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

/* ========== AI CHAT ========== */
.chat-fab {
  position: fixed;
  bottom: 32px; right: 32px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--bg-dark);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: all var(--transition);
  z-index: 1000;
}
.chat-fab:hover { transform: scale(1.05); background: var(--accent-hover); }
.chat-fab svg { width: 24px; height: 24px; fill: #ffffff; }
.chat-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
}
.chat-modal-overlay.active { display: flex; }
.chat-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}
.chat-modal-icon {
  width: 48px; height: 48px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--bg-primary);
  display: flex; align-items: center; justify-content: center;
}
.chat-modal-icon svg { width: 24px; height: 24px; fill: var(--text-primary); }
.chat-modal h3 { font-family: var(--font-sans); font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
.chat-modal p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px; }
.chat-modal-close {
  padding: 10px 28px;
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  background: var(--bg-dark);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.chat-modal-close:hover { background: var(--accent-hover); }

/* ========== FOOTER ========== */
.site-footer { padding: 40px 0; border-top: 1px solid var(--border); text-align: center; }
.footer-text {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ========== PRINT ========== */
@media print {
  body { background: #fff; color: #000; }
  body::before { display: none; }
  .chat-fab, .chat-modal-overlay { display: none !important; }
  .chapter-card { break-inside: avoid; }
}
@media (max-width: 768px) {
  .hero { padding: 60px 0 40px; }
  .chapter-grid { grid-template-columns: 1fr; }
  .chat-fab { bottom: 20px; right: 20px; width: 48px; height: 48px; }
}


/* ========== INVITATION CODE ========== */
.invite-error {
  font-size: 0.8rem;
  color: #d32f2f;
  margin-top: -12px;
  margin-bottom: 12px;
  display: none;
  padding-left: 4px;
}
.invite-error.visible { display: block; }
.invite-success {
  font-size: 0.8rem;
  color: #2e7d32;
  margin-top: -12px;
  margin-bottom: 12px;
  display: none;
  padding-left: 4px;
}
.invite-success.visible { display: block; }
.input-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: -12px;
  margin-bottom: 16px;
  padding-left: 4px;
}
.phone-group, .name-group {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
}
.phone-group.visible, .name-group.visible {
  max-height: 200px;
  opacity: 1;
}
.btn-enter:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-enter:disabled:hover {
  transform: none;
  background: var(--bg-dark);
}

</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <div class="brand-mark">3HFIT 教研部荣誉出品</div>
    <nav class="header-nav">
      <a href="#">Curriculum</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div class="hero-eyebrow">Science-Driven · Evidence-Based</div>
    <h1 class="hero-title">3HFIT 教研部荣誉出品</h1>
    <p class="hero-subtitle-en">Evidence-Based Strength Training Specialist</p>
    <p class="hero-subtitle-zh">循证抗阻训练专家</p>
    <div class="hero-line"></div>

    <div class="login-section">
      <!-- Step 1: Invitation Code -->
      <div class="input-group">
        <input type="text" id="inviteCode" placeholder="输入邀请码 / Invitation code" autocomplete="off">
      </div>
      <div class="input-hint">请输入课程邀请码</div>
      <div class="invite-error" id="inviteError">邀请码无效，请联系课程管理员获取</div>
      <div class="invite-success" id="inviteSuccess">邀请码有效</div>

      <!-- Step 2: Phone + Name (revealed after code verified) -->
      <div class="phone-group" id="phoneGroup">
        <div class="input-group">
          <input type="tel" id="studentPhone" placeholder="输入手机号 / Phone number" autocomplete="off" inputmode="numeric">
        </div>
        <div class="input-hint">用于学员身份记录</div>
      </div>
      <div class="name-group" id="nameGroup">
        <div class="input-group">
          <input type="text" id="studentName" placeholder="输入学员姓名 / Enter your name" autocomplete="off">
        </div>
        <button class="btn-enter" id="enterBtn" onclick="enterDashboard()" disabled>Enter →</button>
      </div>
    </div>
  </div>
</section>

<!-- CHAPTERS -->
<section class="chapters-section">
  <div class="container">
    <div class="section-header">
      <div class="section-tag">Curriculum</div>
      <h2 class="section-title">16 Chapters</h2>
    </div>
    <div class="chapter-grid" id="chapterGrid"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <p class="footer-text">© 2026 3HFIT × Arise — All Rights Reserved</p>
  </div>
</footer>

<!-- AI CHAT FAB -->
<button class="chat-fab" onclick="openChat()" aria-label="AI 助教">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
</button>

<!-- AI CHAT OVERLAY -->
<div class="chat-modal-overlay" id="chatModal" onclick="if(event.target===this)closeChat()">
  <div style="width:420px;height:600px;max-height:calc(100vh - 120px);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.12);border:1px solid #e0e0e0;">
    <iframe id="chatFrame" src="" style="width:100%;height:100%;border:none;" title="EBST AI 助教"></iframe>
  </div>
</div>

<script src="js/fingerprint.js"></script>
<script src="js/auth.js"></script>
<script>
/* ========== CHAPTER DATA ========== */
const chapters = [{num:1,title:"呼吸：力学基础与训练应用",status:"available",file:"ch1.html"},{num:2,title:"卷腹",status:"available",file:"ch2.html"},{num:3,title:"死虫与躯干控制",status:"available",file:"ch3.html"},{num:4,title:"熊爬与四肢协调训练",status:"available",file:"ch4.html"},{num:5,title:"平板支撑与俯卧撑",status:"available",file:"ch5.html"},{num:6,title:"卧推",status:"available",file:"ch6.html"},{num:7,title:"肩推",status:"available",file:"ch7.html"},{num:8,title:"臂部与三角肌",status:"available",file:"ch8.html"},{num:9,title:"臀推",status:"available",file:"ch9.html"},{num:10,title:"硬拉",status:"available",file:"ch10.html"},{num:11,title:"深蹲",status:"available",file:"ch11.html"},{num:12,title:"分腿蹲",status:"available",file:"ch12.html"},{num:13,title:"高位下拉与直臂下压",status:"available",file:"ch13.html"},{num:14,title:"引体向上",status:"available",file:"ch14.html"},{num:15,title:"划船",status:"available",file:"ch15.html"},{num:16,title:"面拉",status:"available",file:"ch16.html"},{num:17,title:"臀部训练",status:"coming-soon"}];

/* ========== RENDER CHAPTERS ========== */
const grid = document.getElementById('chapterGrid');
chapters.forEach(ch => {
  if (ch.status === 'available' && ch.file) {
    grid.innerHTML += `
    <a class="chapter-card" href="${ch.file}" style="text-decoration:none;display:block;">
      <div class="card-number">CH ${ch.num}</div>
      <div class="card-title">${ch.title}</div>
      ${ch.desc ? `<div class="card-desc">${ch.desc}</div>` : ''}
      <div class="card-status"><span class="dot" style="background:var(--accent);"></span> Available</div>
    </a>`;
  } else {
    grid.innerHTML += `
    <div class="chapter-card">
      <div class="card-number">CH ${ch.num}</div>
      <div class="card-title">${ch.title}</div>
      ${ch.desc ? `<div class="card-desc">${ch.desc}</div>` : ''}
      <div class="card-status"><span class="dot"></span> Coming Soon</div>
    </div>`;
  }
});

/* ========== INVITATION CODES (前端预检，Worker 最终验证) ========== */
const VALID_CODES = ['EBST2026', '3HFIT-ACE', 'RISE2026', 'COACH-001', 'EBST-RIFN', 'EBST-D71W', 'EBST-8UI1', 'EBST-L8S2', 'EBST-FSMH', 'EBST-YUST', 'EBST-2QQ5'];

/* ========== AUTO-LOGIN CHECK ========== */
(async function() {
  const token = EBSTAuth.getToken();
  if (!token) return;

  // 有 token → 尝试 Worker 验证
  try {
    const result = await EBSTAuth.apiVerify();
    if (result.valid) {
      window.location.href = 'dashboard.html';
    } else {
      EBSTAuth.clearToken();
    }
  } catch (e) {
    // Worker 不可达 → 降级检查本地数据
    const student = EBSTAuth.getStudentInfo();
    if (student && student.name && student.invitationCode) {
      window.location.href = 'dashboard.html';
    } else {
      EBSTAuth.clearToken();
    }
  }
})();

/* ========== STEP 1: VALIDATE INVITE CODE (前端预检) ========== */
function validateInviteCode() {
  const code = document.getElementById('inviteCode').value.trim();
  const errorEl = document.getElementById('inviteError');
  const successEl = document.getElementById('inviteSuccess');
  const phoneGroup = document.getElementById('phoneGroup');
  const nameGroup = document.getElementById('nameGroup');

  if (!code) return;

  errorEl.classList.remove('visible');
  successEl.classList.remove('visible');

  const isValid = VALID_CODES.includes(code);

  if (!isValid) {
    errorEl.textContent = '邀请码无效，请联系课程管理员获取';
    errorEl.classList.add('visible');
    phoneGroup.classList.remove('visible');
    nameGroup.classList.remove('visible');
    document.getElementById('enterBtn').disabled = true;
    return;
  }

  successEl.textContent = '邀请码有效';
  successEl.classList.add('visible');
  phoneGroup.classList.add('visible');
  nameGroup.classList.add('visible');
  setTimeout(() => document.getElementById('studentPhone').focus(), 300);
  checkReady();
}

/* ========== CHECK IF FORM READY ========== */
function checkReady() {
  const phone = document.getElementById('studentPhone').value.trim();
  const name = document.getElementById('studentName').value.trim();
  document.getElementById('enterBtn').disabled = !(phone && name);
}

/* ========== EVENT LISTENERS ========== */
document.getElementById('inviteCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') validateInviteCode();
});

document.getElementById('inviteCode').addEventListener('input', function() {
  document.getElementById('inviteError').classList.remove('visible');
  document.getElementById('inviteSuccess').classList.remove('visible');
});

// Phone input: numeric only
document.getElementById('studentPhone').addEventListener('input', function() {
  this.value = this.value.replace(/[^\d]/g, '');
  checkReady();
});
document.getElementById('studentPhone').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('studentName').focus();
});

document.getElementById('studentName').addEventListener('input', checkReady);
document.getElementById('studentName').addEventListener('keydown', e => {
  if (e.key === 'Enter') enterDashboard();
});

/* ========== ENTER DASHBOARD (Worker 登录) ========== */
async function enterDashboard() {
  const name = document.getElementById('studentName').value.trim();
  const phone = document.getElementById('studentPhone').value.trim();
  const code = document.getElementById('inviteCode').value.trim();
  const errorEl = document.getElementById('inviteError');
  const successEl = document.getElementById('inviteSuccess');
  const btn = document.getElementById('enterBtn');

  if (!phone || !name) return;

  // 前端预检
  if (!VALID_CODES.includes(code)) {
    errorEl.textContent = '邀请码已失效，请重新输入';
    errorEl.classList.add('visible');
    return;
  }

  // 按钮 loading 状态
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const result = await EBSTAuth.apiLogin(phone, name, code);

    if (result.success) {
      // 存储 token 和学生信息
      EBSTAuth.setToken(result.token);
      EBSTAuth.setStudentInfo({
        name: result.name,
        phone: phone,
        invitationCode: code,
        loginAt: Date.now(),
        expiresAt: result.expiresAt,
      });

      successEl.textContent = '登录成功，正在跳转...';
      successEl.classList.add('visible');
      errorEl.classList.remove('visible');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    } else {
      // Worker 返回错误
      errorEl.textContent = result.error || '登录失败，请重试';
      errorEl.classList.add('visible');
      successEl.classList.remove('visible');

      if (result.code === 'DEVICE_LIMIT') {
        errorEl.textContent = result.error;
      }
    }
  } catch (e) {
    // Worker 不可达 → 降级为本地登录
    console.warn('[EBST Auth] Worker unreachable, fallback to local login');
    EBSTAuth.setStudentInfo({
      name: name,
      phone: phone,
      invitationCode: code,
      loginAt: Date.now(),
      degraded: true,
    });
    // 生成一个本地 token（基于 fingerprint）
    const fp = await EBSTAuth.getDeviceFingerprint();
    const localToken = btoa(`${phone}:${Date.now()}:${fp}`).substring(0, 48);
    EBSTAuth.setToken(localToken);

    successEl.textContent = '离线模式登录';
    successEl.classList.add('visible');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 500);
  }

  btn.disabled = false;
  btn.textContent = 'Enter →';
}

/* ========== CHAT MODAL ========== */
function openChat() {
  var overlay = document.getElementById('chatModal');
  var frame = document.getElementById('chatFrame');
  frame.src = 'chat-widget.html';
  overlay.classList.add('active');
}
function closeChat() { document.getElementById('chatModal').classList.remove('active'); }
window.addEventListener('message', function(e) {
  if (e.data === 'close-chat') closeChat();
});
</script>
</body>
</html>
