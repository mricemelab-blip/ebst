<script type="application/json" id="knowledge-base">{"chapters": {"1": "Breathing: Mechanics & Training", "2": "Curl-Up", "3": "Dead Bug & Trunk Control", "4": "Plank & Push-Up", "5": "Bench Press", "6": "Overhead Press", "7": "Arms & Deltoids", "8": "Squat", "9": "Split Squat", "10": "Lat Pulldown & Straight-Arm Pulldown", "11": "Pull-Up", "12": "Row", "13": "Face Pull", "14": "Glute Training"}, "blocks": [[10, 本章导读", "上肢拉的动作包括攀爬、划船、将物体拉近身体以及部分投掷准备动作。不同任务对肩关节、肩胛骨、肘关节和躯干控制的需求不同。高位下拉与直臂下压可以用来练习肩关节内收、伸展及负荷控制；若目标是改善特定生活或运动任务，还需结合相应的全身动作练习。儿童运动发育评估工具本身不能用来确定成人推、拉训练的先后顺序。 讨论上肢拉时，背部肌群几乎全部参与，包括斜方肌、背阔肌、大圆肌等。本单元以高位下拉与直臂下压两个动作为载体，重点呈现背阔肌的解剖结构与循证训练依据。"], [10, §4.1.1 背阔肌：四段式解剖模型", "以下按肱骨端、肩胛与肋骨邻近区、胸腰筋膜区及骨盆邻近区梳理解剖关系。这是教学用的区域地图，不是四块独立肌肉，也不是由肱骨经肩胛骨依次串联至骨盆的四段结构；实际纤维走向、附着变异和力矩应结合具体体位理解。 第一区域：肱骨止点与腋后壁 背阔肌主要由下胸椎棘突、胸腰筋膜、髂嵴和下位肋骨等部位起始，纤维向外上方汇聚，止于肱骨结节间沟底。它与大圆肌共同构成腋后襞。触诊时可在轻度肩伸展或内收抗阻下辨认腋后壁的收缩，但仅凭触感不能区分所有邻近肌肉的贡献。 背阔肌作用于肱骨，主要参与以下三个肩关节动作： 肩关节内收：使肱骨向躯干靠近 肩关节伸展（extension）：使上举或前屈的上臂向后下方移动。"], [10, §4.1.1 背阔肌：四段式解剖模型（续）", "肩关节内旋：纤维从手臂前侧绕过腋窝，产生内旋力矩 第二区域：肩胛下角变异附着与下位肋骨联系 背阔肌的主要止点在肱骨，部分个体另有与肩胛下角相关的附着。Pouliart等人的解剖研究提示这种附着存在明显个体差异，存在明显个体差异。背阔肌参与的拉动任务通常伴随肩胛运动，但肩胛下降、回缩由多块肌肉协调完成。解剖概述可参阅Jeno等《Anatomy, Back, Latissimus Dorsi》（NCBI Bookshelf NBK448120；PMID28846224）。 下位肋骨、下胸椎和筋膜附着共同构成背阔肌广泛的起始区域。其作用随上肢位置、固定端和其他肌肉协同而改变。其作用随任务与协同肌群改变。 同时，由于附着于肋骨，当手臂固定（如引体向上悬挂位）时，此段背阔肌可辅助吸气，将肋骨上抬以扩大胸腔空间。 第三区域：胸腰筋膜联系 背阔肌通过胸腰筋膜与躯干结构相连。在上肢固定或承受负荷时，它可能参与躯干的力传递与控制，但脊柱动作来自多肌群协同。不能把筋膜联系直接等同于较大的腰椎伸展或侧屈力矩，某一动作选择性强化本区域。"], [10, §4.1.1 背阔肌：四段式解剖模型（续）", "第四区域：髂嵴及腰骶筋膜联系 背阔肌下部纤维起自胸腰筋膜与髂嵴等区域，并可经胸腰筋膜与骶骨周围组织形成间接连续，这与肌肉直接止于S5的附着关系不同。背阔肌的远端止点位于肱骨结节间沟底。Bogduk等人（1998）的标本研究提示，背阔肌经胸腰筋膜对腰骶和骶髂区域产生的直接力学贡献较小； 背阔肌解剖区域与功能联系总结 区域或联系 序号 功能与适用条件 肱骨止点相关 1 参与肩关节内收 肱骨止点相关 2 参与肩关节伸展 肱骨止点相关 3 参与肩关节内旋 肩胛运动联系 4 拉动中可伴随肩胛下降，需多肌群协同 肩胛运动联系 5 拉动中可伴随肩胛回缩，非背阔肌独立完成 肋骨及固定端联系 6 上肢固定时可能参与辅助呼吸 胸腰筋膜联系 7 参与躯干力传递，不等同于较大腰椎伸展力矩 胸腰筋膜联系 8 躯干控制作用随体位、固定端和协同肌改变 骨盆及筋膜联系 9 存在髂嵴等附着，不可单独推定骨盆前倾 腰骶区域联系 10 腰骶稳定为多结构协同，背阔肌贡献有限且依条件改变"], [10, §4.1.2 大圆肌", "Dancker等（2017）通过14具尸体的28侧上肢观察背阔肌与大圆肌的解剖关系，提示两者之间存在不同形式的结构联系。"], [10, §4.1.3 下斜方肌的独特作用", "下斜方肌与前锯肌等共同参与肩胛上回旋和后倾控制，背阔肌则主要作用于肱骨。训练可以同时包含拉力练习与肩胛控制练习。"], [10, §4.1.4 背阔肌与肩关节稳定性的双面关系", "背阔肌、胸大肌和肩胛下肌均可产生肩关节内旋力矩。肩关节稳定取决于旋转肌群、关节囊韧带、肩胛骨运动及神经肌肉控制的共同作用，不能简单归因于“内旋肌压倒外旋肌”。评估与训练时，应结合症状、活动度、力量和动作控制，而不应仅凭静态体态判断肱骨头位移。"], [10, §4.2.1 口令能否改变背阔肌的参与程度", "Snyder等人2009年的研究， Benjamin J Snyder et al., Journal of Strength and Conditioning Research https://pubmed.ncbi.nlm.nih.gov/19826307/ Snyder等选取8位无训练经验的女性，在较轻外部负荷的高位下拉中比较指导前后的肌电活动。指导后背阔肌肌电活动增加，肱二头肌与大圆肌没有显著变化。研究摘要中的“30% max”描述外部负荷；肌电则以最大等长活动归一化，二者采用不同基准。这项研究支持口令可能改变参与程度。"], [10, §4.2.2 高位下拉角度对背阔肌与下斜方肌募集的影响", "Se-yeon Park et al., 2013, Journal of Electromyography and Kinesiology https://doi.org/10.1016/j.jelekin.2013.08.006 在该等长下拉实验的特定测试条件下，肩关节角度改变了背阔肌与下斜方肌的相对肌电贡献：角度增大时LD/LT比值下降。研究中的60°与120°结果可帮助理解相对募集差异，但不能直接证明动态高位下拉在这些角度具有最佳增肌、力量或临床效果。"], [10, §4.2.3 俯卧肩伸展与背阔肌最大肌电测试", "Se-yeon Park et al., 2013, Journal of Electromyography and Kinesiology https://doi.org/10.1016/j.jelekin.2013.05.003 Park等比较了多种背阔肌最大自主等长收缩测试任务。俯卧位肩关节抗阻伸展的肌电均值最高，但与坐姿向下拉杆没有显著差异。这里的动作是肩关节伸展，不是躯干或腰椎伸展。研究目的是寻找肌电标准化测试，不能直接据此评选最佳增肌练习。 Chen等（2021）研究了20名健康男性在不同被动姿势下胸腰筋膜的剪切模量。该研究有助于理解姿势与筋膜力学测量的关系，但没有测量脊柱压缩力、背阔肌神经激活或单手负重行走效果。因此，单手负重行走可作为躯干负荷控制练习，却不能用这篇论文证明它选择性强化背阔肌某一束。 Baizhen Chen et al., 2021 https://pubmed.ncbi.nlm.nih.gov/33495983/"], [10, §4.2.4 驼背姿势对背阔肌训练的影响", "Seok Tae Lee et al., 2016, Annals of Rehabilitation Medicine https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4855127/pdf/arm-40-318.pdf Lee等在10名健康男性中比较直立与含胸坐姿下抬臂时的肌电活动。含胸位中、下斜方肌活动增加，前锯肌和背阔肌未见显著差异。教学时应选择便于控制且能够耐受的躯干位置，不将短期肌电差异解释为必然疼痛或退化。"], [10, §4.2.5 肩屈活动度测量与背阔肌长度评估", "Muhammad Dawood et al., 2018 https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6093123/ Dawood等研究了临床背阔肌长度测试的测量可靠性，结果为差至中等，可靠性与效度为不同指标，该研究未验证诊断效度。采用仰卧肩屈观察时，应统一体位、骨盆固定、测量方法和测量者，并记录躯干代偿与症状。肩屈范围受多个组织及动作策略影响，未达到180°不能单独诊断背阔肌短缩；该研究也没有建立维持20秒的诊断规则。 简易观察：背部靠墙，在舒适站姿下缓慢抬臂，观察活动范围、躯干后仰及症状。靠墙方式仅用于重复比较同一人的表现，不以170°作为诊断阈值或统一的负重训练准入线。"], [10, §4.2.6 肌腱约束与肩关节稳定：解剖机制的适用范围", "肩关节稳定涉及关节形态、关节囊韧带、肌肉与神经控制；以下研究解释部分结构作用。 肱二头肌长头肌腱的力学联系 肱二头肌长头肌腱起自肩胛盂上方及盂唇相关区域，经过肩关节后进入结节间沟。它在某些关节位置和负荷下可能参与约束或旋转控制，但不能将其简化为在所有动作中都把肱骨头向后下方推回的橡皮筋。 Rienk Eshuis et al., 2012, Clinical Anatomy https://doi.org/10.1002/ca.22001 Eshuis等研究的是肱二头肌长头肌腱与肱骨轴向旋转的力学关系。 背阔肌肌腱的离体约束作用 N. Pouliart et al., 2005, Clinical Anatomy https://pubmed.ncbi.nlm.nih.gov/16121388/ https://doi.org/10.1002/ca.20181 直臂下压可作为肩伸展力量练习。对于既往脱位、反复不稳或当前肩痛者，应根据专业评估选择范围和负荷；不能将该动作作为自行复位手段。"], [10, §4.2.7 等长下拉与肩峰肱骨间距", "P. Sealey et al., 2017, Physiotherapy https://www.physiotherapyjournal.com/article/S0031-9406(16)30018-9/fulltext https://doi.org/10.1016/j.physio.2016.03.002 Sealey等在健康人中用超声观察等长下拉时的肩峰肱骨间距。各测试负荷条件下间距均有增加；作者所讨论的临床意义量级仅男性达到；统计学差异与临床意义量级需要分别解释。急性间距变化不是疼痛改善或康复疗效的直接证据。 肩峰肱骨间距反映特定体位下的影像学距离，不能独立解释全部肩痛。Leong等的研究涉及测量可靠性及人群比较，不是治疗随访。康复进展应结合疼痛、功能、活动范围、力量及任务耐受性综合评价，而非只看间距增减。 Hio-Teng Leong et al., 2012 https://pubmed.ncbi.nlm.nih.gov/22209419/"], [10, §4.2.8 高位下拉与引体向上的关联性", "Kenji Doma et al., 2013 https://pubmed.ncbi.nlm.nih.gov/24245055/ Doma等报告，引体向上向心阶段的肱二头肌及竖脊肌肌电活动高于高位下拉。论文中部分背阔肌、肱二头肌与肱三头肌的差异是同一动作内不同肌肉的比较，并不代表两个动作在离心阶段的优劣。动作选择还应考虑负荷调节、完成能力及训练目标。 Doug Johnson et al., 2009 https://pubmed.ncbi.nlm.nih.gov/19387371/ Johnson等研究了35名男性和23名女性。高位下拉与引体向上最大力量的相关性在男性较高且显著（r=0.78），女性较低且未达显著（r=0.44）。按体重标准化的最大负荷，两性均是引体向上高于高位下拉。相关性不等于两项测试可互换，也不表示下拉成绩能直接预测每个人的引体向上次数。"], [10, §4.2.9 高位下拉握距与握法的选择", "Vidar Andersen et al., 2014, Journal of Strength and Conditioning Research https://doi.org/10.1097/jsc.0000000000000232 Andersen等比较了约1、1.5和2倍肩峰间距的握距，测量6RM表现及急性肌电活动。该急性试验没有比较不同握距的长期训练适应，研究间结果也需要结合测试条件解释。教练可结合舒适度、动作范围和可完成负荷选择握距，再持续追踪训练效果。 Stephen J. Lusk et al., 2010 https://pubmed.ncbi.nlm.nih.gov/20543740/ Lusk等让12名健康男性完成4种颈前下拉握法条件。在所测条件下，正握的背阔肌肌电活动较高。该研究没有比较颈前与颈后下拉，正握是所有人长期训练的最佳方式。 Sandro Sperandei et al., 2009 Sperandei等选取24位有训练经验的男性，比较80% 1RM负荷下的颈前、颈后及V形把手下拉。 研究中背阔肌在三种下拉方式间未见显著差异；胸大肌在颈前下拉较高，后三角肌与肱二头肌在颈后下拉较高。研究者推荐颈前下拉，但急性肌电研究没有直接比较损伤发生率。实践中可优先选择容易控制、活动范围舒适的颈前方式，并根据个人表现调整。"], [10, §4.2.10 多平面自由度器械", "Yasushi Koyama et al., 2010 https://pubmed.ncbi.nlm.nih.gov/20225080/ Koyama等使用可提供多平面自由度的下拉器械，在7名健康男性、30% 1RM条件下测量运动学和肌电。器械改变了运动轨迹及部分肌肉参与模式，但研究没有直接测试长期训练后向运动表现的迁移。多平面器械可用于任务变化，是否更符合专项需求仍需结合目标动作验证。"], [10, 训练前的活动度与症状观察", "训练前先了解既往肩部问题，并在拟使用的动作范围内观察疼痛、控制及负荷耐受。活动度测量可作为基线记录，不应只凭单一角度决定所有人的训练资格。 仰卧肩屈观察：统一体位和骨盆固定方法，缓慢抬臂，记录肩屈范围、躯干代偿与症状。未达到180°时，应进一步分析限制因素，不能直接归因为背阔肌短缩。 靠墙抬臂观察可辅助比较同一人的变化。若出现疼痛或明显失控，先减少范围、负荷或改变动作；不以170°作为一律禁止负重的界线。"], [10, §4.3.2 直臂下压教学要点", "直臂下压适合练习肩伸展及躯干控制。对肩部有症状或不稳史者，采用评估后可耐受的方案，不把它当作普遍适用的复位或康复动作。 肘部保持轻度屈曲或接近伸直，在舒适范围内用肩伸展带动上臂下移，避免靠反复屈伸肘部完成全部行程。 回程保持可控速度，逐渐让上臂上举，不为追求更大幅度而强行进入疼痛位置。慢速回程用于练习负荷控制，不代表能将肱骨头顶回。 可在可耐受的角度加入短暂停顿或等长练习；90°只是一种选择，不能保证增加间距或改善肩痛。 根据症状、动作范围和次日反应逐步调整练习，必要时转介评估。"], [10, §4.3.3 高位下拉教学要点", "允许肩胛骨随上臂协调运动。可用适度提示帮助控制，但不要求每次拉动前都先用力下沉、后缩并固定肩胛骨。 选择能控制的动作范围；Park等的60°、90°、120°结果来自等长实验，不能规定动态下拉必须固定在某个最佳角度。 握法以舒适、可控及便于渐进负荷为基础。正握、反握和中立握可作为不同选择，急性肌电差异不能单独决定长期增肌优劣。 保持能够耐受并重复控制的躯干位置；若目标是严格下拉，避免用越来越大的摆动代替上肢拉动。"], [10, §4.4 常见错误", "错误一：为扩大幅度而失去躯干控制 含胸位不等于必然造成脊柱退化，Lee等研究也没有发现背阔肌活动因此显著提高。教练应观察动作是否可控、可耐受，以及是否通过躯干摆动掩盖负荷过重。 错误二：强制固定肩胛骨或忽视协调运动 上臂运动时肩胛骨通常需要随之调整。避免把始终下沉后缩当成唯一正确姿势；根据动作目标和个人反应使用提示。 错误三：忽视症状与可用活动范围 肩屈受限不能单独说明背阔肌短缩或肱骨头前移。应记录范围、症状和代偿，在可控范围内选择负荷；持续疼痛或不稳需要进一步评估。 错误四：过度强化背阔肌而忽视下斜方肌 背阔肌训练可与下斜方肌、前锯肌及肩袖练习共同安排。力量不平衡不能仅凭外观诊断。 错误五：重量选择过大 当目标是严格控制的下拉时，反复大幅摆动提示应考虑降低负荷或缩短行程。摆动并不意味着背阔肌完全停止工作；专项借力动作则需要另外明确目标、技术和负荷要求。"], [10, §4.5 进阶与退阶", "直臂下压：手肘伸直位进行等长收缩或轻负荷动态练习，建立背阔肌感知与肩关节稳定性 弹力带下拉：选择合适阻力，在可控范围内练习肩与肘的协调；弹力带提供阻力，不等于器械上的体重辅助。 地面姿势引体预备：仰躺（hollow）或趴姿下模拟引体向上的躯干姿势与上肢推拉模式 标准高位下拉：使用舒适握距和可控活动范围，随上臂运动协调肩胛骨，先稳定完成预定次数，再逐步增加负荷。 直臂下压：根据个人情况扩大可控范围，必要时在舒适角度加入停顿；90°不是必须达到的治疗位置。 较大负荷下拉：适用于已有稳定技术且目标包含最大力量的训练者。是否使用超过80% 1RM应结合目标、经验与恢复，不作为所有人的必经阶段。 多平面或单侧下拉：用于增加任务变化和控制要求，进阶依据动作质量及目标匹配，不预设它必然优于普通器械。 俯卧肩关节抗阻伸展：可作为背阔肌相关练习或肌电测试任务；它不是躯干抗阻伸展，选择性强化背阔肌第三段。 单手负重行走：用于躯干抗侧屈及负重行走练习。负荷与距离逐步增加，不用Chen等筋膜研究作为其选择性强化背阔肌的证据。"], [10, §4.5 进阶与退阶（续）", "训练处方补充：Currier等（2026）的ACSM立场文件汇总137篇系统综述，支持健康成人通过持续抗阻训练改善力量、肌量及身体功能，但各项结论的确定性并不相同。Currier等（2023）的网络荟萃分析提示，多种处方均优于不训练，较高负荷通常更利于最大力量，多组训练有利于肌肥大。McLeod等（2024）的伞形综述同时提示，没有适用于所有人的唯一次数或节奏。教练应先明确目标，从能够稳定完成的负荷与组数开始；连续完成目标次数且恢复良好时，逐步增加重量或训练量，并记录实际进展。上述总体证据不能用于诊断局部疼痛或规定唯一安全动作。三项完整书目见文末更新参考文献。"], [11, 本章导读", "引体向上是评估和训练上肢相对拉力及肌耐力的一种常用动作。Pérez-Olea等（2018）在游泳运动员中发现引体相关力学指标与游泳速度有关，但这不说明它对所有人都具有最高的功能转换率。对尚不能完成严格引体者，可从辅助引体及其他拉力练习建立能力。本单元介绍动作控制、个体差异、握法选择与循序进阶。"], [11, §5.1.1 引体向上的力学分期", "引体向上可分为三个阶段，各阶段涉及不同的肌肉协同模式。 悬挂期：身体由双手支撑于横杆，上臂处于上举位置，肩胛骨随个体、握距及主动悬挂程度呈不同位置。肩袖、肩胛控制肌群和躯干肌群共同应对负荷，保持可控且能够耐受的悬挂；不要求人人强行将肩胛骨固定在同一位置。 向心期：通过肘屈及肩关节内收、伸展等协同将身体拉高，肩胛骨随上臂和躯干协调运动。以预先约定的动作范围判断完成度，避免单纯伸颈将下巴探过横杆。 离心期：从向心期最高位将身体缓慢下放，上述动作反向发生。关键在于\"缓慢下放\"的离心控制。"], [11, §5.1.2 主要发力肌群", "根据力学分析，引体向上涉及的肌群如下： 关节动作或控制任务 主要相关肌群与说明 肘关节屈曲 肱肌、肱桡肌、肱二头肌 盂肱关节伸展 背阔肌、大圆肌、后三角肌等 盂肱关节内收 背阔肌、大圆肌、胸大肌等 盂肱关节外展、外旋及稳定 冈上肌参与外展；冈下肌参与外旋；肩袖共同控制肱骨头 肩胛胸廓回缩、倾斜等控制 斜方肌、菱形肌、前锯肌、胸小肌等按任务协同 肩胛下回旋相关 菱形肌、肩胛提肌、胸小肌等；实际贡献随体位改变 受控下放时，关节运动方向与主要制动力矩方向并不相同。例如肘关节在伸展，肘屈肌仍可通过离心作用抵抗重力。肩胛运动也应结合多肌群协同理解，不能把某个单独方向标记为错误体态。 下放任务 控制机制 肘关节受控伸展 主要由肘屈肌离心抵抗重力，非肱三头肌主导制动 上臂逐渐回到上举位置 肩内收、伸展相关肌群离心控制，其他肌群协同 肩胛与躯干控制 斜方肌、前锯肌及躯干肌群等按任务协调，不由动作方向单独推定主导肌 同时，维持整体脊椎稳定性的竖脊肌、腹外斜肌亦须全程参与，以避免出现类似kipping的身体摆动。"], [11, §5.1.3 肌肉参与的时序特征", "Urbanczyk等（2020）使用运动捕捉、测力及肌骨模型分析11名受训健康男性的引体向上上拉阶段，估计不同肌肉的受力。模型估计不是直接肌电记录，也没有覆盖下放阶段。以下按教学任务分解动作，不代表人人具有相同的神经招募先后顺序。 准备任务一：建立可耐受的悬挂与肩关节控制 离地悬挂时，肩袖与其他肩部肌肉共同参与盂肱关节控制，躯干肌群协助限制不必要的摆动。冈上肌参与肱骨外展，冈下肌参与肱骨外旋，两者均属于肩袖；它们不是肩胛骨内转或外转的直接作动肌。不能仅依据模型中的受力大小，推断所有人都遵循深层先于表层的固定启动顺序。 准备任务二：协调肩胛骨与胸廓运动 上拉时肩胛骨需要随上臂运动调整。适度的肩胛控制提示可能有助于学习，但不必先用力下沉、后缩并始终锁住肩胛骨。Struyf等（2011）是肩胛位置和运动学综述，并非证明健康人依靠固定预收顺序完成引体的干预试验。 F."], [11, §5.1.3 肌肉参与的时序特征（续）", "Struyf et al., 2011, Scandinavian Journal of Medicine & Science in Sports https://doi.org/10.1111/j.1600-0838.2010.01274.x 向心任务：肘屈与肩关节动作协调发力 肘屈肌与肩关节内收、伸展相关肌群共同将身体拉向横杆。各关节力矩随体位、负荷和握法变化。 离心任务：上拉相关肌群控制下放 下放时主要由上拉相关肌群的离心作用控制下降速度，其他肌群按任务协同稳定。肘关节虽然伸展，肘屈肌仍提供抵抗重力的制动力矩；不要求主动用肱三头肌把身体推下去。 关键知识点总结： 1. 悬挂期：选择可耐受的范围和辅助程度，保持肩关节、肩胛及躯干控制。 2. 向心期：肘与肩协调发力，在预定动作标准下将身体拉高。 3. 最高点：可短暂停顿以确认控制，不把停顿位置等同于背部肌肉必然最活跃。 4. 离心期：以上拉相关肌群的离心作用控制下降，避免无准备地自由落下。"], [11, §5.1.3 肌肉参与的时序特征（续）", "某个位置更困难可能与关节角度、肌肉长度、力矩、技术、负荷及疲劳有关。仅凭起始点或最高点的主观困难，不能分别诊断肩袖或背部肌群薄弱。可结合辅助量、动作范围、重复表现及必要的专项评估寻找限制。"], [11, §5.2.1 上肢推拉能力的关联及其边界", "Daniel G. Baker et al., 2004, Journal of Strength and Conditioning Research https://doi.org/10.1519/R-12382.1 Baker等在42名橄榄球运动员中观察到卧推与引体向上最大力量相关（r=0.81），样本平均BP/PU比值约97.7%。这些是该样本的统计描述，不是个体的合格标准。研究没有证明推拉差异可预测肩袖损伤，也没有要求先达到某个卧推水平才能练习引体。"], [11, §5.2.2 速度衰减作为训练停止指标", "Miguel Sánchez-Moreno et al., 2020, Journal of Strength and Conditioning Research https://pubmed.ncbi.nlm.nih.gov/32213783/ https://doi.org/10.1519/JSC.0000000000003500 Sánchez-Moreno等比较了25%与50%速度损失方案：29名已有较好引体能力的训练男性完成8周训练，25%组在多项指标上表现较好。速度损失应以同一向心速度指标及规定基准计算，例如0.50降至0.375 m/s为25%。完整一次动作耗时不能直接替代平均推进速度，2秒一次变为5秒两次也不是25%速度下降。该阈值可作有测量条件者的训练方案之一，不是所有人必须遵守的停组规则。"], [11, §5.2.3 不同握法的肌肉参与差异", "James A. Dickie et al., 2017, Journal of Electromyography and Kinesiology（线上发表于2016年） https://pubmed.ncbi.nlm.nih.gov/28011412/ Caryn A. Urbanczyk et al., 2020, Scandinavian Journal of Medicine & Science in Sports https://pubmed.ncbi.nlm.nih.gov/32715526/ https://onlinelibrary.wiley.com/doi/epdf/doi:10.1111/sms.13780 Dickie等在19名男性中测量不同引体握法的肌电活动，握法间总体差异有限，其中正握的中斜方肌活动高于中立握。Urbanczyk等则使用模型估计肌力，两项研究的指标和条件不同，结果应分别理解。"], [11, §5.2.4 握法与肩部运动学", "Joe A. I. Prinold et al., 2016, Journal of Science and Medicine in Sport https://pubmed.ncbi.nlm.nih.gov/26383875/ https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4916995/ Prinold等研究了11名经常进行引体向上者的上拉运动学，比较不同握法下的肩胛与盂肱运动，没有测量长期伤害或康复结局。 宽握时肩胛前伸、后缩的范围较小；反握起始于较大的盂肱外旋位置，且运动偏离肩胛平面较多。作者据此讨论潜在的组织负荷与撞击机制，但这些运动学观察不能直接证明肩峰下压迫、损伤发生率，或解释所有体操与CrossFit训练者的肩痛。 反握并不因外旋位置就自动获得更好的肱骨头稳定性。对肩袖康复者，应结合康复阶段、症状、辅助程度和临床评估选择握法，而非将反握作为普遍优先方案。"], [11, §5.2.5 毛巾握与其他引体变式", "Ronald L. Snarr et al., 2017 https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5548150/ Snarr等在15名有训练经验的男女中比较传统正握、悬吊装置和毛巾引体。毛巾握的中斜方肌活动低于传统正握，背阔肌、肱二头肌及后三角肌未见显著差异。毛巾握可按握力目标选择，但不应据此预期更高中斜方肌活动。 毛巾握可以增加抓握任务的要求，但急性肌电结果没有验证肩胛不稳的治疗效果。中斜方肌活动高低也不能单独代表肩胛上回旋能力。因此，握法应根据目标、舒适度和控制能力选择，不把毛巾握或正握指定为统一的康复处方。"], [11, §5.2.6 Kipping的生物力学分析", "Christopher Dinunzio et al., 2019, Sports Biomechanics（线上发表于2018年） https://pubmed.ncbi.nlm.nih.gov/29768093/ https://doi.org/10.1080/14763141.2018.1452971 Kipping通过全身协调摆动利用动量辅助完成上拉，技术和严格引体不同，不能简单理解为腰椎摆得越大、越快越好。Dinunzio等比较11名运动员的严格与借力引体，测量急性运动学和肌电变化；研究没有随访伤害发生。教学时应明确动作目标、摆动幅度和进阶条件，不用该研究宣称某种节奏必然导致更高损伤率。"], [11, §5.2.7 体重与力量比", "S. P. Flanagan et al., 2003, Research Quarterly for Exercise and Sport https://pubmed.ncbi.nlm.nih.gov/12659476/ Flanagan等最终分析19名训练组与18名对照组女性。训练组完成12周周期化全身力量及有氧训练，能完成引体者由2人增至6人。成功者通常具有更高的最大拉力及相对力量，但样本内预测模型不能转化为所有人的力量体重门槛。 成功完成引体向上的训练者通常具有更高的相对拉力；原研究未建立可普遍适用的精确阈值 Sánchez-Moreno等（2016）另在25名受训男性中研究引体表现与体成分及下拉能力的关系，属于不同人群的横断面研究。 Miguel Sánchez-Moreno et al., 2016 https://pubmed.ncbi.nlm.nih.gov/26176615/ 该研究中，引体次数与等于体重负荷的下拉次数相关（r=0.62），与下拉1RM的相关性很低（r=0.09）。更实用的是记录同一器械、相同动作标准下的辅助量、下拉表现和引体次数，比较个体进步。"], [11, §5.2.8 负荷监测与退阶训练", "负重引体的负荷—速度关系 Mario Muñoz-López et al., 2017, International Journal of Sports Physiology and Performance https://pubmed.ncbi.nlm.nih.gov/28253041/ https://doi.org/10.1123/ijspp.2016-0657 Muñoz-López等研究82名受训男性的负重引体负荷—速度关系，题目中的prone指正握条件，不是地面俯卧持棒练习。仰卧hollow或俯卧持棒可作为躯干与动作控制的准备练习，但这篇研究没有检验其向第一下引体的迁移效果。 减重辅助训练 Ronai与Scibek（2014）的动作技术专栏介绍了引体阶段、辅助方法与变式，可作为教学参考。该文不是不同辅助方法的效果比较试验。"], [11, §5.2.8 负荷监测与退阶训练（续）", "Peter Ronai et al., 2014, Strength and Conditioning Journal https://journals.lww.com/nsca-scj/fulltext/2014/06000/thepullup.14.aspx 弹力带、辅助器械或脚部支撑可以分担体重，让训练者在当前能力下练习。记录辅助方式、规格或配重，并保持目标范围内的躯干控制；辅助本身不意味着只能练到手臂或必然降低躯干张力。弹力带辅助随长度改变，不能将不同规格直接视为恒定减重。"], [11, §5.3.1 悬挂与起始位置教学", "双脚离地前，先确认握持和辅助设备可靠，再完成以下准备；它们是教学检查项，不是固定肌肉启动顺序： 1. 选择可耐受的上举范围，避免带痛强行悬挂。 2. 保持肩胛与上臂协调，不强制始终下沉后缩。 3. 建立适度躯干张力，减少目标动作之外的摆动。 若不能保持起始位置，可增加辅助或缩短行程，再逐步扩大可控范围。"], [11, §5.3.2 向心期协调发力", "肩与肘协调将身体拉向横杆。可以试用将身体拉高、肘部向下等提示，观察哪一种更有助于本人完成预定动作，不规定先弯肘后练背的唯一顺序。顶端可短暂停顿确认控制，但不把这一位置解释为背部肌肉必然最疲劳。"], [11, §5.3.3 离心期控制", "下放由上拉相关肌群的离心作用为主控制，其他肌群按任务协同稳定。保持可重复的下降速度，不主动用肱三头肌把身体推下去。若无法控制下放，可降低总负荷、增加辅助或减少重复次数。"], [11, §5.3.4 握法选择指导", "根据训练目标与个体状况选择握法： 目标为一般上肢拉力：从舒适、可控的握法开始，不单凭急性肌电排名选择。 希望采用反握：根据腕、肘、肩的舒适度及动作表现决定，可与其他握法比较。 肩袖康复期：依评估结果选择握法、辅助和范围，不预设反握更稳定。 肩胛控制需要练习者：先选择能稳定完成的负荷与方式，不凭溜肩外观诊断上回旋不足，也不直接指定毛巾握。 已掌握基础动作且无不适者：可按目标轮换握法，同时保持可比较的训练记录。 有肩关节损伤或不稳史者，应按症状与评估调整。反握不是人人的禁忌，也不是康复优选；疼痛、持续麻木或不稳感不能靠更换握法自行诊断解决。"], [11, §5.4 常见错误", "错误一：把推拉比值当成训练资格或损伤诊断 Baker等报告的是特定运动员样本中的力量相关性，未建立个体损伤阈值。训练可以兼顾推与拉，但不要求先达到固定卧推水平才能开始辅助引体，也不凭某个推拉比诊断肩袖风险。 错误二：离心期缺乏控制 若目标是严格引体，顶端后应保持可控下降，避免突然失去支撑。失控时减少负荷或增加辅助；不能把每一次较快下降都等同于已经造成损伤。 错误三：躯干稳定性不足 严格引体中非预期的摆动可能来自负荷过大、疲劳、技术或动作标准不清。先调整辅助、节奏和行程，不仅凭摆动就诊断某块核心肌无力或力量链断裂。 错误四：混淆借力引体与严格引体的目标 借力引体与严格引体是不同任务。若目标是评估严格拉力，就不能把借力完成的次数计入同一标准。对需要Kipping的运动项目，可单独教授其技术和负荷管理；急性肌电研究不足以断言它必然损害基础功能。 错误五：忽略体重与力量比的优化 引体向上需要克服自身体重，因此相对拉力和体成分都会影响表现。训练者可同时提升拉力与管理体成分，但现有研究不足以支持单一、普遍适用的数值化解锁门槛。"], [11, §5.5 进阶与退阶", "依据以下表现调整辅助程度与进阶速度： 1. 具备与个体水平相匹配的相对拉力和肩带控制能力；不采用未经验证的统一力量—体重比阈值 2. 具备足够的躯干稳定性 3. 熟悉严格引体向上的动作模式 4. 在既定体重和辅助条件下，能够完成目标范围与次数；不设置未经验证的体重门槛。 退阶训练方法： 地面控制练习：仰卧hollow或俯卧持棒练习躯干和上肢协调；作为准备任务，不替代逐步增加的实际拉力训练。 辅助引体：使用器械、弹力带或脚部支撑分担负荷，记录辅助方式，保持预定范围内的控制。 高位下拉：用于增加垂直拉训练量，按舒适度和可控性选择握法，不预设正握颈前对所有人最优。 严格正握引体：从可控悬挂开始，肩肘协调上拉，顶端可短暂停顿，再控制下放。 严格反握引体：在腕、肘、肩可耐受的范围内练习，不把反握等同于更高的关节稳定性。 毛巾引体：作为抓握挑战的变式，按能力增加负荷；不是已验证的肩胛不稳康复方法。 负重引体向上：在满足标准引体向上后，逐步增加外部负荷 不同握距引体向上：宽握、窄握交替训练 L-sit引体向上：在引体向上的同时维持L-sit姿态，增加核心挑战 Kipping引体向上：仅在已掌握严格引体向上的前提下，作为运动表现训练的补充手段。不建议作为基础训练方法"], [12, 6.1 解剖与功能", "划船是同时训练肩关节伸展、肘屈及肩胛控制的多关节拉力动作。俯身变式还增加维持躯干姿势的要求。它与部分搬运任务存在共同能力需求，但实际迁移取决于动作、负荷和任务是否相近 Marchetti等在14名受训男性中比较坐姿划船与肱二头肌弯举，观察6组10RM训练后的急性肌厚、臂围和峰力反应。划船的价值在于同时训练多个动作环节；是否还需弯举应按目标和训练量决定。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/32586082/"], [12, 6.1.1 斜方肌", "斜方肌覆盖颈后及上背，起始区域包括枕骨、项韧带和胸椎棘突等，止于锁骨外侧三分之一、肩峰及肩胛冈。可按纤维走向分为上、中、下部，各部分在具体动作中协同作用。 肩胛骨沿胸廓运动，来自胸锁关节和肩锁关节运动的耦合，并非绕脊椎作为固定轴旋转。抬臂时，斜方肌与前锯肌等协同参与肩胛上回旋、后倾及稳定。 以上中下三束的理解方式： 上斜方肌：上部纤维止于锁骨外侧三分之一，参与锁骨和肩带运动，并与其他肌群共同影响肩胛上回旋。其主要止点位于锁骨，并非肩胛骨上缘。 中斜方肌：与肩峰、肩胛冈相关，主要参与肩胛回缩及内侧稳定。 下斜方肌：纤维汇聚至肩胛冈内侧区域，参与肩胛上回旋、后倾和内侧稳定，在不同任务下也参与下降；不能只用向下拽的单轴模型解释。 Oyama等（2010）比较不同肱骨抬高角度、肱骨旋转及肘位组合下的肩胛、锁骨运动和肌电。该研究不能概括为W、T、Y动作中哪一束斜方肌一定最活跃，也没有进行同一动作内上、中、下束的统计排名。教学时需明确实际关节位置，而不是仅用字母形状推断肌肉贡献。"], [12, 6.1.1 斜方肌（续）", "Lehman等（2004）在12名健康男性的特定等长测试中，未发现额外主动夹肩胛显著增加中斜方肌、菱形肌组合信号。这不等于回缩在所有任务中没有作用；论文关于稳定性的讨论也不是本实验直接测得的临床结局。 Oyama等90°条件中的比较是肱骨中立位与肱骨外旋位，不是孤立的前臂旋前、旋后。两者肌电无显著差异；后倾的组间比较也未达到研究校正后的显著性阈值。作者讨论外旋位可能具有某些优势。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/25689561/ Badura等（2016）测量30具13—19周胎儿斜方肌的整体形态及各部分长度，没有报告上、中、下部各自表面积的排序。因此，不能由该研究推出下斜方肌面积最大或必须预激活。抬臂练习可以作为肩胛控制选择，角度和支撑方式应根据目标及耐受调整。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/27629832/ 斜方肌与姿势控制：斜方肌连接头颈、胸椎及肩带，参与上肢任务中的姿势协调。实际躯干稳定来自多结构、多肌群共同作用，不能只用一块肌肉解释。"], [12, 6.1.1 斜方肌（续）", "DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/24708652/ 抬臂和单侧拉动时，躯干肌群与肩带肌群共同应对力矩。以下肌电研究可说明任务相关的参与变化，但不能直接测定某肌是否承担主要脊柱稳定作用。 DOI:https://doi.org/10.1016/j.math.2016.05.331 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/26422610/ 这些研究支持肩带肌群参与相应上肢任务；肌电变化本身不能直接证明脊柱稳定程度、预测疼痛病因或决定康复疗效。"], [12, 6.1.2 背阔肌", "背阔肌作为划船动作中的关键主动肌，在拉动过程中承担主要的肩关节内收与伸展功能。其功能性表现在于将上肢从前方或侧方向躯干方向拉动。"], [12, 6.1.3 多裂肌与脊椎稳定肌群", "多裂肌与竖脊肌等参与俯身姿势下的躯干控制。自由重量、支撑、单双侧条件会改变需求。较高肌电既不自动意味着更危险，也不自动意味着更有益；应将其视为负荷分配信息，结合目标和耐受选用。"], [12, 6.2.1 划船与弯举：急性反应及训练用途", "Marchetti等的结果仅说明所测方案后的肘屈肌急性反应相近，不是长期增肌或训练效率的直接比较。划船可同时训练肩肘拉力，弯举则便于增加肘屈专项训练量，两者可依目标组合。"], [12, 6.2.2 肩胛骨预收的实际效果", "传统训练观念认为划船时应预先收缩肩胛骨以增加上背部激活。Lehman（2004）的研究对此提出修正： 划船时可允许肩胛随上臂自然前伸和回缩，不必全程强力夹紧。若出现明显翘起、疼痛或失控，可先调整负荷、支撑与范围；持续异常需要进一步评估。"], [12, 6.2.3 正手与反手抓握的差异", "Youdas等的悬挂划船研究及作者海报显示，在双脚支撑条件下，反握的背阔肌峰值肌电高于正握。结果来自26名健康人的急性测试，不能直接外推至俯身划船或长期增肌。握法选择可结合舒适度、上臂路径及训练目标，不必指定反握普遍更优。 DOI:https://doi.org/10.1519/JSC.0000000000001210（期刊发表于2016年，线上发表于2015年）"], [12, 6.2.4 不同划船变式的躯干稳定与肌肉激活比较", "Fenwick等人（2009）比较了悬挂划船（Inverted row）、站立俯身杠铃划船（Standing bent-over row）与站立单臂绳索划船（Standing 1-armed cable row，采用弓箭步站姿）三种方式的躯干肌肉激活与腰椎负荷。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/19197209/ 站立俯身杠铃划船在该比较中腰椎负荷较高；站立单臂绳索划船对抗旋转控制提出不同要求。结果反映这些实验条件下的负荷分配，没有证明所有分腿站姿都最不稳定，也未建立单臂绳索不可使用较大负荷的统一禁令。 动作选择建议： 希望降低俯身负荷者：可试用可调角度的悬挂划船、胸部支撑或坐姿划船，按症状与能力选择。 希望同时练习髋铰链和躯干负荷控制者：可逐步加入俯身划船，不以某变式最优为前提。 单臂绳索划船：调整站姿、辅助支撑和负荷，使旋转范围符合训练目标。"], [12, 6.2.5 不同支撑及单双侧条件下的躯干肌肉需求", "Saeterbakken等（2015）在15名受训男性中比较自由重量俯身、坐姿绳索及器械划船，并区分单侧与双侧条件。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/26134664/ 健康人的急性肌电研究不能诊断划船腰痛的原因。出现不适时可减少负荷、改变支撑或范围，观察反应；持续疼痛或伴进行性无力、麻木等表现时应进一步评估，而不是认定稳定肌募集不足。"], [12, 6.2.6 综合髋主导训练计划中的划船", "Rajic等（2020）让22名有经验女性舞者完成9周综合计划，包含宽站距深蹲、罗马尼亚硬拉、臀推和俯身划船等。跳跃及髋净关节力矩的变化属于整个计划的结果，不能单独归因于俯身划船。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7706665/"], [12, 6.3.1 髋铰链起始位置的建立", "俯身划船通常先以髋铰链形成预定躯干角度，并在重复中保持可控姿势。脊柱并非生理上绝不运动，也不能靠保持某一姿势消除全部剪切力；实际目标是选择当前负荷下能够耐受和重复控制的范围。 可以用轻负荷髋铰链练习熟悉俯身位置，不要求先熟练完成大负重硬拉。需要时从胸支撑或坐姿划船开始，再逐步减少支撑。"], [12, 6.3.2 躯干控制暖身的选择", "以下练习可用于熟悉躯干控制与负荷应对，不是人人必做的多裂肌预激活，也不用于仅凭动作表现诊断腰痛： 四足跪姿对侧肢体伸展（Bird-Dog） 熊爬姿势下单手轻重量硬拉模拟 四足跪姿下交替手触肩（类似卧推与划船的拮抗关系）"], [12, 6.3.3 胸椎段症状与负荷调整", "若划船出现胸背部疼痛，先减少负荷或使用胸部支撑，调整动作范围并观察反应。疼痛位置不能单独诊断斜方肌不足；反复、持续或伴功能异常时应接受评估。"], [12, 6.3.4 握法与上臂位置的指导", "区分前臂旋转与肱骨旋转。可按腕、肘、肩舒适度尝试握法，并观察上臂路径及肩胛控制；不以Oyama等研究宣称前臂旋后在中高负荷下必然更有效。Fujita等的急性研究提示专注背阔肌的口令可能改变早期重复的肌电，但不能保证整组或长期增肌效果。"], [12, 6.3.5 肩胛控制练习的安排", "可按需要加入抬臂或Y形练习，在舒适角度下练习肩胛与上臂协调。135°是一种选择，不能由胎儿斜方肌形态推导为人人必做。可用俯卧或其他支撑减少不必要的躯干摆动，负荷随控制与耐受逐步增加。"], [12, 6.4 常见错误", "1. 负荷超过当前控制能力：俯身角度或动作范围持续偏离目标时，可减少负荷或增加支撑；不直接归因为多裂肌无力或已经出现异常剪切损伤。 2. 颈肩动作与目标不符：非预期的耸肩、伸颈可能与负荷、疲劳或技术有关。调整负荷和提示后观察表现。 3. 单侧负荷进阶过快：当躯干旋转超出预定范围时，调整站姿、支撑或重量。没有证据把分腿站姿称为普遍最不稳定，也不一律禁止单臂绳索使用较大重量。 4. 只重复夹肩胛口令：若提示无效，应检查负荷、范围、支撑、症状和整体协调，而不是用同一口令强行固定肩胛。 5. 忽略持续疼痛：疼痛出现后继续加重而不调整。应观察负荷反应，必要时转介，不把胸椎痛等同于斜方肌稳定不足。"], [12, 6.5 进阶与退阶", "退阶选项（按支撑和负荷调整，不设固定难度排序）： 1. 悬挂划船：通过躯干角度、足部位置和支撑调整难度。Fenwick等所测条件下腰段竖脊肌活动及腰椎负荷较低，但不能保证对所有康复者都最合适。 2. 趴姿划船（Prone Row）： 胸部有支撑，进一步降低躯干稳定需求，适合躯干控制能力较差者。 3. 轻负荷俯身划船：在可重复控制的髋铰链位置开始，不设置必须先完成某种多裂肌激活的门槛。 4. 杠铃俯身划船：保持预定躯干角度与拉动路径，能完成计划次数且耐受良好后，再逐步增加负荷。 5. 大重量杠铃俯身划船： 在标准动作基础上增加负荷，对多裂肌、斜方肌的等长收缩能力提出更高要求。 6. 单手哑铃划船：单双侧和支撑方式共同决定躯干需求，可从有支撑到少支撑逐渐变化，不预设单手一定比所有双手形式更难。 主要参考文献 Paulo H Marchetti et al., 2020. https://pubmed.ncbi.nlm.nih.gov/32586082/ Sakiko Oyama, 2010."], [12, 6.5 进阶与退阶（续）", "https://www.jospt.org/doi/pdf/doi:10.2519/jospt.2010.3018 Gregory J. Lehman et al., 2004.https://doi.org/10.1186/1476-5918-3-4 Mateusz Badura, 2016. https://pubmed.ncbi.nlm.nih.gov/27629832/ [研究对象为人类胎儿13-19周龄] Maurice Curtin et al., 2014. https://pubmed.ncbi.nlm.nih.gov/24708652/ James W Youdas et al., 2016. https://pubmed.ncbi.nlm.nih.gov/26422610/ Angie Stephanie Vega Toro et al., 2016.https://doi.org/10.1016/j.math.2016.05.331 Masaaki Tsuruike et al., 2015."], [12, 6.5 进阶与退阶（续）", "https://pubmed.ncbi.nlm.nih.gov/25689561/ A Saeterbakken et al., 2015. https://pubmed.ncbi.nlm.nih.gov/26134664/ Chad M J Fenwick et al., 2009. https://pubmed.ncbi.nlm.nih.gov/19197209/ Sandro Rajic, 2020. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7706665/ Rafael A Fujita et al., 2020. https://pubmed.ncbi.nlm.nih.gov/32448047/"], [13, 本章导读", "面拉（Face Pull）通常使用绳索或弹力带，将握柄拉向面部附近，结合肩关节水平外展、外旋及肩胛控制。它可作为训练肩后侧肌群的一种选择。肘位、外旋幅度和器械拉力线不同，实际负荷分配也会改变；对体态、疼痛或损伤风险的影响，需结合整体训练方案及个体反应评价。"], [13, 7.1.1 后三角肌", "后三角肌（Posterior Deltoid）起自肩胛冈下缘，止于肱骨三角肌粗隆，参与肩关节水平外展与伸展。面拉中，上臂向后移动通常需要后三角肌参与，其贡献随上臂角度、拉力线及其他协同肌的作用而变化。"], [13, 7.1.2 冈下肌与小圆肌", "冈下肌（Infraspinatus）与小圆肌（Teres Minor）同属肩袖肌群，分别起自肩胛骨冈下窝与外侧缘背侧，止于肱骨大结节。两者参与肱骨外旋及盂肱关节控制。当面拉包含对抗外部内旋力矩的外旋阶段时，可对它们施加负荷；仅凭手柄靠近耳部，尚不能判断外旋负荷是否充分。"], [13, 7.1.3 中斜方肌", "中斜方肌（Middle Trapezius）起自下颈椎至上胸椎棘突区域，止于肩峰及肩胛冈，参与肩胛回缩和内侧稳定。面拉时，它与其他肌群协调肩胛和上臂运动，不要求先将肩胛固定后再完成全部外旋。"], [13, 7.1.4 下斜方肌", "下斜方肌（Lower Trapezius）主要由中下胸椎棘突向肩胛冈内侧端走行，参与肩胛上回旋、后倾及内侧稳定，并可在某些任务中参与下降。抬臂位置会改变其力学需求，实际参与程度还取决于负荷、支撑与协同肌。肩峰肱骨间距由多种因素共同影响，不能单独由某束斜方肌的激活判断。"], [13, 7.1.5 菱形肌", "菱形肌（Rhomboids）包括大、小菱形肌，起始区域涉及下项韧带及下颈、上胸椎棘突，止于肩胛骨内侧缘，参与肩胛回缩、下回旋和稳定。与中斜方肌的相对肌电活动可随任务改变；某次肌电比值较低，并不等于菱形肌长期过紧或已形成肩胛运动障碍。"], [13, 7.2.1 特定俯卧等长体位的肩胛后缩肌活动比值", "Fennell等（2016）在12名无肩痛者中，使用细针肌电比较俯卧、肩外展90°下的4个等长体位。其中，肩中立旋转、肘屈90°的row体位，其中斜方肌与菱形肌活动比值低于肩外旋、肘伸直的SER体位，差约22%。 该比值描述两块肌肉在特定等长任务中的相对活动，不代表其中一块停止参与。研究未直接测量动态面拉、标准划船、肩胛运动或长期训练后的体态与疼痛。 DOI:doi:10.3138/ptc.2014-83 PMID: 27504044 PMCID: PMC4961314 链接: https://pubmed.ncbi.nlm.nih.gov/27504044/ Escamilla等（2009）的综述汇总了多种肩部康复练习的肌电与功能资料，包括外旋、俯卧水平外展及划船等。它可用于理解练习选择范围；不同体位的优劣仍需结合直接比较、个体目标和临床情况判断。 DOI:doi:10.2165/00007256-200939080-00004 PMID: 19769415 链接: https://pubmed.ncbi.nlm.nih.gov/19769415/"], [13, 7.2.2 肌电比值与肩胛运动的解释范围", "中斜方肌主要参与回缩和内侧稳定，菱形肌还参与下回旋；肩胛上回旋则由斜方肌与前锯肌等协同完成。肌电振幅及其比值反映神经肌肉活动的部分信息，不能直接换算成肩胛的净力矩或运动方向。 练习库可以同时包含划船、面拉及其他肩部动作，以覆盖不同的上臂角度和负荷需求。目前本章所引研究没有证明长期划船会导致肩胛下回旋卡锁或溜肩，也未证明面拉能够避免这些变化。体态及症状变化应通过实际随访判断。"], [13, 7.2.3 90／90双弹力带外旋的平面差异", "Tsuruike等（2020）研究21名无症状大学棒球运动员，在站姿90／90体位，即肩外展和肘屈约90°，执行等长及震荡外旋，比较额状面与肩胛平面。该任务是双弹力带外旋练习，与绳索从前方向面部拉动的标准面拉不同。 其中，冈下肌（IS）、前锯肌（SA）与大圆肌（TMa, Teres Major）在肩胛平面上的肌电振幅均显著高于额状面。需注意，该论文测量的肌肉列表中不包含中斜方肌（Middle Trapezius），TMa在Tsuruike 2020中特指大圆肌（Teres Major）。 该研究还发现，双弹力带在额状面上使用时，小圆肌（TMi）与下斜方肌（LT）的激活水平显著高于单弹力带条件。 DOI:doi:10.1177/1941738120935441 PMCID: PMC7485019 链接: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7485019/ 结果说明不同平面和弹力带条件可产生不同肌肉参与模式。肩胛平面中冈下肌、前锯肌和大圆肌活动较高，额状面双带条件对小圆肌和下斜方肌的需求也有变化。大圆肌主要参与内收、内旋，其肌电较高不能自动视为外旋训练更优。可根据训练目标选择任务，避免把一种平面规定为所有面拉的唯一标准。"], [13, 7.2.4 不同外旋体位的肩带肌肉参与", "Alizadehkhaiyat等（2015）在30名健康人中，以1公斤负荷比较5种外旋练习。俯卧90°条件下斜方肌活动较高，侧卧条件中斜方肌表现较高；具体显著差异需按研究成对比较解释。由于体位和外展角度同时变化，结果不能简化成站姿90°外展普遍优于0°。 练习选择应先明确希望训练的能力，再选择能够耐受的体位与负荷。Reinold等（2004）也比较了常见外旋练习的肩袖及三角肌肌电，为动作变化提供参考，但两篇研究都不直接证明面拉对长期增肌或康复的优势。 PMCID: PMC4687830 链接: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4687830/"], [13, 7.2.5 季前旋转力量与后续损伤的关联", "Hams等（2019）测量15名亚精英水球运动员的季前肩内旋、外旋等长力量，并随访6个月。随后受伤与未受伤者的绝对内、外旋平均力量存在差异，力量比值及按BMI标准化力量未见显著差异。 该观察研究提示旋转力量可能为风险评估提供信息。过顶运动员的训练需同时考虑既往伤史、专项负荷、恢复和肩部功能，面拉只是可选练习之一。 PMID: 31066126 链接: https://pubmed.ncbi.nlm.nih.gov/31066126/"], [13, 7.2.6 体态与肩胛控制的可能联系", "胸椎姿势、肩胛运动及肱骨位置相互影响，但可见的圆肩或胸椎后凸并不自动构成病理。面拉可用于练习肩胛与上臂协调；是否改善特定体态或症状，需要在整体方案中持续观察。 其一，后缩相关练习可提高训练者在相应负荷下控制肩胛的能力。静态体态还受骨骼形态、习惯、舒适度及任务影响，力量增加并不保证肩胛长期停留在某一位置。 其二，下斜方肌与前锯肌等共同参与肩胛后倾和上回旋。肩胛与肱骨之间存在复杂的相对运动，肩胛前倾不能简单理解成将肱骨头向前推。Ludewig等（2009）的骨针运动学研究描述了不同平面抬臂时的肩复合体运动，有助于理解这种协同关系。 面拉和划船可根据目标组合使用。本章所引肌电研究没有直接比较两者对长期体态的效果。Cools等（2014）的临床推理综述强调结合个体功能与运动需求选择肩胛练习，其建议不等于某一动作已被证明可以矫正所有肩胛运动问题。"], [13, 7.3.1 绳索高度与起始体位", "滑轮可先调至面部附近，再根据身高、绳长和目标轨迹调整。站距应使起始和终末位置均有可控阻力；可采用并步或前后错步，躯干角度以稳定、舒适为准。1—1.5米站距及轻微前倾可作为尝试位置，不能跨器械固定使用。"], [13, 7.3.2 握法与拉动轨迹", "采用绳索时双手握住绳端，拉动过程中允许肩胛随上臂协调移动。若目标包含较高上臂位置的水平外展与外旋，可让肘部接近肩高，双手移向面部两侧。具体肘高和终点由可用活动度、拉力线及症状决定。"], [13, 7.3.3 外旋终末阶段", "若本组目标包含肩外旋，应确认末端外旋确实对抗外部力矩，而非单纯移动手腕。可在舒适终点停顿约1秒检查控制，不强行让双手越过耳后。末端停顿是一种教学选择，并非已证实的肌电峰值位置。"], [13, 7.3.4 离心控制", "回程保持可控速度，例如用约2—3秒释放阻力，避免器械突然回弹。节奏可按负荷和目标调整；慢速回程用于控制训练剂量，不保证比其他速度产生更好的长期效果。"], [13, 7.3.5 呼吸配合", "一般轻中负荷练习可采用拉动呼气、回程吸气，保持自然呼吸。屏气不必然导致耸肩；涉及较大负荷或特殊健康状况时，应按任务和个人情况调整呼吸策略。"], [13, 7.3.6 平面与上臂角度选择", "可从舒适的肩胛平面附近尝试，再根据器械拉力线和目标调整肘部轨迹。Tsuruike等的结果来自90／90弹力带外旋，不能直接规定所有面拉都应在额状面前方30°—40°完成。"], [13, 7.4 常见错误", "错误一：肘位与本组目标不符。若计划练习较高位水平外展，肘部反复下降时可减少负荷、调整滑轮或缩短范围。较低肘位本身也可以构成有效的拉力练习，关键是动作与训练目标一致。 错误二：计划训练外旋却未产生相应动作和负荷。可降低阻力，在可控范围内让上臂外旋，区分上臂旋转与手腕翻转。活动受限者不必强行完成末端角度，可另选外旋练习。 错误三：颈肩运动破坏目标轨迹或引发症状。上斜方肌是正常肩胛上回旋协同肌，参与较多不自动等于代偿。出现非预期的耸肩、伸颈或不适时，调整负荷、角度和支撑，再观察反应。 错误四：借助过大的躯干摆动完成拉动。当目标是肩部控制时，可减少阻力或增加支撑，使躯干保持预定范围。无需把脊柱规定为完全不动，也不凭摆动判断已产生损伤。 错误五：负荷超出当前可控范围。不同滑轮系统的配重数字不等于相同手端拉力，不能通用规定初学者必须使用5—10公斤。可先选择能保留约2—4次余力、完成8—20次的阻力，再按目标调整组数；这是编程示例，进阶依据动作表现及当次、次日反应。"], [13, 7.5 进阶与退阶", "支撑变式一：侧卧弹力带拉动。适当支撑可减少部分躯干控制需求，使注意力集中于目标轨迹；仍需根据固定点和拉力线确认动作。侧卧外旋也是独立练习选择，与侧卧面拉的负荷方向不同。 支撑变式二：仰卧弹力带拉动。确认固定点可靠，在舒适范围内练习。地面支撑会改变肩胛可动范围，并不必然使所有人更容易。 站姿绳索面拉：以面部附近的滑轮高度为起点，肩肘和肩胛协调拉动，按目标加入外旋。使用可重复的范围、负荷与节奏记录表现。 任务变化一：90／90双弹力带外旋或震荡。此练习与标准面拉分开教授，需具备相应活动度及负荷控制。Tsuruike等仅报告急性肌电差异，是否适合个体应依据目标和耐受判断。 任务变化二：单臂面拉。单侧拉力可改变躯干旋转力矩，具体需求还取决于站姿和支撑。可用它练习肩部与躯干协调，不预设比双臂形式更高级。 任务变化三：面拉后抬臂至Y形。作为连续组合，可在面拉后将手臂向斜前上方抬起，肩胛随之上回旋。角度可在舒适范围内选择，约135°是示例；负荷和动作范围分别进阶，不因行程更大就认定更适合所有人。"], [13, 参考文献", "1. Fennell J, Phadke CP, Mochizuki G, Ismail F, Boulias C. Shoulder retractor strengthening exercise to minimize rhomboid muscle activity and subacromial impingement. Physiother Can. 2016;68(1):24-28. doi:doi:10.3138/ptc.2014-83.PMID:27504044. 2. Escamilla RF, Yamashiro K, Paulos L, Andrews JR. Shoulder muscle activity and function in common shoulder rehabilitation exercises. Sports Med. 2009;39(8):663-685. doi:doi:10.2165/00007256-200939080-00004.PMID:19769415. 3."], [13, 参考文献（续）", "Tsuruike M, Ellenbecker TS, Lauffenburger C. The application of double elastic band exercise in the 90/90 arm position for overhead athletes. Sports Health. 2020;12(5):495-500. doi:doi:10.1177/1941738120935441.PMID:32720852. 4. Alizadehkhaiyat O, Hawkes DH, Kemp GJ, Frostick SP. Electromyographic analysis of the shoulder girdle musculature during external rotation exercises. Orthop J Sports Med. 2015;3(11):2325967115613988. doi:doi:10.1177/2325967115613988.PMID:26740950. 5."], [13, 参考文献（续）", "Hams AH, Evans K, Adams R, Waddington G, Witchalls J. Shoulder internal and external rotation strength and prediction of subsequent injury in water-polo players. Scand J Med Sci Sports. 2019;29(9):1414-1420. doi:doi:10.1111/sms.13459.PMID:31066126. 6. Reinold MM, Wilk KE, Fleisig GS, et al. Electromyographic analysis of the rotator cuff and deltoid musculature during common shoulder external rotation exercises. J Orthop Sports Phys Ther. 2004;34(7):385-394."], [13, 参考文献（续）", "doi:doi:10.2519/jospt.2004.34.7.385.PMID:15296366. 7. Cools AM, Struyf F, De Mey K, et al. Rehabilitation of scapular dyskinesis: from the office worker to the elite overhead athlete. Br J Sports Med. 2014;48(8):692-697. doi:doi:10.1136/bjsports-2013-092148.PMID:23687006. 8. Ludewig PM, Phadke V, Braman JP, et al. Motion of the shoulder complex during multiplanar humeral elevation. J Bone Joint Surg Am. 2009;91(2):378-389. doi:doi:10.2106/JBJS.G.01483.PMID:19181982."], [6, 8.1 解剖与功能", "肩推（Overhead Press）是上肢垂直推的代表动作。抬臂推举需要盂肱关节、肩胛与锁骨运动协调；站姿还增加了维持躯干和下肢支撑的要求。坐姿、跪姿和站姿肩推提供不同的支撑条件，可根据力量、肌肥大、动作控制或专项目标选择，不必排成固定的优劣顺序。"], [6, 8.1.1 前三角肌", "前三角肌（anterior deltoid）起自锁骨外侧三分之一前缘，止于肱骨三角肌粗隆，参与肩前屈、内旋及相关推举任务。肩推是训练前三角肌的常用动作，具体参与程度受体位、器械、轨迹和负荷影响，现有研究不足以将它列为所有人的唯一最佳动作。"], [6, 8.1.2 中三角肌与后三角肌的协同", "中三角肌起自肩峰，后三角肌起自肩胛冈，均止于肱骨三角肌粗隆。中束参与外展，后束参与伸展、水平外展及随体位变化的旋转作用。在肩推中，各束与肩袖及其他肌群协同产生和控制力矩。表面肌电只能描述部分活动。"], [6, 8.1.3 肩胛骨稳定肌群（前锯肌、下斜方肌、上斜方肌）", "肩胛骨的稳定由多组肌群协同完成。在肩推动作中，以下三组肌群的作用尤为关键： 前锯肌起自上部肋骨外侧面，通常描述为第1—8或第1—9肋骨，止于肩胛骨内侧缘前面。它参与肩胛前伸、上回旋、后倾及贴近胸廓的控制。Richardson等（2020）汇总了躯干和下肢参与对肩部肌电的影响，不同任务的结果并不完全一致。 下斜方肌主要起自中下胸椎棘突，止于肩胛冈内侧区域，与前锯肌等共同参与肩胛上回旋、后倾及稳定。其参与是正常控制的一部分，单块肌肉的激活不能保证预防所有翼状肩胛。 上斜方肌主要起自枕部、上项线及项韧带相关区域，止于锁骨外侧三分之一，参与肩带上提及肩胛上回旋协同。肩推中正常的肩带上提不应一概视为代偿。Bagchi与Raizada（2016）研究的是前平举变式。"], [6, 8.1.4 肩袖肌群在肩推中的力学角色", "肩袖由冈上肌、冈下肌、小圆肌及肩胛下肌组成，既参与肱骨运动，也通过协同受力控制盂肱关节。稳定是动态过程，肱骨头存在正常的微小平移；不能用完全不移动来定义正常，也不能把肩袖作用缩减为单一的压紧功能。 改变躯干、下肢和支撑条件可能改变肩胛肌及肩袖的参与。某些非动力链练习中冈下肌肌电较高，但这不表示肩袖直接承担肩胛稳定功能，也不说明坐姿肩推必然使肩袖过载。选择体位时应结合负荷、目标和个人耐受。"], [6, 8.1.5 动力链：核心与下肢的力量传递", "动力链（kinetic chain）描述身体不同部位在支撑、运动及力传递中的相互联系。严格站姿肩推需要下肢支撑与躯干控制；借力推举还利用下肢蹬伸产生动量。两者技术目标不同，动作表现也不能单独诊断某一脊柱节段不稳定。 跨区域练习可改变肩部肌肉参与模式。可按目标组合使用。可根据训练目标组合使用，而非只选择形式更复杂的动作。"], [6, 8.2.1 站姿 vs 坐姿肩推：Saeterbakken 2013 的发现", "Saeterbakken 等人（2013）以 15 位健康男性为受试者，进行了 1RM 哑铃肩推与杠铃肩推的测试，比较站姿与坐姿两种体位下的力量表现。 研究中，站姿哑铃肩推1RM比站姿杠铃低约7%，比坐姿哑铃低约10%。站姿哑铃的三角肌肌电较高，却是所测条件中1RM最低者。急性肌电较高与可举重量较大并不等同；这项研究也没有比较长期增肌或损伤结果。 实践中，外部支撑、器械和任务复杂性会共同影响表现。希望增加可举负荷时可选择较稳定条件，希望练习站姿负荷控制时可采用相应版本；两类目标可同时纳入计划，并分别记录进步。"], [6, 8.2.2 动力链对肩胛稳定肌激活的影响：Richardson 2020", "Richardson等（2020）的系统综述纳入健康人肩部肌电研究，讨论加入躯干和下肢运动后肩部肌肉募集如何变化。 所纳入的11项研究采用不同动作和比较条件：下斜方肌在5项研究中呈较高活动、5项无显著差异；前锯肌结果同时存在增加、减少和无差异；冈下肌的多数相关比较更偏向局部练习。总体提示任务会影响募集模式，但未证明每种动力链动作都提高表现或减轻肩袖负荷。 实践中可依据目标选择站姿或坐姿肩推：站姿通常增加全身稳定需求，坐姿允许减少部分躯干与下肢自由度。两者的急性肌电差异不应直接解释为长期力量、肌肥大或损伤风险差异。"], [6, 8.2.3 肩推时肩胛骨与锁骨的运动学特征：Ichihashi 2014", "Ichihashi等（2014）在16名健康男性中，以2公斤负荷比较军姿推举与肩前屈，分析30°—120°抬臂范围内的肩胛及锁骨运动。 在所测条件下，军姿推举相比肩前屈出现较少肩胛内旋、较多上回旋和后倾。这描述的是健康人轻负荷任务间的即时差异，没有验证对肩胛运动障碍或神经源性翼状肩胛的治疗效果。 锁骨运动也随任务改变，说明头上推举需要肩复合体协调。健康样本中的运动差异不能解释为普通抬臂缺失了必要成分，或证明负重推举对肩痛者更安全。"], [6, 8.2.4 胸椎姿态与肩关节功能的关系", "胸椎姿势可影响当次肩部活动范围和肌肉参与。以下研究有助于区分即时运动学变化与长期疼痛、损伤结局： 胸椎姿势与肩痛。Barrett等（2016）的系统综述未发现肩痛与无肩痛人群胸椎后凸程度存在一致的显著差异；较直立姿势可能增加当次肩部活动范围，但长期临床意义仍不明确。 胸椎位置与即时力量。Kebaetse等（1999）在34名健康人中比较坐姿条件。含胸位肩外展范围减少约23.6°，手臂水平位的等长力降低约16.2%。该结果支持急性姿势效应，并非长期损伤因果证据。 静态体态与肩痛之间并非简单因果关系。胸椎姿势可能即时改变肩关节活动范围和肌肉募集，但个体差异较大；评估应结合症状、动态肩胛运动、活动度与力量，而不应仅凭“圆肩/驼背”作出诊断或处方。 Malmström等（2015）发现含胸姿势降低上肢活动范围，并改变上、下斜方肌及前锯肌的肌肉工作指标。肌电变化并不能直接证明组织过载或预测未来肩痛；研究也未检验在肩推前进行特定暖身的疗效。 对抬臂受限或改变姿势后表现改善者，可试用胸椎活动与控制练习；若现有范围已能舒适完成推举，则不必将固定胸椎准备动作设为统一门槛。"], [6, 8.2.5 不稳定负荷肩推的急性反应", "Williams等（2020；线上发表于2018年）在12名健康男性中，以约50% 1RM比较三种杠铃稳定条件下的肌电和足底压力中心变化。 不稳定杠铃条件提高了部分肌肉的肌电活动，并增加压力中心摆动。研究没有直接测量本体感觉、临床关节稳定性或长期康复效果。这种负荷可用作特定控制任务，但不能仅因不稳定就把它视为更有效的康复工具。"], [6, 8.2.6 阿诺德推举与前平举研究的区别", "阿诺肩推（Arnold Press）是哑铃肩推的旋转变式，起始位通常掌心朝向身体，推起过程中逐渐旋转至掌心朝前。目前关于阿诺肩推相对普通哑铃肩推的直接研究数量少、样本小，证据不足以断言其能优先强化前三角肌或降低上斜方肌参与；动作选择应以无痛活动范围、控制能力和训练目标为依据。 Bagchi与Raizada（2016）的10人研究比较三种前平举。Raizada与Bagchi（2017）另在10名健康男性中比较阿诺德推举与普通哑铃肩推各5次，报告前、中三角肌急性肌电差异。"], [6, 8.3.1 保护原则一：症状与功能分流", "训练前了解肩部症状、外伤和既往脱位史，观察主动上举及轻负荷耐受。教练记录表现并决定是否调整训练或转介，不能通过外观或几项动作测试确认肩袖结构完整。 盂肱关节的滚动、滑动及旋转共同参与抬臂。活动受限或不稳感可能涉及不同因素，不能仅由体态或抬臂角度判断肱骨头黏着、前移或半脱位。 脱位是关节面失去正常对合的医学事件，常涉及创伤或既有不稳定。普通肩胛或脊柱姿势、较大的手臂肌肉量不能直接作为脱位或下半脱位的诊断依据。外伤后明显畸形、不能抬臂、进行性麻木或无力，应及时接受医疗评估；教练不尝试复位。 活动受限的处理应依据病因。Satpute等（2015）研究了由治疗者实施的背后手动态关节松动术（MWM），对象为急性肩痛及活动障碍者。该临床手法的结果不能直接转化为教练用弹力带自行牵拉肱骨头的通用方案；普通训练可先调整范围、负荷和动作，再依据评估决定是否需要治疗。 以下介绍临床肩袖特殊试验的研究背景，帮助教练理解医疗报告。试验由具备相应资质的医疗人员结合病史、多个检查及必要影像解释；阴性不能保证肌腱完整，单独疼痛也不能确诊撕裂。"], [6, 8.3.1 保护原则一：症状与功能分流（续）", "（1）冈上肌相关检查。Sgroi等（2018）在115名有肩症状者中比较常用检查。Empty Can和Full Can等试验需区分疼痛与力量下降，研究提示明显无力较单纯疼痛更有助于识别撕裂。 Empty Can通常在肩胛平面抬臂约90°并使上臂内旋，Full Can采用拇指向上位置，临床检查者施加向下阻力并分别记录疼痛和力量。两侧差异需结合优势侧、既往能力及症状解释，不能以疼痛即阳性作为统一的撕裂判定规则。 （2）冈下肌相关检查。Sgroi等（2019）纳入91名拟行肩关节镜检查者，比较多种临床测试；该样本并非91名已确诊冈下肌损伤患者。外旋抗阻与落臂相关表现必须按研究中的标准及临床背景解释。 外旋力量测量应固定肩外展角度、肘位及测力方式。例如肘屈约90°、上臂靠近体侧的测量，应与外展位测量分别记录。Kelly等（1996）讨论不同肩袖手法肌测位置的肌电参与，属于募集研究，不是肌腱撕裂的诊断准确性验证。 （3）小圆肌相关检查。Collin等（2015）在大面积肩袖撕裂患者中比较临床检查对小圆肌情况的识别能力。该人群的结果有助于专科评估，但不能直接用于无症状健身人群的常规筛查。"], [6, 8.3.1 保护原则一：症状与功能分流（续）", "外旋延迟征观察检查者将手臂置于外旋位后，受试者能否主动保持。在该大面积撕裂样本中，延迟超过10°的敏感度为100%、特异度51%；超过40°时敏感度仍为100%、特异度提高至92%。这些数值依赖样本和实施方法，不是教练自行检查的通用诊断阈值。 （4）肩胛下肌相关检查。Lift-Off、Belly-Press等是临床评估选择。Bartsch等（2010）在50名拟行关节镜患者中发现Lift-Off敏感度40%、特异度79%，部分患者因疼痛和范围受限无法完成；因此一次表现正常不能排除全部撕裂。 Lift-Off观察受试者将手背置于腰后并主动抬离的能力，解释时需考虑力量、疼痛及内旋活动度限制。 若出现持续疼痛、突然无力、反复不稳或功能下降，应调整训练并按情况转介。是否暂停某负荷取决于症状和功能，不能用统一的6RM界线代替个体判断。2025年肩袖肌腱病临床实践指南强调结合评估制定主动康复和重返活动方案（doi:doi:10.2519/jospt.2025.13182；PMID:40165544）。"], [6, 8.3.2 保护原则二：肩胛骨与锁骨的启动策略", "肩推中肩胛与锁骨需要随上臂协调运动。Ichihashi等的健康人轻负荷结果不能保证翼状肩胛在推举中更易控制。可观察主动抬臂和轻负荷推举，按实际表现选择支撑、范围和重量。 需要时可在准备阶段使用轻负荷抬臂、前锯肌相关练习或简化推举，练习舒适的肩胛运动。是否加入俯卧或跪姿动作应依据当前需求，不要求人人先孤立启动某块肌肉。"], [6, 8.3.3 保护原则三：胸椎活动度准备", "胸椎活动练习可用于改善当次抬臂舒适度或可用范围，但并非所有肩推前的必做环节。应比较准备前后的动作和症状，保留对本人有帮助的内容。 可选练习之一是开书运动（open book），用于轻柔练习躯干旋转和上肢协调： 1. 受试者取侧卧位，双膝屈曲 2. 上方手臂从前方缓慢向后打开，如同翻开一本书 3. 在舒适范围内打开上臂及躯干，不强求肩胛或手臂接触地面。 4. 下肢提供支撑，避免靠强拉手臂追求末端；实际牵拉感受随个体改变。 5. 保持呼吸和可控回程，出现肩痛、麻木或放射感时调整范围。 开书运动可作为准备活动之一，其作用应由训练者的即时反应判断。它不是肩推动作成功的必要前提，也不能仅由所谓筋膜链连接推断每一处组织都获得了相同伸展或激活。"], [6, 8.3.4 站姿肩推的执行口令与动力链整合", "根据所选器械和训练目标使用以下提示，再观察提示是否改善表现： 1. 起始位：选择舒适站距，双脚稳定承重，躯干保持预定位置，以适度腹部张力配合呼吸。 2. 握持位：杠铃置于肩前，或哑铃位于两侧舒适位置；腕、肘与器械受力方向尽量协调，握距按个体调整。 3. 推起阶段：肩与肘协同推起，肩胛随抬臂上回旋。杠铃经过面部时可小幅调整头部避让，避免过大的颈腰摆动。 4. 顶端阶段：在可控范围内伸肘，重量保持在稳定支撑上方，允许正常肩带上提；不要求额外强推至个人活动末端。 弹力带、轻哑铃或有支撑推举可用于学习过渡。土耳其式起身是可选的多步骤控制任务，需要独立教学，并非肩推的必修前置动作。若躯干明显偏离目标，可先减轻负荷、调整范围或支撑，再分析原因。"], [6, 8.3.5 呼吸配合策略", "轻中负荷可采用推起呼气、回程吸气。较大负荷下部分训练者会短暂屏气以增加躯干刚度，但其血压和胸内压反应需结合健康状况考虑。腹内压只是稳定机制之一，不以全程憋气或追求最大压力作为人人通用的要求。"], [6, 错误一：腰椎过度伸展（腰椎代偿性前凸）", "错误描述：推起重量时腰部姿势出现明显、难以控制的伸展变化。它可能与负荷、疲劳、活动范围或技术策略有关，不能单凭外观认定肩或胸椎活动度不足。 躯干后仰会改变肩部所需角度及腰椎负荷分配；是否产生不适取决于幅度、负荷、能力及个体状况。 纠正方法：先减少负荷或缩短行程，使用适度躯干张力提示；按需要尝试坐姿或其他支撑。胸椎练习只有在改善当前动作时才保留，不将开书运动视为固定解决方案。"], [6, 错误二：颈椎前引（头颈前探）", "错误描述：推起重量时头部明显前探或颈部姿势不适。先检查杠铃路径、负重与动作范围，再按实际需要调整，不由外观直接判断胸椎受限。 明显、非预期的头颈移动可能增加局部控制需求或引发不适，但不能仅由外观计算C5—C7剪切力或判定动力链断裂。 纠正方法：调整握距及器械路径，用小幅头部避让让杠铃通过；也可尝试哑铃。若仍不舒适，减少负荷和范围，评估是否需要进一步处理。"], [6, 错误三：肩胛骨控制不良（翼状肩胛）", "错误描述：肩胛内侧缘或下角出现明显翘起，尤其伴疼痛、力量下降或动作控制改变。外观不能单独识别前锯肌或下斜方肌抑制，也不等同于神经损伤诊断。 肩胛控制变化可能影响负荷分配，也可能是症状后的适应。出现新发、明显或持续的翼状表现时，应结合病史和神经肌肉评估分析，不能只用肌肉激活口令处理。 纠正方法：选择可耐受的轻负荷和支撑，观察肩胛随上臂的运动。需要时加入专项控制练习；若伴持续功能下降或明显无力、麻木，应转介。"], [6, 错误四：握持和肘部位置与负荷方向不协调", "错误描述：起始或推起时腕肘与器械支撑关系难以控制，或既定肘部轨迹反复偏移。肘朝前不等于肩内旋，也不等于肘部外展。 上臂平面、握距和前臂方向会共同影响外部力矩。不能单凭肘部朝向判断肱骨头前移或前侧结构异常应力；应结合器械路径、舒适度及负荷表现调整。 纠正方法：在轻负荷下寻找舒适握距和肘位，使腕肘能够控制器械。杠铃和哑铃的合适轨迹可能不同，不把前臂在所有视角完全垂直规定为唯一标准。"], [6, 错误五：严格肩推与借力推举的目标混淆", "严格站姿肩推主要由上肢完成推举，下肢提供稳定支撑，不要求每次屈膝蹬伸。若目标是借力推举，则需教授相应的下肢驱动和时序。 站姿的支撑与控制要求不同于坐姿，但没有证据证明未主动蹬伸就无法激活前锯肌或下斜方肌。应按目标评价重复标准，避免把严格肩推误判为动力链参与不足。 纠正方法：严格肩推保持稳定下肢支撑和可控躯干；借力推举单独练习屈膝蹬伸与上肢衔接。难以控制时降低负荷或增加支撑。"], [6, 错误六：非预期的左右偏移", "错误描述：杠铃或哑铃在推起过程中偏向一侧，或偏离头颈正上方，出现左右不对称的推起轨迹。 非预期的轨迹偏移可能来自负荷、疲劳、技术或活动范围差异。轻微不对称不自动等于损伤；突然出现、伴疼痛或力量下降时，应降低负荷并进一步评估。 纠正方法：① 使用哑铃肩推替代杠铃，允许双侧独立运动，减少强势侧代偿；② 从较轻负荷开始，专注双侧对称性；③ 评估是否存在已有的肩关节功能不对称，必要时进行针对性干预。"], [6, 8.5 进阶与退阶", "进退阶可通过负荷、活动范围、器械和支撑条件分别调节。坐姿、跪姿和站姿是不同任务选项，不是所有人必须依次通过的发育阶段。一次改变一个主要变量，更便于判断训练反应。"], [6, 支撑与范围调整选项", "调整选项 动作 支撑条件 适用方式 水平推过渡 仰卧哑铃地板推 背部由地面支撑 属于水平推，可练习推力与器械控制；不等同头上推，也不固定用于某一康复阶段 跪姿选项 高跪姿哑铃肩推 双膝支撑 改变下肢支撑方式，按膝部耐受、平衡与躯干控制选择 跪姿选项 半跪姿哑铃肩推 单膝支撑 不对称支撑改变平衡及躯干力矩；肌电和难度依具体负荷、侧别而变"], [6, 常用肩推形式", "形式 动作 支撑条件 关键特征 杠铃 站姿杠铃肩推 双脚支撑 双手共同控制杠铃，练习站姿负荷控制 哑铃 站姿哑铃肩推 双脚支撑 双手独立控制；Saeterbakken研究中1RM较低而三角肌肌电较高。阿诺德推举含上臂旋转与抬举，不只是前臂旋前旋后"], [6, 特定目标的任务变化", "任务选项 动作 支撑条件 关键特征 摆动负荷控制 站姿不稳定负荷肩推 双脚支撑，使用可靠的专用器械与连接 可增加部分肌电和压力中心摆动；未直接证明改善本体感觉或临床稳定性 单腿控制 单腿站姿哑铃肩推 单脚支撑 降低可用负荷并改变平衡要求；仅在目标需要且能够控制时采用，不默认比双脚更有效 下肢驱动 借力推举 双脚支撑并主动屈膝蹬伸 利用下肢动量辅助推举，属于不同技术任务；按目标教授时序和负荷，不与严格肩推次数混计 当疼痛明显增加、出现突然无力或不稳、动作在降负后仍失控，或次日反应持续恶化时，应回退负荷与范围，并按情况接受评估。选择本人能完成的支撑形式即可，不必统一回到死虫或从低位重新学习全部动作。 本章参考文献汇总 1. Saeterbakken AH, Fimland MS. Effects of body position and loading modality on muscle activity and strength in shoulder presses. J Strength Cond Res. 2013;27(7):1824-1831."], [6, 特定目标的任务变化（续）", "doi:doi:10.1519/JSC.0b013e318276b873. 2. Richardson E, Lewis JS, Gibson J, et al. Role of the kinetic chain in shoulder rehabilitation: does incorporating the trunk and lower limb into shoulder exercise regimes influence shoulder muscle recruitment patterns? Systematic review of electromyography studies. BMJ Open Sport Exerc Med. 2020;6:e000683. doi:doi:10.1136/bmjsem-2019-000683. 3. Ichihashi N, et al."], [6, 特定目标的任务变化（续）", "Kinematic characteristics of the scapula and clavicle during military press exercise and shoulder flexion. J Shoulder Elbow Surg. 2014;23(5):649-657. doi:doi:10.1016/j.jse.2013.11.014https://doi.org/10.1016/j.jse.2013.11.014 4. Barrett E, O'Keeffe M, O'Sullivan K, Lewis J, McCreesh K. Is thoracic spine posture associated with shoulder pain, range of motion and function? A systematic review. Man Ther. 2016;26:38-46. doi:doi:10.1016/j.math.2016.07.008. 5. Kebaetse M, et al."], [6, 特定目标的任务变化（续）", "Thoracic position effect on shoulder range of motion, strength, and three-dimensional scapular kinematics. Arch Phys Med Rehabil. 1999. https://pubmed.ncbi.nlm.nih.gov/10453773/ 6. Malmström EM, et al. A slouched body posture decreases arm mobility and changes muscle recruitment in the neck and shoulder region. Eur J Appl Physiol. 2015.https://doi.org/10.1007/s00421-015-3257-y 7. Williams MR, et al. Activity of shoulder stabilizers and prime movers during an unstable overhead press."], [6, 特定目标的任务变化（续）", "J Strength Cond Res. 2020;34(1):73-78. doi:doi:10.1519/JSC.0000000000002660https://doi.org/10.1519/jsc.0000000000002660 8a. Bagchi A, Raizada S. Electromyographical investigation of anterior deltoid and trapezius muscles during three different variations of front raise. International Journal of Physical Education, Sports and Health. 2016;3(6):56-59. 8b. Raizada S, Bagchi A."], [6, 特定目标的任务变化（续）", "Electromyographical investigation of anterior deltoid and middle deltoid during Arnold dumbbell press and overhead dumbbell press. Indian J Public Health Res Dev. 2017;8(4):653-656. doi:doi:10.5958/0976-5506.2017.00411.9. 9. Satpute KH, Bhaskar AR, Hall T, et al. Efficacy of Hand Behind Back Mobilization With Movement for Acute Shoulder Pain. J Manipulative Physiol Ther. 2015. https://pubmed.ncbi.nlm.nih.gov/26099206/ 10. Sgroi M, et al."], [6, 特定目标的任务变化（续）", "Diagnostic Value of Clinical Tests for Supraspinatus Tendon Tears. Arthroscopy. 2018. PMID:29802066. 11. Sgroi M, et al. Diagnostic Value of Clinical Tests for Infraspinatus Tendon Tears. Arthroscopy. 2019. PMID:30770251. 12. Kelly BT, et al. The Manual Muscle Examination for Rotator Cuff Strength. Am J Sports Med. 1996. doi:doi:10.1177/036354659602400504https://doi.org/10.1177/036354659602400504 13. Collin P, et al."], [6, 特定目标的任务变化（续）", "What is the Best Clinical Test for Assessment of the Teres Minor in Massive Rotator Cuff Tears? Clin Orthop Relat Res. 2015;473. https://pmc.ncbi.nlm.nih.gov/articles/PMC4523548/ 14. Bartsch M, Greiner S, Haas NP, Scheibel M. Diagnostic values of clinical tests for subscapularis lesions. Knee Surg Sports Traumatol Arthrosc. 2010;18(12):1712-1717. doi:doi:10.1007/s00167-010-1109-1. 15. Narasimhan R, Shamse K, Nash C, Dhingra D, Kennedy S."], [6, 特定目标的任务变化（续）", "Prevalence of subscapularis tears and accuracy of shoulder ultrasound in pre-operative diagnosis. Int Orthop. 2016;40(5):975-979. doi:doi:10.1007/s00264-015-3043-9.PMID:26585865."], [5, 本章导读", "卧推是便于逐步加重和记录上肢推力表现的常用动作，其早期形式可追溯至大力士的地面仰卧推举实践。现代卧推通常使用训练凳和杠铃，也可采用哑铃或器械变式。教学重点是建立适宜的支撑、握持、活动范围与保护措施，使负荷能够稳定进展。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6162793/ 卧推可量化上肢水平推力，功能价值取决于训练目标。生活中仰卧推物较少，并不意味着它训练的力量没有用途；专项迁移仍需结合目标任务练习。 Rogers等（2017）在295名乳腺癌幸存者中比较等长握力与卧推1RM。握力不能很好替代卧推表现，提示两者测量不同的力量维度；研究没有证明卧推对所有人都更准确。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5276727/ Kikuchi与Nakazato的8周研究纳入18名年轻男性，每组9人，比较约40% 1RM卧推与相近负荷的俯卧撑，观察到相近的部分力量及肌肥大变化。结果适用于该卧推便于调节外部负荷，俯卧撑便于使用自身体重，两者均可按目标选择（doi:doi:10.1016/j.jesf.2017.06.003；PMID:29541130）。"], [5, 9.1.1 胸大肌", "胸大肌由锁骨内侧、胸骨及上部肋软骨等区域起始，肌腱汇聚止于肱骨结节间沟外侧唇。常按锁骨部和胸肋部描述，亦可进一步区分腹部纤维；具体分区随研究定义而异。上肢固定时，它可能参与辅助吸气，但不是日常安静呼吸的主要动力。 胸大肌参与肩关节内收、水平内收及内旋，各部分还具有随肩位变化的屈伸作用。卧推由胸大肌、前三角肌、肱三头肌等协同完成；产生内旋力矩并不要求每次推举都出现可见的肱骨内旋动作。 Lehman等（2005）在12名男性的5种等长卧推条件中测量表面肌电。握法和握距可改变部分胸肌活动，但急性等长肌电不能直接证明长期锁骨部肥大，也不足以把宽握反握列为唯一有效的上胸训练。区域训练还需结合倾角、可用范围、训练量与持续进步评价。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/16095407/ 胸大肌撕裂是卧推相关文献报道的损伤之一。Thompson等的综述讨论了患病群体、治疗与恢复，但未给出按是否使用合成代谢药物分层的训练发生率。出现急性撕裂感、明显瘀斑、胸部形态改变或突然无力时应停止训练并就医；不能因未用药就推断个人损伤概率很低。"], [5, 9.1.2 三头肌", "肱三头肌由长头、外侧头和内侧头组成，共同止于尺骨鹰嘴。长头起自肩胛盂下结节，另外两头主要起自肱骨后面。三头都参与伸肘；长头跨肩、肘两关节，也参与肩伸展和内收。 关于三头肌三头在肩关节不同角度下的分工，Kholinne等人（2018）通过肌电图实验进行了观察： DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6136322/ Kholinne等（2018）在10名健康成人中比较不同肩抬举角度下的伸肘任务：低抬举角度与较高角度呈不同的肌头参与模式。 卧推训练中的肩、肘症状有多种可能来源。现有本章研究没有证明肱二头肌腱炎是所有卧推损伤中最常见者，也没有证明更强的三头肌能直接保护二头肌腱。训练应关注总负荷、动作耐受与恢复，持续前肩痛或明显无力需进一步评估。"], [5, 9.1.3 前三角肌", "前三角肌在卧推中作为重要协同肌参与肩关节前屈动作。在卧推动作的向心阶段，前三角肌与胸大肌、三头肌协同完成上推。"], [5, 9.2.1 卧推的保护原则：五个关键支撑点", "执行卧推时追求上手臂的稳定支撑性，以确保力量在手部的传递健康有效。与手臂支撑地面时类似，卧推时须关注以下五个关键稳定点： 1. 肩胛与凳面接触：选择舒适、稳定且可重复的位置，不要求测定统一的肩胛冈角度。 2. 盂肱关节耐受：观察主动活动和轻负荷表现，结合既往症状调整范围。 3. 肩锁区域症状：了解既往损伤和当前不适，必要时转介。 4. 肘部控制：在目标范围内平稳屈伸，不靠被动撞击式锁死完成重复。 5. 腕部与握持：使负荷尽量对齐前臂支撑，使用可靠握持并观察症状。 注：此\"五个关键稳定点\"是对卧推中涉及的五个关节层面稳定性的分析框架，与NSCA标准教材中的\"五点身体接触（five-point body contact：头、上背、臀部及双脚）\"为不同概念。"], [5, 9.2.2 手腕关节的保护", "握力测试中的最佳腕位不一定等于卧推的最佳腕位。Scordino等（2016）的研究使用尸体腕及模拟俯卧撑任务，不能直接用于计算完整健康腕在卧推中的损伤风险。 在舟月骨间韧带已切断的实验条件下，伸腕位跨舟月关节的拉力约45 N，中立位约25 N。该差异属于病理模型中的测量，不是完整韧带承受上限，也不是健康训练者损伤概率的1.8倍。Tang、Werner等的相关腕部研究同样须保留离体及韧带损伤条件。 实践中让杠铃尽量位于前臂支撑线上方，允许舒适、可控的小幅伸腕。若负荷将腕部持续压向不能控制的末端，或出现疼痛、麻木，应减轻负荷、调整握持或停止练习。 月状骨或周月状骨脱位属于需要医疗处理的腕部损伤，常与明显创伤有关，可伴疼痛、肿胀、活动受限及正中神经症状。Bhatia等（2017）的个案说明脱位可能造成神经压迫，并不能支持通常无痛或长期卧推必然加重脱位的说法。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5221394/ Murphy征曾用于临床个案观察，但握拳外观不能由教练用于排除腕骨不稳，也未建立6RM训练阈值。有明确创伤、持续疼痛或肿胀、畸形、抓力下降、麻木者应停止相关负重并接受骨科或手外科评估。"], [5, 9.2.3 肘部负荷与疲劳管理", "Morrey等（1991）的离体研究考察肘外翻约束，指出内侧副韧带复合体为主要约束、桡骨头为次要约束。它没有研究卧推或建立携带角20°的训练门槛。顶端应按训练目标和竞赛标准受控伸肘，不以撞击式锁死换取稳定。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/2009657/ 关于卧推疲劳对手肘的影响，Yen-Po Huang等人（2014）的实验发现： DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4080597/ 疲劳可能使速度、轨迹和关节力矩发生变化。一般训练可根据余力、技术与症状决定停组点；新手或有症状者可预留余力并使用保护措施。 旋后肌从肱骨外上髁、相关韧带及尺骨旋后肌嵴等部位起始，止于桡骨近端，参与前臂旋后。将杠掰弯是一种动作提示，其效果可能涉及肩、前臂及握持协同，不能当作已经验证的旋后肌精准激活或肘部稳定治疗。"], [5, 9.2.4 肩关节的保护与活动度评估", "卧推下放深度受胸廓、臂长、握距、凳面位置及肩部耐受影响。竞技标准可能要求触胸，一般训练可选择可控范围。单独的肩伸50°—60°不能作为所有人的训练准入阈值；必要时使用地板推或限幅方式建立基线。 有肩锁区域疼痛或既往不稳者，应按症状、评估结果和负荷耐受调整，不用统一6RM界线判断安全性。"], [5, 9.2.5 握距的探讨", "根据Wagner等人（1992）的定义，卧推握距可分为窄握（约95%肩峰间距）、正常握（约100-150%肩峰间距）和宽握（165-200%肩峰间距）。 Larsen等（2021）在14名有训练经验的男性中比较握距，宽握和中握的1RM高于窄握。握距同时改变动作范围和杠铃路径，结果属于该样本及测试条件。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7862765/ Pérez-Castilla等（2021）在19名男性中使用史密斯机，以75% 1RM完成单组至力竭，不同握距的重复次数和速度损失未见显著差异。该结果不能扩展为任何器械、所有训练方案的总容量都相同。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/33504038/ 握距、关节角度、动作范围和路径会同时变化。两项不同协议研究不能将重量差异完全归因于杠铃轨迹，握距本身的力学作用。"], [5, 9.2.5 握距的探讨（续）", "Lockie等关于传统及窄握卧推的研究显示，两者的负荷、速度和功率特征可能不同。窄握可作为上肢推力训练选项，但研究没有直接验证它对所有爆发力项目具有更高迁移。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/29339982/ 选择握距应服务于目标，并用相同动作标准记录表现。最大负荷、速度、动作范围和局部舒适度是不同指标，不能合并为单一的训练效率排名。 握距建议：从舒适、可重复的常用握距建立基线，再逐步调整。宽握在部分样本中有更高1RM，窄握则提供不同关节需求；两者的专项价值应由后续表现判断。"], [5, 9.2.6 肩胛骨后缩的讨论", "Jagessar（2018）比较卧推时肩胛活动、上臂角度及下背位置等条件下的肌电。其结果主要描述急性活动变化，没有直接测定临床盂肱关节稳定性。 DOI: https://thesportjournal.org/article/an-investigation-of-the-effects-of-frontal-plane-glenohumeral-joint-angle-scapular-mobility-and-lower-back-orientation-of-the-horizontal-bench-press-on-electromyographic-activity-of-four-muscles-for/ UCPM与LSPM分别指胸大肌的锁骨部和胸肋部，不是上、下斜方肌。未见统计学差异也不等于所有人、所有负荷下都没有影响。"], [5, 9.2.6 肩胛骨后缩的讨论（续）", "Borges等（2019）比较杠铃卧推与固定式推胸器械的肌电及肩胛带运动，为器械间差异提供参考： DOI: https://www.researchgate.net/publication/334170772 研究报告的约7.8°和19.8°是特定器械条件下的肩胛带活动范围，并非肩胛冈相对地面的理想固定角度。它们不能导出卧推时肩胛必须保持5°—20°的处方。 Hoshikawa等（2021；线上发表于2020年）在8名健康男性的肩胛平面抬举30°—150°中，用剪切波弹性成像观察冈下肌分区，未测试卧推。冈下肌作用于肱骨外旋并参与盂肱关节控制，不是肩胛骨外旋肌。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8105206/ 肩胛骨位置小结： 肩胛和上背应与凳面形成可控支撑，在舒适范围内调整回缩程度；不从肩胛冈估算统一角度。 杠铃和器械会改变运动自由度与肌肉参与，单次肌电结果可作为参考。"], [5, 9.2.7 腰椎起桥的讨论", "关于起桥存在两种常见说法： 说法一：起桥缩短杠铃移动距离以推起更大重量。 Jagessar研究中的平背、抬脚和起桥条件涉及多个变量。部分肌电无显著差异，不能推出平背在相同重量下长期训练效果更好。抬脚还会改变支撑与平衡需求，应与保持双脚支撑的平背卧推分别理解。 说法二：起桥使肩胛骨更贴平长椅以增加稳定。 起桥通常涉及胸椎伸展、腰椎前凸及肩胛回缩程度变化，可缩短杠铃行程。肩胛运动受凳面约束，不能直接借用俯卧撑的角度数据规定卧推姿势。一般训练可保留舒适自然弧度；竞技技术应另按规则和专项需求练习。 García-Ramos等（2018）在11名有经验的训练者中比较平背与起桥卧推： DOI:https://doi.org/10.1080/14763141.2018.1544662 Bartolomei等（2024）在15名高训练水平受试者中观察到起桥平均1RM高约4.2公斤、杠铃位移较短，而平背速度较高。不同结果进一步提示应按目标和个体选择（PMID:38551927）。 起桥可改变支撑、活动范围及可举负荷；不以更大的弧度作为所有人的技术目标。 双脚支撑的平背、自然小弧度、竞技起桥和抬脚卧推是不同任务，没有适合所有人的肌电或长期训练优劣排序。"], [5, 9.2.8 影响卧推重量的综合因素", "Stastny等（2017）的系统综述纳入14项研究，讨论影响卧推肌电的6类因素。以下区分急性肌电观察与训练处方： 1. 外部负荷：增加负荷常伴较高神经肌肉活动，但不同肌肉、阶段和研究条件的变化并不完全相同。 2. 动作速度：速度要求及实际速度均可能改变参与模式，需区分主动快速意图与因疲劳而变慢。 3. 不稳定条件：支撑面变化和负荷摆动是不同任务，其肌电反应不能归为统一的刺激增加。 4. 疲劳：肌电和杠速可能同时变化，不能由某一肌电方向单独判断长期适应或损伤概率。 5. 注意与口令：专注某块肌肉在部分负荷和任务中可改变肌电；效果不一定持续到高负荷或全组末段。 6. 动作阶段：黏滞区前后不同肌肉的参与变化有助于分析技术，但不能仅靠表面肌电确定所有结构的受力。 训练组数需结合目标、周总量、恢复和长期进步安排，不由上述急性肌电综述给出每周四组与五组效果相同的结论。 压力袖等辅助装备的效果需由独立研究评价；其使用不能替代握持、负荷、保护装置及技术管理。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5295722/"], [5, 9.3.1 保护原则前置评估", "训练前进行简短的症状与负荷准备检查： 腕部：询问创伤、疼痛、麻木及抓力变化。出现明显异常时转介，不用握拳外观排除月状骨问题。 肩肘：了解既往损伤，观察主动活动及轻负荷耐受，依据症状调整器械、握距和范围。 肘屈伸与肩位：用可重复方式观察活动范围和不适。拳头能否碰肩受多种因素影响，不能单独诊断三头肌长头或全部三头肌紧绷，也不必先全面泡沫轴放松才训练。"], [5, 9.3.2 肩胛与凳面支撑", "躺稳后让上背与凳面充分接触，选择舒适的肩胛回缩程度，试做轻负荷重复。以轨迹、症状和支撑可重复性判断，不规定肩胛冈与地面必须夹5°—20°。"], [5, 9.3.3 腕部与负荷对齐", "握持时使杠铃尽量落在前臂支撑线上方，避免负荷失控地压向腕伸末端。护腕可作为辅助，但出现疼痛、麻木或抓力改变时仍应调整或停止训练。"], [5, 9.3.4 口令的个体化使用", "可试用将杠掰弯等提示帮助控制上臂轨迹，但应观察它是否使握持和动作更舒适。该口令不能保证精准激活旋后肌，若增加腕肘不适则换用其他提示。"], [5, 9.3.5 杠铃轨迹控制", "杠铃路径随握距、臂长、胸廓、负荷及技术改变。先建立可重复且舒适的下放点和上推轨迹，不强行将所有人的路径规定为同一条斜线。"], [5, 9.3.6 动作末端的肘关节伸直", "顶端按目标范围受控伸肘，力量举等项目另遵循规则要求。避免被动撞击式锁死；没有证据证明只有完全锁肘才能获得稳定。"], [5, 9.4 常见错误", "1. 腕部负荷失控：杠铃偏离前臂支撑且腕部被持续压向末端，或出现疼痛、麻木。应调整握持、减重或停训，不将其直接诊断为舟月韧带松弛或月状骨脱位。 2. 用外观阈值诊断肘部风险：携带角大小不能单独决定卧推资格。明显疼痛、不对称或既往脱位史需进一步评估；Morrey研究不支持外侧副韧带及20°阈值的处方。 3. 疲劳后仍强行完成失控重复：杠速和轨迹变化时应结合余力、保护条件与症状停组。旋前条件肌动力下降46%不等于旋后力矩或伤害率变化，也不构成所有人禁止力竭的依据。 4. 强制肩胛固定在统一角度：可用凳面支撑帮助控制，不应追求未经验证的5°—20°阈值。 5. 未明确目标就追求大幅起桥或完全平背：根据专项规则、舒适度、行程和负荷表现选择，避免用单次肌电作长期优劣判断。"], [5, 9.5 进阶与退阶", "支撑与范围调整选项： 1. 地板卧推：地面限制上臂下放深度，可用于较短行程的推力练习。保留舒适的躯干弧度，不强求腰椎完全压平。 2. 抬脚卧推：减少足部支撑，改变躯干和平衡任务，不必然比普通卧推简单，也未证明同重量下增肌更好。选择较轻负荷并设置可靠保护。 3. 器械推胸：轨迹和支撑便于调节，可为部分初学者提供练习条件；康复用途需结合具体症状和评估，不能凭器械名称指定康复阶段。 4. 杠铃卧推：采用舒适握距、可控行程及稳定支撑，按目标选择自然弧度或专项起桥。先熟悉安全杠、出入架和保护人员配合，再增加负荷。 5. 哑铃卧推：双手独立控制、可用负荷通常低于杠铃。Saeterbakken等报告胸大肌和前三角肌活动相近、三头较低、二头较高；Ferreira等的恢复研究未证明哑铃普遍恢复更快。酸痛程度不能单独判断恢复是否完成。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/27100318/ 6. 窄握卧推：改变肘肩力矩、负荷及速度特征，是否有助于专项表现需结合项目评估，不将其普遍称为更具功能性。 7."], [5, 9.5 进阶与退阶（续）", "摆动负荷卧推：改变控制需求和部分肌电，须使用可靠装置、适当轻负荷及保护条件。它是特定任务选择，不是力量或增肌训练的必经进阶。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/32941526/ 8. 瑞士球或其他不稳定支撑推举：Saeterbakken等研究中6RM较低，胸大肌和肱三头肌活动约为稳定凳的81%和69%。该研究不支持腹部及前三角肌统一增加70%的说法；需要较高稳定外部负荷时，稳定凳通常更便于实施。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/22692120/ 不同器械选择总结： 目标包含杠铃卧推最大力量：优先安排相应器械和技术练习。 希望双侧独立控制或调整轨迹：可使用哑铃，并按实际可举负荷记录。 恢复安排：结合训练量、表现、酸痛及疲劳综合判断，不按器械设定固定恢复天数。"], [5, 9.5 进阶与退阶（续）", "不同器械对肌肉激活与恢复的差异（Saeterbakken et al., 2011; Ferreira et al., 2017）： DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/21225489/ Saeterbakken等（2011）的实验中，哑铃负荷比史密斯机低约14%、比杠铃低约17%。较高自由度的哑铃条件胸大肌及前三角肌活动相近、二头肌较高、三头肌较低。"], [5, 9.5.1 卧推变式：躯干角度", "Lauver等（2016）比较0°、30°、45°与−15°条件的急性肌电，水平卧推可提供胸大肌不同区域的综合参与，部分上斜条件可能提高锁骨部活动。角度选择还需考虑负荷与舒适度。 DOI/PMID: https://pubmed.ncbi.nlm.nih.gov/25799093/ Rodríguez-Ridao等（2020）同样发现倾角改变胸大肌区域与前三角肌的参与；较大上斜角度时前三角肌需求更突出，不能将其概括为胸肌整体越练越多。 DOI/PMID: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7579505/ 若强调锁骨部胸大肌，可尝试较小上斜角度，如15°—30°，再观察可用负荷和长期表现；水平推也可作为基础选择。急性肌电差异不能直接确定最佳长期增肌动作。"], [5, 卧推执行流程总结", "1. 了解既往肩肘腕问题，观察主动活动和轻负荷耐受，设置安全装置及保护。 2. 明确水平推力、增肌或专项表现等目标，选择可量化、可持续的训练方案。 3. 建立舒适的上背与足部支撑，按目标选择弧度；必要时调整行程或器械。 4. 从舒适常用握距开始，逐步尝试变化并保留一致的记录标准。 5. 受控屈伸肘，保持可靠握持；口令以实际改善表现为准。 6. 下放范围结合目标、体型和肩部耐受，不用统一肩伸角度判断准入。 7. 观察轨迹、余力和症状，技术持续失控或出现明显异常时结束组。 主要参考文献 Kikuchi N, Nakazato K. Low-load bench press and push-up induce similar muscle hypertrophy and strength gain. 2017. doi:doi:10.1016/j.jesf.2017.06.003.PMID:29541130. • Ogasawara R, et al. 24周卧推肌厚变化研究（与上述8周俯卧撑比较为不同研究）."], [5, 卧推执行流程总结（续）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3831787/ Petr Stastny et al., 2017. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5295722/ Irineu Loturco et al., 2018. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6162793/ Benjamin H. Rogers et al., 2017. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5276727/ Jin Bo Tang, 2002. https://pubmed.ncbi.nlm.nih.gov/11918300/ Frederick W Werner, 2007. https://pubmed.ncbi.nlm.nih.gov/17218176/ M. Bhatia et al., 2017."], [5, 卧推执行流程总结（续）", "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5221394/ Yen-Po Huang et al., 2014. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4080597/ Kamali Thompson et al., 2020. DOI:https://doi.org/10.1080/00913847.2019.1637301 Gregory J Lehman, 2005. https://pubmed.ncbi.nlm.nih.gov/16095407/ B F Morrey, 1991. https://pubmed.ncbi.nlm.nih.gov/2009657/ Erica Kholinne et al., 2018. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6136322/ Miguel Jagessar, 2018."], [5, 卧推执行流程总结（续）", "https://thesportjournal.org/article/an-investigation-of-the-effects-of-frontal-plane-glenohumeral-joint-angle-scapular-mobility-and-lower-back-orientation-of-the-horizontal-bench-press-on-electromyographic-activity-of-four-muscles-for/ Wagner et al., 1992. DOI:https://doi.org/10.1123/IJSB.8.1.1 Stian Larsen et al., 2021. https://pmc.ncbi.nlm.nih.gov/articles/PMC7862765/ Alejandro Pérez-Castilla et al., 2021. https://pubmed.ncbi.nlm.nih.gov/33504038/ Robert G Lockie et al., 2017."], [5, 卧推执行流程总结（续）", "https://pubmed.ncbi.nlm.nih.gov/29339982/ Robert G Lockie et al., 2018. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6162370/ Atle H Saeterbakken et al., 2011. https://pubmed.ncbi.nlm.nih.gov/21225489/ Diogo V Ferreira et al., 2017. https://pubmed.ncbi.nlm.nih.gov/27100318/ Jakob D Lauver et al., 2016. https://pubmed.ncbi.nlm.nih.gov/25799093/ David Rodríguez-Ridao et al., 2020. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7579505/ Lawrence Michael A, 2017."], [5, 卧推执行流程总结（续）", "https://journals.lww.com/nsca-jscr/Fulltext/2017/05000/NonlinearAnalysisofanUnstableBenchPress_Bar.6.aspx Atle Hole Saeterbakken et al., 2020. https://pubmed.ncbi.nlm.nih.gov/32941526/ Stastny等（2017）的卧推肌电综述参见本表；低/高负荷腿举的肌电研究不作为本章卧推处方依据。 Atle H Saeterbakken et al., 2013. https://pubmed.ncbi.nlm.nih.gov/22692120/ Ishii S, et al., 1998. 三角纤维软骨复合体离体解剖研究（腕部背景资料）. doi:doi:10.1016/S0363-5023(98)80003-8.PMID:9848546."], [5, 卧推执行流程总结（续）", "Amador García-Ramos et al., 2018.https://doi.org/10.1080/14763141.2018.1544662 Eduardo Borges et al., 2019. https://www.researchgate.net/publication/334170772 Hoshikawa K, et al., 2021（线上发表于2020年）. https://pmc.ncbi.nlm.nih.gov/articles/PMC8105206/ Bartolomei S, et al., 2024. 平背与起桥卧推比较. https://pubmed.ncbi.nlm.nih.gov/38551927/"], [9, 本章导读", "分腿蹲是训练单侧下肢力量、平衡与负荷控制的常用动作。原地分腿蹲（split squat）保持双脚位置相对固定；弓箭步（lunge）包含跨步及回收，两者的平衡与制动要求不同。本章以原地分腿蹲为教学基础，并讨论相关变式。教练可观察足、膝、髋与骨盆在任务中的协调表现，再调整支撑、步距、幅度和负重。该动作可用于一般体能及部分康复训练，具体用途须结合训练目标、症状、恢复阶段和专业评估。"], [9, 10.1.1 臀中肌", "臀中肌（Gluteus Medius）位于臀部外上方，起自髂骨外面，止于股骨大转子，主要参与髋外展和单腿支撑时的骨盆控制。不同纤维束的作用及力臂随髋关节位置改变：前部纤维可参与内旋，后部纤维可参与外旋，因此不宜把整块臀中肌的功能概括为外展与外旋。 在分腿蹲中，臀中肌通过以下两个机制发挥作用： 其一，臀中肌参与支撑侧髋部的额状面控制，并与其他髋部肌群、膝部肌群和足踝肌群共同完成任务。缩足运动主要训练足部内在肌与足弓控制，可作为辅助练习。教练可同时观察足底接触、膝的运动方向及髋部控制，但任何一项外观偏移都不能单独证明臀中肌无力或未充分激活。 其二，臀中肌与躯干、骨盆周围肌群共同限制单腿支撑时过大的骨盆侧倾。分腿蹲中若出现难以控制的侧倾，可先降低负重或深度、增加手部支撑，并练习缓慢的骨盆控制。骨盆下沉与回正可作为独立练习，不要求在每次分腿蹲中主动向对侧下沉。 Presswood 等人（2008）的应用性综述介绍了臀中肌解剖、评估和渐进训练。侧卧力量检查及以下功能任务可提供观察线索；它们涉及多个关节和肌群，不能视为经该文验证、能够独立诊断臀中肌功能障碍的测试： 1."], [9, 10.1.1 臀中肌（续）", "从静态双脚站立进入单脚站立，观察骨盆是否出现下沉； 2. 单脚站立姿势下同时举起站立脚同侧手臂，观察骨盆能否维持稳定； 3. 行走过程中观察是否出现骨盆下沉。 若上述任务中骨盆控制困难，应结合疼痛、平衡、躯干策略、活动度和力量评估，选择相应练习。臀中肌与阔筋膜张肌可共同参与髋部控制，单一任务表现受多种因素影响。"], [9, 10.1.2 阔筋膜张肌与髂胫束", "阔筋膜张肌（Tensor Fasciae Latae, TFL）参与髋屈曲、外展和内旋，并经髂胫束参与下肢力的传递。Evan Osar 在《Corrective Exercise Solutions to Common Hip and Shoulder Dysfunction》（2012，第102—103页）提出了其代偿臀中肌额状面控制的临床解释。这属于专业著作中的解释框架，可用于提出评估假设，不能单独确立个体的疼痛原因或肌肉代偿诊断。 靠近骨盆一端，肌纤维含量较高的阔筋膜张肌与远端筋膜含量较高的髂胫束（Iliotibial Band, ITB）功能不同。近端肌肉主要参与髋关节运动与骨盆稳定； 根据 Godin 等人（2017）的研究，远端髂胫束在膝关节区域参与构成前外侧复合体，分为三层结构：浅层 ITB 广泛止于胫骨 Gerdy 结节；深层 Kaplan 纤维分为两束，均止于股骨远端外侧；被囊骨性层（capsulo-osseous layer）与关节囊融合，止于胫骨外侧结节。 Godin 等人的研究说明了远端髂胫束的附着与力学结构。大腿外侧不适可能涉及负荷变化、局部组织敏感性和多种运动策略。出现持续疼痛或功能受限时，应由相应专业人员评估；无痛训练者可按实际力量和平衡需求安排髋部训练，无须一律通过加强臀中肌来抑制阔筋膜张肌。"], [9, 10.1.3 股四头肌与肌腱系统", "股四头肌通常包括股直肌、股外侧肌、股内侧肌和股中间肌四个部分，是膝伸展的主要肌群。解剖研究还描述了股中间肌张肌等可变结构。分腿蹲下降时，股四头肌通常以离心方式控制膝屈曲；上升时通过膝伸展产生动力。 肌腱连接肌肉与骨骼，在受拉时可发生形变，并在适当条件下储存和回馈弹性能量。其作用取决于肌肉力量、肌腱形变和动作时序。反向跳等动作可利用伸长—缩短过程，但跳跃高度还受力量、速度、协调及下蹲幅度影响，并非下蹲越深就一定跳得越高。分腿蹲中的肌腱负荷与跳跃中的快速储能、释能需求也不相同。 肌腱储能取决于所承受的力、伸长量以及几何和材料特性。在线性近似下，储能约为力与伸长量乘积的一半：同样外力下，刚度较大的肌腱伸长较少，储能并不必然更多；同样伸长量下则需更大的力。肌腱的刚度和形态可随长期负荷发生适应。训练应提供渐进且可恢复的机械负荷，不能将匀速或固定节律认定为提高刚度的唯一最佳方式。"], [9, 10.2.1 分腿蹲在肌腱负荷渐进方案中的定位", "分腿蹲作为不对称踏步动作，可为单侧肌腱负荷的渐进式设计提供灵活性。 Baxter 等人（2021）在8名健康成人中，估算并比较了多种康复练习的跟腱负荷。所测动作的峰值负荷约从坐姿提踵的0.5倍体重至单腿向前跳的7.3倍体重不等，提示动作选择可用于安排不同等级的负荷。弓箭步是其中的一种选择；研究没有测定“能量传递效率排名”，也没有证明分腿蹲的效率最高。估算结果来自特定技术和健康样本，实际处方还需考虑负重、速度、幅度与症状。"], [9, 10.2.2 肌腱刚性可通过运动训练获得适应性改变", "肌腱会对训练负荷产生适应，但变化方向及临床意义取决于健康状态、训练剂量和测量方法。肌腱刚度、疼痛与功能应分别评价，不能把刚度增加直接等同于康复成功。 Andarawis-Puri 等人（2018）的机制综述讨论了肌腱损伤后的愈合与重塑，包括动物模型中不同加载时机和剂量的作用。部分早期加载可能加重疲劳损伤，而合适时机的加载可能促进重塑。因此，动物跑台实验不能直接换算为伤后人群每日跑步30—60分钟的处方。 Visnes 等人（2007）回顾了7项研究、合计162名受试者，认为离心训练可能有助于髌腱病的治疗，但研究方案差异较大，最佳剂量及实施方式尚不确定。该结论针对临床症状与功能，不能笼统理解为所有肌腱机械能力均显著改善。 Lee 等人（2020）研究了34名男性运动员接受12周离心训练后的变化，发现髌腱刚度降低、应变增加与部分临床结局改善存在关联。这是特定髌腱病样本中的关系。 上述研究提示肌腱具有负荷适应能力，但健康训练和肌腱病康复的目标不同。健康训练者可渐进提高负荷耐受与力量；有肌腱病者应按症状、功能、训练后反应及恢复阶段安排负荷。判断效果时，应同时记录疼痛、功能和训练耐受，避免仅用某一刚度指标评价进展。"], [9, 10.2.3 分腿蹲变式与足踝肌群活动", "保加利亚分腿蹲将后脚抬高，改变双腿的负荷分配与平衡要求。前腿实际承担的负荷还受步距、重心、支撑方式和外加负重影响。 Kim 等人（2017）对30名健康受试者的短时肌电比较发现，保加利亚分腿蹲中胫骨前肌与腓骨长肌活动高于普通弓箭步蹲，胫骨后肌未见显著差异。上述三块肌肉属于足的外在肌；腓骨长肌主要参与外翻和跖屈，不能归为内翻肌。 Aguilera-Castells 等人（2019）让20名活跃男性在不同条件下完成保加利亚分腿蹲，每个条件测试5次重复，比较了后脚悬吊、前脚不稳定支撑及附加振动的影响。后脚悬吊虽然改变了前脚负重，并未一致提高所测前腿肌肉活动；部分BOSU或振动条件提高了特定肌肉的短时活动。结果不等同于长期力量、增肌或康复效果更好。"], [9, 10.3.1 足底支撑与下肢协调", "先建立舒适、可重复的足底接触，使脚跟与前足保持可控支撑。缩足练习可用于感知足弓变化，但不要求所有训练者持续把足弓收紧或完全限制足部旋转。可用膝盖大致顺着脚趾方向移动作为初步口令，再根据个体结构、步距与目标调整。 观察前脚足弓、脚跟、膝和髋的协同变化，并结合平衡与症状判断是否需要调整。正常承重包含一定足弓形变和关节运动；出现明显失控、疼痛或无法重复的动作时，可降低负荷、缩小幅度或增加支撑，不凭外观直接判定某块肌肉未激活。"], [9, 10.3.2 骨盆额状面的稳定控制", "选择能够控制的骨盆姿势，避免在疲劳中突然侧倾或扭转。轻度可控的骨盆运动未必是错误。若控制困难，可用手扶支撑、减小幅度或单独练习骨盆下沉与回正，再逐步整合进分腿蹲。 髋部肌肉活动受姿势与任务影响。Lee 等人（2014）在臀中肌无力者的侧卧等长外展中观察到，特定内旋条件可提高臀中肌与阔筋膜张肌的肌电比值；Sidorkewicz 等人（2014）也研究了非负重练习中的髋部方向。两者均不能直接推导负重分腿蹲的固定内旋或外旋口令。蚌壳式、侧卧外展和骨盆控制可按需求选用，短时肌电比值不证明其能预防髂胫束综合征。"], [9, 10.3.3 分腿蹲的系统教学流程", "教学流程分为以下步骤： 首先，询问近期损伤、疼痛和负荷变化，再观察有支撑的分腿站立与浅幅屈伸。出现疼痛时停止诱发动作，并根据持续性及功能影响决定调整或转介。Renne试验属于临床诱发症状的检查，通常关注负重屈膝约30°—40°时的外侧膝痛；它不是“单脚蹲到最低点”，也不能由阳性结果直接判断阔筋膜张肌紧绷。教练的动作观察用于训练分流，不替代临床诊断。 其次，建立舒适的足底支撑；必要时用缩足或轻负荷平衡练习帮助感知。 第三，从有支撑或徒手的分腿蹲开始，在能够控制、症状可接受的范围内练习，随后逐步增加幅度或负重。一次优先调整一个主要变量，并记录训练后反应。 最后，根据力量、平衡或专项需求选择保加利亚分腿蹲等变式；变式并非所有人的必经进阶。"], [9, 10.4 常见错误", "1. 膝部运动突然失控：若膝在下降或上升时突然明显偏移，并伴随疼痛或平衡丧失，应降低负荷或调整支撑。膝向内移动受髋、足踝、躯干和任务策略等因素影响。 2. 足底支撑难以控制：正常承重允许一定足弓形变。若足部不适或失去稳定接触，可调整步距、鞋具、幅度和负荷，必要时使用扶持；无需为了保持足弓外形而接受危险的晃动。 3. 骨盆侧倾或旋转失控：先检查支撑条件、负重和动作幅度，再考虑平衡、活动度及力量等因素。可降低深度或加入骨盆控制练习，但不由单一外观诊断臀中肌或腰方肌功能不足。 4. 前膝移动超出当前控制能力：膝向前移动是许多分腿蹲技术的一部分，本身不是错误。根据训练目标、足底接触、症状和负荷耐受选择移动幅度，避免突然失控或用疼痛换取深度。 5. 躯干前倾不符合训练目标：一定程度的前倾可用于改变髋、膝负荷分配。若前倾突然增加并伴随失衡，可检查负重、步距、疲劳及活动度；不能单凭前倾就认定踝或髋受限。"], [9, 10.5 进阶与退阶", "辅助支撑分腿蹲：双手扶固定物，降低平衡需求，练习舒适且可重复的下肢与骨盆控制。 原地小幅度分腿蹲：在静态分腿姿势下进行小幅度屈伸，逐步增加活动范围。 徒手分腿蹲：在当前可控、可耐受的幅度内完成下降与起身，逐步扩展活动范围。 负重分腿蹲：手持哑铃或杠铃增加负荷，在保持技术质量的前提下逐步增加训练强度。 保加利亚分腿蹲：后脚抬高，按目标调整前腿负荷和平衡需求。悬吊、BOSU和振动是改变任务的选项，并不自动优于稳定支撑；以发展较大力量为目标时，可优先采用便于稳定加重的条件。 爆发力分腿蹲：加入跳跃和落地后，加载速度与冲击需求明显提高。应在具备相应力量、落地控制和负荷耐受后，从低次数、低高度开始，逐步增加难度，并观察当日及次日的疼痛与恢复情况。"], [8, 本章导读", "深蹲（Squat）是训练下肢力量和多关节协调的常用动作，与坐站转换、拾取物品及跳跃准备等日常或运动任务存在联系。生活方式、训练经历、身体比例和既往伤病会影响个人的动作选择与负荷耐受。教学应从可控制的动作与负荷开始，逐步建立力量和活动能力，而不是预先把成年人的深蹲视为不良模式或损伤来源。"], [8, 11.1.1 股四头肌与髌骨力学", "传统解剖学将股四头肌描述为四个主要组成部分：股直肌、股外侧肌、股内侧肌和股中间肌，核心功能为膝关节伸展。近年的解剖研究还描述了股中间张肌等可能的附加结构，但其命名、普遍性与独立功能尚未完全统一，宜作为扩展知识而非替代标准四头肌框架。 股直肌起于髂骨前部，跨越髋、膝关节；其余三部分起于股骨。四部分经股四头肌腱连接髌骨，再由髌韧带连接胫骨粗隆。髌骨作为伸膝装置中的种子骨，改变伸肌的力臂。髌骨上方的股四头肌腱与下方的髌韧带是不同结构。Becker 等人（2009）的综述主要讨论股外侧肌形态，不作为附加肌束普遍存在的依据。 下降阶段，膝伸肌通常以离心作用控制膝屈曲；上升阶段则产生伸膝力矩。其活动随深度、负荷、速度和技术变化。髌骨下方不适也。Thomeé 等人（1996）比较了11名髌股疼痛女性和9名健康女性的坐位、站位等长伸膝表现，未研究动态深蹲中的募集峰值或治疗处方。"], [8, 11.1.1 股四头肌与髌骨力学（续）", "股四头肌各部分共同参与伸膝及髌股关节受力。股内侧肌斜部（VMO）和股外侧肌（VL）的作用方向不同，但髌骨运动还受骨性结构、软组织、关节位置和整体负荷影响。髌股疼痛是多因素问题，不能将其统一归因于VL紧绷或VMO启动不足，也不能把两者的所谓张力平衡作为预防和治疗的唯一关键。 Smith 等人（2018）的系统综述与荟萃分析显示髌股疼痛较常见，但发生率与患病率须区别解释：军人样本的点患病率估计约13.5%，新兵研究的发生率范围差异很大，不能统一表述为每十人每年发生一例。 Van Tiggelen 等人（2009）随访79名健康男性新兵6周，观察到VMO相对VL启动延迟与后续髌股疼痛有关。该指标的区分能力有限（ROC曲线下面积0.68），可视为特定人群中的相关因素，不能独立诊断疼痛原因或决定训练方案。 髌股关节反作用力通常随膝关节屈曲角度和外部负荷增加，但不同研究的建模方法、动作变式和受试者条件差异较大，不能把不同研究的点估计直接相除为固定倍数。出现髌股疼痛时不必一概暂停深蹲；应根据症状反应调整深度、负荷、动作形式与训练量，并在需要时接受专业评估。"], [8, 11.1.1 股四头肌与髌骨力学（续）", "Wang等（2023）的系统综述进一步强调模型与输入差异，研究间点估计不能直接作为个体损伤或训练准入阈值（DOI:doi:10.3389/fbioe.2023.1197014）。 McConnell 与 Bennell（2011）的书章介绍了膝前痛的保守管理。训练时可从症状允许的膝屈曲范围开始，逐步增加幅度与负荷，并按任务需求选择深蹲、台阶或分腿蹲。起始角度和动作顺序应个体化，而非所有人固定从40°开始。"], [8, 11.1.2 臀大肌与髋关节旋转", "臀大肌是重要的髋伸肌，也常参与髋外旋。Neumann（2010）说明髋肌力臂会随关节位置改变，部分纤维束的旋转作用可能发生变化。Peduzzi de Castro 等人（2021，PMID 34391276）测量的是不同髋屈曲位置的最大等长收缩，而非动态深蹲。因此，这些资料有助于理解位置依赖的肌肉作用，却不能单独解释深蹲底部的膝向内移动，也不能把某一屈髋角度当作普适转换阈值。 内收大肌也参与髋伸展，但肌肉具有内收作用并不意味着深蹲时一定产生可见的膝内移。膝轨迹反映髋、膝、足踝及躯干的共同策略。教练应关注运动是否可控、是否伴随疼痛及是否符合任务目标，不能从外观直接认定某块肌肉代偿或组织保护不足。"], [8, 11.1.3 内收肌群与髋关节伸展", "内收大肌（Adductor Magnus）不同部分具有不同作用，其中部分纤维可产生髋伸展力矩。在深蹲等动作中，它可与臀大肌等共同完成髋伸展。其参与属于正常肌肉协作，不能把训练中出现的膝向内移动直接解释为内收大肌代偿。"], [8, 11.1.4 半月板的结构与受力特点", "半月板是位于胫骨平台上的纤维软骨结构，参与负荷分担、接触面积调节和关节稳定。损伤机制涉及负荷大小、屈曲与旋转、组织退变及既往损伤等因素；不能认为垂直负荷或深屈膝一概不会致伤。股骨前倾角与胫骨扭转属于骨性形态，和动作中的瞬时旋转不是同一概念。Furumatsu 等人（2019）回顾100例有疼痛弹响的内侧半月板后根撕裂患者，所报告情境包括下行动作、步行及深蹲；该研究不证明所有半月板损伤主要由屈曲伴旋转造成。 训练前宜了解既往膝部损伤、近期疼痛、肿胀、卡锁及负荷变化。教练可观察并调整站距、足尖方向和深度，但不能通过外观筛查股骨前倾或胫骨扭转来保证预防半月板损伤。"], [8, 11.2.1 深蹲时髌股关节的受力特征", "深蹲涉及髌股关节和胫股关节负荷，关节反作用力与接触应力不是同一指标。Escamilla（2001）的综述总结了深蹲膝关节生物力学，为理解角度、负重和肌肉作用提供了框架；估算的关节负荷不能直接换算成个体损伤概率。 Doberstein 等人（2008）以关节镜检查为参照，研究Clarke征对髌骨软骨软化的诊断价值，报告敏感度0.39、特异度0.67。该结果衡量的是诊断效度，不是深蹲负荷是否安全的测试。 敏感度0.39意味着阴性结果不足以排除目标病变；特异度0.67也不能解释为“阳性时较可能有病”。该研究的阳性似然比约1.18、阴性似然比约0.91，均不足以明显改变诊断概率。Clarke征不宜作为教练决定是否允许深蹲或恢复训练的依据。"], [8, 11.2.2 前蹲举与后蹲举的力学差异", "Gullett 等人（2009）比较了15名健康受训者的前蹲和后蹲，以影像、测力和肌电资料分析膝关节动力学与肌肉活动。在研究所用负荷条件下，后蹲的压缩力与膝伸力矩较高；两式剪切力均较小，且未见显著差异。前蹲可作为调整负荷分配的选择，但这项急性研究没有证明其长期损伤风险一定更低。 Krzyszkowski 与 Kipp（2020）研究了不同负荷下前蹲与后蹲的机械需求。在相同绝对负荷下，后蹲对髋伸肌、前蹲对膝伸肌的需求分别较大。机械力矩差异不等同于肌电差异。"], [8, 11.2.3 高杠与低杠背蹲的生物力学差异", "Glassbrook 等人（2017）的综述以及2019年的生物力学研究提示，高杠与低杠背蹲具有不同的姿势和力学特点。低杠通常伴随更多髋屈曲与躯干前倾，高杠通常更直立。2019年研究涉及各6名力量举、举重及休闲训练男性，技术经验影响比较结果。可按专项与负荷分配选择杠位；短时角度或肌电差异不等同于长期增肌效果或绝对安全优势。 Murawa 等人（2020）比较12名有经验男性在60%—70% 1RM负荷下的高杠和低杠背蹲，观察到部分负荷和阶段中后侧肌群肌电较高。该研究主要提供急性肌肉活动资料，不能单独建立适用于所有人的踝背屈门槛或长期效果排名。"], [8, 11.2.4 踝关节活动度不足对深蹲力学的影响", "Macrum 等人（2012）在30名健康受试者中，以前足垫高12°模拟踝背屈受限，观察到深蹲中的膝运动学和肌电改变。研究没有直接测量膝关节压力，模拟限制也不完全等同于临床活动度受限。 深蹲所需踝背屈随身体比例、站距、深度、杠位及鞋跟高度变化。负重弓步测试可记录踝活动度的个体基线和变化，但角度与距墙厘米数不能不加条件地互换，也不存在由本章证据建立的普适合格线。可在初评、症状或技术明显变化时复测，不要求每次训练前固定测试。"], [8, 11.2.5 视线方向对深蹲运动学的影响", "Donnelly 等人（2006）让10名有深蹲经验的男性在低强度条件下比较向上、向前和向下注视。整体运动学差异有限；向下注视相对向上条件增加了髋屈曲，躯干屈曲仅呈趋势。该结果提示视线可影响姿势。"], [8, 11.2.6 膝关节内扣的解剖与力学机制", "深蹲起身时膝的轨迹可能变化，分析时应区分关节位置、肌肉力矩与实际动作，避免由单一外观直接推断病因： 其一，髋屈曲位置会改变臀肌部分纤维的力臂，但解剖力臂变化不直接证明动态膝内移由某一纤维束的旋转功能转换引起（Neumann, 2010）。 其二，内收大肌可正常参与髋伸展；其活动不必然伴随可见的髋内收或膝内移。 其三，髋外展能力、足踝控制、躯干策略、疲劳和任务目标都可能影响膝轨迹，需要结合多项观察和个体评估判断。 教学中可先用较轻负荷建立可重复的轨迹，再逐步加重。若出现突然失控、疼痛或不稳，应调整负荷和动作。可控的少量膝内移不等同组织损伤。"], [8, 11.2.7 深蹲深度与损伤风险的文献综述", "Hartmann 等人（2013）综述了下蹲深度和负荷对膝关节及脊柱的影响。接触面积、关节角度与外部负荷共同影响受力，较深屈膝并不等同于损伤。文中引用的运动员资料可提供背景，但不能用不同项目的损伤比例直接证明某种深度对所有人更安全。 退役举重运动员的损伤率数据可作为参考。影像学研究显示，40岁以上人群中半月板撕裂较常见，但这一背景流行率不能用于推导深蹲致伤。内侧半月板后根撕裂等特定亚型可能与深屈膝、旋转和负荷等因素相关；相关性同样不等于深蹲本身造成损伤。训练建议应根据症状、既往损伤、负荷耐受和动作控制个体化制定。 具备相应能力、经过渐进适应且无相关限制的训练者，可以选择较深的深蹲。深度应服务于力量、活动范围或专项目标；有疼痛、既往损伤或术后限制时，应采用当前可耐受的范围并按评估进展。"], [8, 11.2.8 前后十字韧带损伤个案的深蹲策略", "对于前后十字韧带损伤或术后康复的个案，深蹲时需采取差异化策略： 前十字韧带（ACL）损伤或重建后应保留分期、渐进的股四头肌训练，而不是笼统减少其参与。ACL负荷与屈膝角度、肌肉作用及多平面负荷有关；许多条件下浅屈曲负荷更高，不能把90°规定为最大危险点。具体开链、闭链练习的范围和负荷取决于恢复阶段、移植物、症状及医疗方案。Sinclair 等人比较14名健康受训男性不同鞋类下的深蹲，观察到跑鞋相对赤足增加部分运动学指标和股直肌肌电；这不是ACL患者的康复研究。 后十字韧带（PCL）在部分深屈曲任务中的负荷可能较高，腘绳肌作用也可增加胫骨后向剪切。损伤或术后训练应遵守对应阶段的医疗方案，逐步恢复幅度、力量和功能；不能将90°—120°设为所有人的永久禁区，也不应一概取消腘绳肌训练。躯干角度可改变关节力矩，但不能单独决定PCL负荷。ACL康复参考Aspetar指南（2023，PMID 36731908）；PCL分期原则参考综述PMCID PMC5120848。"], [8, 11.2.9 推雪橇作为深蹲的替代训练", "Maddigan 等人（2014）在10名健康受训男性中，以随机交叉方式比较20步最大负重雪橇推和10RM背蹲。部分所测大腿及腹部肌电未见显著差异，雪橇推的腓肠肌活动较高、深蹲的竖脊肌活动较高。雪橇可作为不同任务条件下的训练选择，但短时肌电相近不保证长期力量或增肌效果相同，也不说明所有无法深蹲者都适合推雪橇。"], [8, 11.3.1 踝关节背屈活动度的评估与改善", "踝背屈是影响深蹲策略的因素之一。负重弓步测试时应固定脚跟接触、膝移动方向和测量方法，记录左右侧基线，并结合实际深蹲需求解释。测量变化还应考虑误差；可靠性综述报告的最小可检测变化约为1.6—1.9厘米（PMID 25704110），这不是合格或损伤风险阈值。 若当前踝活动度妨碍目标动作，可试用调整站距、减小深度、垫跟或改变负荷位置，同时按需要安排活动度练习。疼痛或明显受限者应进一步评估；关节松动术需由具备相应资质者实施，也不能保证所有限制均可改善。"], [8, 11.3.2 训练前的症状与功能观察", "训练前评估应结合症状史和可耐受的功能任务，而不以Clarke征作为单项准入标准： 1. 询问疼痛位置、诱发动作、肿胀、卡锁、明显不稳及近期负荷变化； 2. 从有支撑、浅幅或轻负荷的深蹲开始，观察是否复制症状及是否能够控制动作； 3. 记录训练中、训练后及次日反应，据此调整深度、负重和训练量。 Clarke征在临床中有不同操作版本，但其诊断局限不能通过改变角度消除。单纯摩擦音或弹响也不能直接证明结构病变。 出现明显肿胀、卡锁、不稳或持续恶化，应停止诱发症状的训练并转介评估。没有这些表现但存在可控不适时，可在专业建议下调整训练；能否进阶取决于功能与负荷反应，而非按摩后某个试验转阴。"], [8, 11.3.3 髌股疼痛的负荷管理与髋膝训练", "髌股疼痛的训练主线是教育、负荷管理和渐进的膝部力量训练，必要时结合髋部训练。按摩、贴扎等可按个体需要作为短期症状调节，但短时舒适不证明髌骨轨迹已经校正，也不保证能够立即恢复原负荷。 选择股四头肌和髋部练习时，应依据症状、力量与任务需求安排角度、负重和训练量。选择性VMO激活不是所有人的必要前置步骤。可参考2019年髌股疼痛指南（DOI:doi:10.2519/jospt.2019.0302）及2024年最佳实践指南（DOI:doi:10.1136/bjsports-2024-108110）。 可从等长练习、小幅深蹲、有支撑分腿蹲等可耐受任务开始，逐渐扩展负荷与范围。分腿蹲和平行站姿深蹲的难度取决于支撑、平衡和个人能力，没有固定先后顺序。调整后既观察即时反应，也跟踪次日情况；不预设15—20分钟内改善或以短时缓解作为恢复原训练量的依据。"], [8, 11.3.4 半月板相关症状与训练分流", "半月板问题不能靠教练观察腿形或一次深蹲准确筛出。训练前可重点了解以下信息： 既往膝损伤、手术以及医疗团队给定的活动限制； 近期疼痛、肿胀、卡锁、不稳及负荷是否突然增加； 当前站距、足尖方向和深度下的舒适程度与动作控制。 出现持续或明显症状时，应转介评估。在适宜训练的情况下，可通过可逆调整寻找耐受的动作版本；骨性形态差异并不都需要“纠正”后才能训练。"], [8, 11.4 常见错误", "1. 膝轨迹失控：若膝突然明显向内移动并伴随疼痛或不稳，可减轻负荷、缩小范围并检查足踝、髋和躯干协同。不要把所有膝内移归因于臀肌纤维转换或内收肌代偿。 2. 当前踝活动度与任务不匹配：可能表现为脚跟抬起或姿势调整。可测试垫跟、改变站距或深度等方案。Macrum 等人（2012）测量的是运动学和肌电，不能作为膝关节压力直接升高的证据。 3. 深度超出当前耐受：根据身体条件、技术、症状和训练目标选择范围。Hartmann 等人（2013）的综述支持综合考虑深度与负荷，不代表所有人都应追求最低点。 4. 视线与颈部姿势不适：选择能维持平衡和舒适颈位的注视点。平视或适度向下看均可根据杠位和技术使用，无需强制盯住正前方。 5. 躯干姿势突然改变：低杠或特定身体比例可能需要较多前倾；可控前倾本身不是错误。若疲劳中明显失控，应降低负荷并检查技术、支撑与活动度。"], [8, 11.5 进阶与退阶", "箱式深蹲（Box Squat）：用合适高度的箱体提供深度参考，练习受控接触并起身。通过高度和负荷调整任务，但不能保证对所有膝痛者都更轻松。 前蹲举（Front Squat）：可用于改变负荷位置。Gullett 等人（2009）在所测条件下发现膝压缩力较低、剪切力无显著差异，不能将其视为普遍安全等级更高的退阶。若前架握持不适，可试用高脚杯深蹲。 靠墙蹲（Wall Sit）：提供等长膝伸肌训练，按症状和能力选择角度与持续时间；不需要以选择性激活VMO为目标或固定从40°以下开始。 高杠背蹲举（High-Bar Back Squat）：通常采用较直立的躯干姿势，按个体能力渐进负重；仍需躯干控制，不能仅因腰部控制较弱便认定适合。 后蹲举：可用于发展下肢力量。与前蹲的机械需求不同，选择应服从训练目标、技术经验及舒适度，不设统一的整体效率排名。 低杠背蹲举（Low-Bar Back Squat）：通常伴随较多髋屈曲与躯干前倾，可满足特定力量举或髋伸需求。其适用性需结合肩部握杠、躯干控制和个体活动范围判断，而非所有人都须从高杠进阶到低杠。"], [8, 11.5 进阶与退阶（续）", "较深幅度深蹲（Full-Depth Squat）：在负荷耐受和控制允许的条件下扩大范围，以匹配专项或训练目标。深度不保证最大化某组深层肌纤维募集，也不代表对所有人功能价值最高。 推雪橇（Sled Push）：提供不同于深蹲的下肢负荷方式。根据场地、技术及症状安排阻力、距离和次数"], [4, 导言", "平板支撑（Prone Plank）与俯卧撑（Push-Up）分别常用于躯干抗伸展和上肢推力训练。两者共享上肢支撑、肩胛控制和躯干负荷管理需求，但能力并非完全等同。平板可作为练习躯干控制的方法之一，不能把达到某一平板标准设为所有人学习俯卧撑的必要前提。 平板耐力与部分运动表现存在相关性，但训练迁移仍需结合专项练习评价。研究发现，调整负荷后的俯卧撑与40% 1RM卧推可产生相近的胸大肌和肱三头肌适应。肩胛骨在这些动作中应能随任务运动；观察到突出或不对称时，应结合症状与功能判断，而非一律视为必须先纠正的障碍。 本章从核心肌群解剖、循证训练效果、教学口令与操作要点、常见错误及纠正、进阶与退阶五个维度，建立平板支撑与俯卧撑的完整知识框架。所有实证结论标注文献来源，临床推论与个人经验明确标注为作者观点。"], [4, 12.1.1 平板支撑涉及的核心肌群", "平板支撑需要腹部、肩带和髋部等肌群共同维持姿势，各肌肉的活动并不均匀。卷腹、臀桥和不同支撑练习具有不同的动作与负荷特点，可根据目标组合使用，不必以“均匀激活”判断动作优劣。 腹横肌（Transversus Abdominis, TrA）是参与躯干控制的深层肌之一。Okubo 等人（2010）在9名健康男性中，以细线和表面肌电比较11种稳定练习；肘足支撑配合对侧抬臂抬腿产生较高的腹横肌活动，桥式中的多裂肌活动较高。结果说明不同动作的肌肉需求不同，不能推广为任何更费力的动作都会增加所有深层和表层肌肉活动。"], [4, 12.1.1 平板支撑涉及的核心肌群（续）", "前锯肌（Serratus Anterior, SA）参与肩胛骨前引、上回旋及其贴附胸廓的控制。它起自第1—8/9肋外侧面，止于肩胛骨内侧缘前面，可按形态划分上、中、下部。各部协同工作，不具有完全独立的单一功能： 肌束 起点 止点 主要功能 上部前锯肌 第1肋及第2肋上束 肩胛骨上角前面 协同固定肩胛、参与旋转控制 中部前锯肌 第2肋下束及第3肋 肩胛骨内侧缘前面 较偏向前引，与其余部分协同 下部前锯肌 第4—8/9肋 肩胛骨下角前面 较偏向上回旋及贴附胸廓的控制 Webb 等人（2018，2016年在线发表）解剖8块前锯肌，描述了三部分的附着和结构差异，其中下部的生理横截面积较大。Ekstrom 等人（2004）以表面肌电比较上、下部活动，为区域功能差异提供补充，但并未建立三束绝对独立的动作分工。"], [4, 12.1.1 平板支撑涉及的核心肌群（续）", "前锯肌与斜方肌各部协同控制肩胛运动，上回旋尤其涉及前锯肌及斜方肌力偶。胸小肌（Pectoralis Minor, PM）也参与肩胛运动，其功能关系随任务改变。较高的上斜方肌肌电不证明前锯肌受到抑制。Castelein 等人的出拳研究比较了所测动作的前锯肌和胸小肌活动，可帮助选择特定肌电目标下的练习，不能建立普适的治疗优先级。"], [4, 12.1.2 肩胛运动差异与翼状肩胛", "肩胛运动障碍（Scapular Dyskinesis）是对肩胛位置或运动异常的描述，不是单一诊断。翼状肩胛表现为肩胛缘或角部突出，可在静态或动态出现，也可能与神经损伤或肌肉功能障碍有关；不能用“手臂出力加力量外泄”作为定义。明显静息突出、外伤后新发、迅速出现的单侧变化或伴麻木、显著无力者，应转介评估。 Kibler 等人（2002）的研究评估肩胛外观分类的可靠性。以下模式用于描述所见表现，不能由分类直接推断致因肌群： 类型 肩胛骨表现 解释边界 Ⅰ型：下角突出 肩胛骨下角翘起 观察分类，不能单独判断致因肌群或诊断 Ⅲ型：上缘抬高 肩胛骨上缘突出 观察分类，不能单独判断致因肌群或诊断 Ⅱ型：内侧缘突出 肩胛骨内侧缘翘起 观察分类，不能单独判断致因肌群或诊断 Park 等人（2014）比较有无肩胛突出表现者在不同俯卧撑加动作中的胸大肌与前锯肌肌电，观察到组间差异。"], [4, 12.1.3 俯卧撑的力学结构", "俯卧撑是上肢远端支撑于地面的闭链推力练习，涉及肘屈伸、盂肱运动及肩胛在胸廓上的协调运动。Suprak 等人（2013）发现手臂位置会影响肩胛后倾、上回旋与外旋，但不同阶段和姿势的变化并非统一10°。教练应允许肩胛随动作移动，并在可控负荷下练习协调。"], [4, 12.2.1 平板支撑的耐力与运动表现关联", "Imai 与 Kaneoka（2016）研究了55名男性青少年足球运动员的平板耐力和运动表现之间的相关性，属于 研究方法：横断面研究，55名男性高中足球运动员（年龄16.3±0.5岁），进行俯卧和侧平板测试，同步完成Cooper测试、Yo-Yo间歇恢复测试（Yo-Yo Intermittent Recovery Test, YYIRT）、Step 50敏捷测试、30米冲刺、反向跳、五步跳和反弹跳共七项测试。 核心发现：两项平板测试的综合得分与YYIRT高度相关（r = 0.710, P < 0.001），与Cooper测试中度相关（r = 0.567, P < 0.001），与Step 50敏捷测试低度相关（r = -0.436, P = 0.001），与跳跃表现无显著相关。 对训练者的意义：平板可提供躯干耐力的一项基线指标，但不能替代专项间歇跑、敏捷或跳跃测试，也不能把该相关性视为经验证的个体预测工具。专项改善仍应通过相应表现测试确认。"], [4, 12.2.2 平板支撑变式的肌电比较", "改变支撑、肢体位置和附加等长用力可改变平板中的肌电活动。以下研究主要解释短时活动差异，长期力量、疼痛和运动迁移效果需要分别验证。 脚踝等长背屈收缩：Choi 等人（2021，2019年在线发表）在22名慢性下背痛者中比较不同踝部条件下平板练习的短时肌电。 研究方法：受试者完成4种踝部条件，使用表面肌电记录腹直肌、腹外斜肌、腹横肌/腹内斜肌区域、竖脊肌及小腿肌肉活动。腹横肌/腹内斜肌的区域信号不等同于细线电极分别测量两块肌肉。 核心发现：在该实验条件下，背屈共同收缩增加了腹横肌/腹内斜肌区域活动。不同方向的结果仅适用于所测任务。 对训练者的意义：背屈配合可作为改变平板任务的选项，应以舒适度、控制及训练后反应选择；该急性研究不证明长期减轻腰痛，也不说明所有腰痛者均缺乏深层核心激活。 不稳定平面：Snarr et al. (2014) 招募12名中等训练水平的成年人，比较传统平板支撑与在抗力球（Swiss Ball）上执行平板支撑的腹部肌肉募集差异。 研究方法：横断面设计，12名有中等强度训练习惯的成年人，表面EMG测量。"], [4, 12.2.2 平板支撑变式的肌电比较（续）", "核心发现：部分不稳定条件提高了所测腹部与竖脊肌的肌电幅度。肌电幅度差异不等于募集速度，也不能由此直接估算脊柱压缩力。 对训练者的意义：不稳定支撑可增加某些控制要求，适合在目标明确且能够耐受时使用。腰痛或既往损伤者应根据症状与负荷反应选择，不能把肌电升高直接解释为有害压缩。 Atkins 等人（2015）也比较了稳定与不稳定等长练习中的腹部肌电。相关研究支持部分任务会改变肌肉活动，但不同实验并非对同一临床疗效的重复验证，也不证明不稳定练习具有更好的长期迁移。 肩胛骨与骨盆位置的影响：Cortell-Tormo 等人（2017）比较了不同肩胛及骨盆位置，发现姿位可改变核心肌群肌电。肩胛后缩与骨盆后倾等条件可用于探索任务需求；并非所有平板练习都应追求固定后缩或最大腹肌活动。"], [4, 12.2.3 俯卧撑与低负荷卧推的训练比较", "Kikuchi 与 Nakazato（2017）比较了负荷相当的俯卧撑与低负荷卧推，观察到若干指标的相近改善。这是特定样本和方案的结果，不是两种动作在所有条件下等效的证明。 研究方法：随机对照试验，18名男性（年龄20.2±0.73岁）随机分为卧推组（n=9）和俯卧撑组（n=9），每周训练2次，持续8周。卧推组使用40% 1RM，俯卧撑组通过调整姿势（垫高手位或膝盖支撑）使负荷等效于40% 1RM。 核心发现：两组在胸大肌和肱三头肌的肌肉厚度增长上无显著差异（胸大肌：卧推组+19.4%，俯卧撑组+18.3%；三头肌：卧推组+10.3%，俯卧撑组+9.5%）。1RM力量增长两组亦无显著差异。肱二头肌肌肉厚度仅在卧推组显著增加（+10.9%），俯卧撑组无显著变化（P = 0.315）。 对训练者的意义：在负荷适配并达到研究所用努力程度的条件下，俯卧撑是发展胸部与肱三头肌的一种可行选择。肌肉厚度变化不能解释为肱二头肌“过度参与”，俯卧撑更优。应按器材、负重便利性、舒适度及目标选择俯卧撑或卧推。"], [4, 12.2.4 俯卧撑变式的肌肉激活模式", "手部位置可以改变俯卧撑的任务和肌肉活动。Marcolin 等人（2015）对8名健康年轻男性比较了标准、宽距、窄距、手部前移及后移5种变式，记录12块肌肉的表面肌电。 研究方法：横断面研究，8名健康年轻男性，每种变式执行10次，表面EMG同步记录12块肌肉。 核心发现：在所测条件中，窄距俯卧撑的胸大肌和肱三头肌活动较高，手部前移或后移增加了部分躯干肌肉活动。宽距未表现出一致的单一肌群优势；这并不证明它能使全身力量或肌肉收缩更均匀。 对训练者的意义：可依目标尝试窄距或改变手的位置，同时调整难度并比较舒适度。某种变式较困难也可能来自杠杆、活动度、技术经验和负荷差异。"], [4, 12.2.5 前锯肌激活方法的循证比较", "前锯肌相关练习可用于肩胛控制训练。是否需要强化、采用何种动作以及如何进阶，应结合症状、功能与负荷耐受，而不按翼状外观统一处方。 前锯出拳（Serratus Punch）：Castelein 等人（2016）的急性肌电研究显示，所测前移动作均涉及前锯肌和胸小肌。在追求较高前锯肌、较低胸小肌肌电的特定目标下，弹力带前锯出拳具有参考价值；该结果不确立所有人的最佳强化动作或治疗排序。 动态环胸拥抱（Dynamic Hug）：Yoo（2016）在所测条件下发现，120°肩屈曲较90°产生更高前锯肌肌电。角度应结合个人活动范围和舒适度选择，肌电差异不证明长期效果更优。 俯卧撑加（Push-Up Plus）：Kang 等人（2019）综述19项研究、356名受试者。稳定与不稳定支撑下前锯肌活动未呈一致差异，而不稳定条件可能增加上斜方肌活动。支撑面、肘位和肢体位置应按目标选择；肌电比值不等同功能失衡或康复效果。"], [4, 12.2.5 前锯肌激活方法的循证比较（续）", "肩关节抬举练习：Castelein 等人（2016）比较肩前屈配合外旋、肩胛平面抬举和滑墙等条件，发现不同动作对肩胛周围肌肉的活动要求不同。可根据症状与目标选择，但上斜方肌或胸小肌参与本身不代表代偿，不需要一律追求其活动最低。 下肢配合：Kim 与 Yoo（2013）观察俯卧撑配合髋内收时的前锯肌、旁脊肌和压力中心变化。Kaur 等人（2014）在21名健康男性中比较前锯出拳及6种下肢、躯干组合，发现部分条件改变前锯肌肌电。两者测量的均为即时活动或控制指标，并未测量长期前锯肌力量适应。 触觉指导（Tactile Cues）：Shin 等人（2018）在13名有肩胛突出表现的男性中，比较膝支撑俯卧撑加的不同触觉提示条件，观察到即时肌电、胸椎姿势和肩胛突出程度变化。经训练者同意后，触觉提示可帮助学习动作，但不能保证长期纠正或处理神经源性翼状肩胛。"], [4, 12.2.6 肩胛骨运动学与肘关节角度", "Suprak 等人（2013）比较自选、手臂贴近躯干及较大肩抬高条件下的俯卧撑。这里描述的是上臂与躯干的位置关系，不是肘关节本身的外展；指定姿势与实际执行角度也可能不同。 研究方法：16名健康受试者完成3种手臂位置条件，测量肩胛运动学。研究没有比较长期损伤或康复结局。 核心发现：自选或较贴近躯干的条件在部分阶段表现出较多肩胛后倾和外旋，不同条件的上回旋变化也不同。这些差异不能直接换算为盂肱稳定性或安全性排名。 对训练者的意义：可从舒适的自选肘位开始，在轻负荷下比较略贴近或远离躯干的版本。Landin 等人（2017）讨论了肱二头肌跨肩的作用，但未验证有前脱位倾向者采用某一俯卧撑肘位更安全。此类人群应根据专业评估和恢复阶段训练。"], [4, 12.3.1 平板支撑的标准执行流程", "可从四足支撑开始，建立舒适的躯干和肩胛控制，再逐腿伸直进入手撑平板。该流程便于分步教学；也可按能力选择膝支撑或手部垫高，不要求所有人以同一顺序过渡。 全程保持要求：头、躯干与骨盆大致协调，保留自然脊柱曲线；维持稳定的手脚接触和可控呼吸，避免疲劳中突然塌腰或抬臀。 准备阶段口令：双手放在肩下附近，调整手指方向至手腕舒适；轻推地面，让肩胛贴随胸廓，腹部保持适当张力。双脚或双膝选择稳定支撑，不强制肘窝始终朝前。 下降阶段（俯卧撑）：屈肘并让身体整体下降，肩胛随动作自然后缩。初学者可用约2—3秒的受控下降练习，但这不是唯一有效节奏。下降至肩、腕和躯干仍能控制且舒适的深度，配合呼吸，不强求胸部低于肘或骨盆持续后倾。 上升阶段（俯卧撑）：向地面施力伸肘，使躯干与骨盆协调上移；允许肩胛适度前引。若塌腰或疼痛，先减小幅度或提高双手支撑。"], [4, 12.3.2 肩胛表现的评估与练习选择", "观察到肩胛突出或不对称时，先了解症状、出现时间、外伤史及负荷变化。无症状表现可通过减轻负荷、调整支撑和提示观察其可改变性；明显静息突出、快速出现的单侧变化或伴神经症状者，应先转介。下表给出评估方向，不由外观规定必须放松的肌肉： 观察情境 后续处理方向 静息明显或新发单侧突出 了解外伤、无力及神经症状，按需要转介 仅在较大负荷或疲劳中出现 降低负荷后复查控制与症状 提示后能够改变 采用反馈和渐进任务练习 伴疼痛或持续功能受限 专业评估后按个体方案训练 练习应针对评估中识别的需求选择，不采用固定的“放松8块、强化1块”处方。下列选项没有普适优先级，可比较舒适度、动作控制和后续负荷耐受： 1. 弹力带前锯出拳：可练习主动前引；负荷和幅度以可控为准（Castelein et al., 2016）。 2. 肩前屈配合外旋抗阻：改变肩胛周围肌群的任务，可在舒适抬举范围内练习。 3. 肩胛平面抬举：练习上肢抬举与肩胛协调，允许正常斜方肌参与。 4. 配合髋内收的支撑练习：可改变部分肌电和支撑需求，但不是必要的激活步骤（Kim & Yoo, 2013）。 5."], [4, 12.3.2 肩胛表现的评估与练习选择（续）", "滑墙（Wall Slide）：利用墙面提供反馈和支撑；不因胸小肌参与就降低其适用性。 6. 稳定支撑的俯卧撑加：练习伸肘位的肩胛前引；如有明确平衡目标，再考虑不稳定支撑（Kang et al., 2019）。 7. 触觉或视觉反馈：经同意后轻触提示，或用镜面与录像帮助理解肩胛运动，比较提示前后的控制与症状（Shin et al., 2018）。 缺乏局部“收缩感”不能证明肌肉没有参与。教学可结合动作表现、负荷、疲劳和反馈效果，不把主观感受作为肌肉功能诊断。"], [4, 12.3.3 俯卧撑的保护与评估原则", "保护原则：确认训练者在手腕和肩锁关节有无损伤。存在明显损伤时进行转介。 评估原则：观察不同负荷下肩胛运动是否伴随症状、是否随疲劳变化，以及简单提示能否改善控制。功能观察用于选择训练，不替代神经或肌腱损伤评估，也不将肩胛外观作为单项禁练依据。 训练流程：可用四足支撑、膝支撑或手部垫高俯卧撑建立能力；死虫、鸟狗与熊爬可作为不同躯干任务补充。根据完成质量和负荷耐受进阶，不设所有人必须完成的固定动作链。 评估框架补充：Sciascia与Kibler（2022）将肩胛运动障碍视为需要解释的运动功能表现，而非独立诊断。教练可记录疼痛、任务、负荷与疲劳条件，再比较提示或减负后是否改善，以选择运动控制和负荷进展。该临床观点综合不验证固定放松方案，也不能替代神经源性翼状肩胛的临床鉴别（DOI:doi:10.26603/001c.31727）。"], [4, 12.4.1 平板支撑的常见错误", "腰部姿势失控：疲劳、负荷或技术策略可能造成躯干下沉，不能单凭外观诊断腹横肌或多裂肌激活不足。可缩短每组时间、提高支撑或减少杠杆，并用适度腹部张力和呼吸提示恢复控制；无需强迫骨盆达到固定后倾角。 肩胛骨内侧缘突出：先判断是否伴症状、是否新发或静息也明显，并比较减轻负荷后的变化。它可能涉及多种因素，不能直接诊断前锯肌无力；牛顿第三定律也不意味着地面反作用力在此“泄漏”或消失。 头、躯干与骨盆失去协调：明显抬臀或下沉可能改变目标负荷，也可能提示疲劳。先调整难度并重新建立可控姿势，三点一线仅为简化教学提示，不要求脊柱呈几何直线。"], [4, 12.4.2 俯卧撑的常见错误", "肩胛运动控制困难：肩胛在下降和推起过程中应能随胸廓运动。若明显突出伴随疼痛或无力，应调整负荷并按需要评估。 上臂位置不适：上臂接近水平外展可能改变肩胛运动，但Suprak研究未证明其必然降低盂肱稳定性。选择舒适、可控的肘位，必要时减小上臂与躯干的夹角或改变支撑。 退阶不适配：膝支撑和手部垫高均为有效调节负荷的方法，本身不是代偿。选择后观察手腕、肩部与躯干控制；如当前版本仍过难，可进一步提高支撑或缩小范围。"], [4, 12.4.3 肩带肌群协同的观察", "推类动作中的耸肩可随负荷、疲劳及动作意图变化。Kang 等人（2019）讨论了肌电比值。应结合症状与控制调整任务，而非一律压低肩胛或抑制上斜方肌。 Kim 与 Yoo（2019）在11名男性中比较窄距俯卧撑与其plus阶段，发现前者下斜方肌活动较高，且稳定与不稳定条件下均可观察到这一差异。该急性结果可供动作选择参考，不证明能治疗肩部紧张。"], [4, 12.5.1 平板支撑的进阶路径", "平板训练可通过调整每组时间、支撑高度、杠杆和负重进展，也可按目标增加肢体动作或不稳定因素。下表列出不同任务选项，肌电较高不代表对所有人更好： 进阶方式 目标肌群 循证依据 注意事项 脚踝等长背屈收缩（弹力带） 腹横肌/腹内斜肌区域肌电 Choi et al., 2021（在线2019） 急性结果；不等同长期腰痛疗效 双脚并拢内收肌等长收缩 腹直肌、腹内/外斜肌 Kim et al., 2016 控制呼吸与负荷；未直接测前锯肌 悬挂系统支撑（手部或腿部） 部分腹部和躯干肌电 Atkins et al., 2015 具备相应支撑能力后选用 抗力球支撑（手部或腿部） 腹部肌肉 Snarr et al., 2014 按症状选择；未直接测脊柱压缩负荷 平板与等长双腿抬高的比较 腹内斜肌与腹直肌 Park & Park, 2019 不同动作的肌电比较，不是双腿垫高平板的证据 Kim 等人（2016）在20名健康年轻男性中比较标准平板、单侧及双侧等长髋内收，发现部分腹肌活动改变。研究未测前锯肌，也未验证长期躯干控制改善；可将该方式作为改变任务的选项。"], [4, 12.5.2 俯卧撑的进阶路径", "俯卧撑进阶可增加重复次数、可控范围或外加负重，再根据目标改变手位与支撑。动作变复杂并不必然比稳定加重更有效： 变式 主要效果 适用条件 窄距俯卧撑 所测条件下胸大肌、三头肌活动较高 按手腕舒适度与力量目标选择 前移/后移手部位置 可增加部分躯干肌肉需求 具备相应能力；腰痛加重者不默认采用 宽距俯卧撑 改变力臂和活动范围 按舒适度选择，不诊断肌力分布 不稳定支撑 改变平衡及肌肉活动需求 有明确目标并具备支撑能力时选用 髋等长内收 可改变部分肌电和支撑控制 可选任务，不是必需激活步骤"], [4, 12.5.3 俯卧撑的退阶路径", "新手和无法独立完成标准俯卧撑的训练者的退阶方案需综合考虑多个因素： 退阶方式 力学变化 选择时观察 补充建议 膝支撑俯卧撑 缩短身体杠杆，通常减少手部负荷 膝部接触、躯干与肩带舒适度 按完成能力进展，不要求额外动作作为补偿 手部垫高俯卧撑 改变支撑角度，通常降低上肢负荷 台面稳固、手腕与肩部舒适度 逐步降低支撑高度或增加重复 四足支撑、熊爬或标准俯卧撑 各任务有不同移动和平衡需求 当前负荷是否可控 按目标组合，不设固定必经顺序 针对具体问题的退阶选择： 肩胛下角突出：先区分症状和可能病因，再尝试减小负荷、提高支撑或反馈提示。下角突出常与前倾表现相关，不能称为“前倾不足”；窄距不是所有此类表现的统一解决方案。 希望增加肩胛前引练习：可先采用墙面、台面或地面的稳定支撑俯卧撑加，再按能力调节高度。悬挂系统是可选任务，不设固定60°作为激活或安全标准。 手肘位置难以控制：先调整手位、幅度和负重，不由肘向外移动直接诊断盂肱不稳定。有关节不稳史或症状者按专业方案练习；关节松动术由相应资质人员评估实施。 有腰痛史且练习后加重：优先降低总量、缩短杠杆或提高手部支撑，观察训练后及次日反应。手部前移或后移可能增加躯干需求，不能默认用作减负；持续加重应进一步评估。"], [4, 章末小结", "平板支撑与俯卧撑均需要肩带、躯干与髋部协同，但并非固定前后顺序。教学以当前能力、目标和负荷反应为依据，允许通过支撑高度、范围与负重调整任务。 腹横肌等躯干肌群与前锯肌等肩带肌群分别参与相应区域的控制。前锯肌起自肋骨，止于肩胛骨内侧缘前面，各部协同作用。肩胛运动差异与神经源性翼状肩胛应区分，不能以“力量外泄”解释所有突出表现。 Imai 等人（2016）的r=0.710对应平板综合得分与间歇恢复跑测试，而非敏捷因果效应。Kikuchi 与 Nakazato（2017）的相近训练变化限于18名年轻男性的低负荷8周方案。Marcolin及Castelein等人的肌电比较可帮助选择任务，但不能诊断肌力失衡或建立普适疗效排名。 肩胛训练应依据症状、功能与可改变性选择，不采用固定“8+1”处方。出拳、滑墙、抬举和俯卧撑加均可按需要使用；明显静息翼状、新发无力或神经症状需要专业评估。 进阶与退阶应优先调节负荷、支撑、范围和训练量，再按目标加入踝部用力、髋内收或不稳定因素。记录训练中及次日反应，比追求最高肌电或某种固定外观更有助于决定下一步。"], [4, 参考文献", "Atkins SJ, Bentley I, Brooks D, Burrows MP, Hurst HT, Sinclair JK (2015) Electromyographic response of global abdominal stabilizers in response to stable- and unstable-base isometric exercise. J Strength Cond Res 29(6):1609-1615. PMID: 26010796 Castelein B, Cagnie B, Parlevliet B, Cools A (2016). Serratus anterior or pectoralis minor: Which muscle has the upper hand during protraction exercises? Man Ther 22:158–164. DOI:doi:10.1016/j.math.2015.12.002。"], [4, 参考文献（续）", "Castelein B, Struyf F, Baert L, Cagnie B, Cools A (2016) Superficial and deep scapulothoracic muscle electromyographic activity during elevation exercises in the scapular plane. J Orthop Sports Phys Ther 46(3):184-193. DOI:doi:10.2519/jospt.2016.5927 Choi JH, Kim DE, Cynn HS (2021; online 2019). Comparison of trunk muscle activity between traditional plank exercise and plank exercise with isometric contraction of ankle muscles in subjects with chronic low back pain."], [4, 参考文献（续）", "J Strength Cond Res 35(9):2407–2413. PMID: 31136542。 Kibler WB, Uhl TL, Maddux JW, Brooks PV, Zeller B, McMullen J (2002) Clinical qualitative evaluation of scapular dysfunction: A reliability study. J Shoulder Elbow Surg 11(6):550-556. Cortell-Tormo JM, García-Jaén M, Chulvi-Medra
