isometric hip adduction. J Electromyogr Kinesiol 29:58-63."], [4, 参考文献（续）", "DOI:doi:10.1016/j.jelekin.2016.05.003 Landin D, Thompson M, Jackson MR (2017) Actions of the biceps brachii at the shoulder: A review. J Clin Med Res 9(8):667-670. PMCID: PMC5505302 Marcolin G, Petrone N, Moro T, Battaglia G, Bianco A, Paoli A (2015) Selective activation of shoulder, trunk, and arm muscles: A comparative analysis of different push-up variants. J Athl Train 50(11):1126-1132."], [4, 参考文献（续）", "DOI:doi:10.4085/1062-6050-50.9.09 Okubo Y, Kaneoka K, Imai A, Shiina I, Tatsumura M, Izumi S, Miyakawa S (2010). Electromyographic analysis of transversus abdominis and lumbar multifidus using wire electrodes during lumbar stabilization exercises. J Orthop Sports Phys Ther 40(11):743–750. DOI:doi:10.2519/jospt.2010.3192。 Park DJ, Park SY (2019). Which trunk exercise most effectively activates abdominal muscles? A comparative study of plank and isometric bilateral leg raise exercises."], [4, 参考文献（续）", "J Back Musculoskelet Rehabil. DOI:doi:10.3233/BMR-181122；PMID:30856100。 Park KM, Cynn HS, Kwon OY, Yi CH, Yoon TL, Lee JH (2014) Comparison of pectoralis major and serratus anterior muscle activities during different push-up plus exercises in subjects with and without scapular winging. J Strength Cond Res 28(9):2546-2551."], [4, 参考文献（续）", "DOI:doi:10.1519/JSC.0000000000000443.PMID: 24618724 Shin AR, Lee JH, Kim DE, Cynn HS (2018) Tactile cues change trunk and scapular muscle activity, scapular winging, and thoracic kyphosis during knee push-up plus in subjects with scapular winging: The cross-sectional study. Medicine 97(44):e12569. DOI:doi:10.1097/MD.0000000000012569 Snarr RL, Esco MR (2014). Electromyographical comparison of plank variations performed with and without instability devices. J Strength Cond Res 28(11):3298–3305."], [4, 参考文献（续）", "DOI:doi:10.1519/JSC.0000000000000521。 Suprak DN, Bohannon J, Morales G, Stroschein J, San Juan JG (2013) Scapular kinematics and shoulder elevation in a traditional push-up. J Athl Train 48(5). DOI:doi:10.4085/1062-6050-48.5.08 Webb AL, O’Sullivan E, Stokes M, Mottram S (2018; online 2016). A novel cadaveric study of the morphometry of the serratus anterior muscle: one part, two parts, three parts, four? Anat Sci Int 93(1):98–107. DOI:doi:10.1007/s12565-016-0379-1。"], [4, 参考文献（续）", "Yoo WG (2016) Effect of shoulder flexion angle and exercise resistance on the serratus anterior muscle activity during dynamic hug exercise. J Phys Ther Sci 28(2):560-561. PMID: 26957774"], [7, 本章导读", "臂部与三角肌训练常使用弯举、肘伸展和抬举等相对集中的动作，但涉及的肌肉并非都只跨一个关节。肱二头肌两头和肱三头肌长头跨越肩、肘关节，三角肌各部则随位置承担不同作用。分析训练时，需要区分关节动作、肌肉长度、外部力矩、肌肉活动与长期训练适应。 本章合并讨论臂部与三角肌，是因为它们与上肢推拉动作的训练量相互关联。肘屈肌参与多种拉类任务，肱三头肌和三角肌前束参与多种推类任务，中、后束则按动作平面和肘位参与抬举与拉动。方案设计应综合主项与辅助练习的负荷，而不把各肌群视为彼此独立。"], [7, 13.1.1 肱二头肌", "肱二头肌（biceps brachii）由长头（long head）与短头（short head）组成。长头起自肩胛骨盂上结节（supraglenoid tubercle），经盂肱关节上方跨越肩关节后，进入肱骨结节间沟（intertubercular sulcus），最终止于桡骨粗隆（radial tuberosity）。短头起自肩胛骨喙突（coracoid process），与长头汇合后共同止于桡骨粗隆。 肱二头肌主要参与肘屈曲与前臂旋后，两头均跨越肩关节。保持其他条件相同时，肩伸展通常使其长度增加，肩前屈通常使其长度减小。斜凳弯举、牧师凳弯举等可改变肩的位置，但具体受力还取决于肘角、前臂旋转、阻力方向和个体结构。 肱肌位于肱二头肌深层，起自肱骨前面，止于尺骨近端，主要参与肘屈曲，不跨肩关节，也不直接产生前臂旋后。在旋前握弯举中，肱二头肌的力学条件发生变化，但并未被关闭；肘屈任务仍由多块肌肉共同完成。 肱桡肌主要起自肱骨外侧髁上嵴近端约三分之二，止于桡骨远端、茎突近侧。其主要作用是肘屈曲与动态稳定，旋转作用随前臂位置和任务变化，部分研究观察到辅助旋前活动。锤式弯举是一种可选握法，但不能概括为肱桡肌激活恒定最高。"], [7, 13.1.2 肱三头肌", "肱三头肌（triceps brachii）由外侧头（lateral head）、内侧头（medial head）和长头（long head）三个部分组成。外侧头与内侧头起自肱骨背面，长头起自肩胛骨盂下结节（infraglenoid tubercle），三头汇合后经共同肌腱止于尺骨鹰嘴（olecranon）。 肱三头肌主要产生肘伸展。长头跨越肩关节，肩前屈通常使其相对拉长，肩伸展则使其相对缩短；外侧头与内侧头不跨肩。长度变化与力的大小并非同义，主动和被动受力还受肘角、肌肉活动及阻力曲线影响。 Kholinne 等人（2018）在10名健康受试者中结合表面肌电与OpenSim模型，研究不同肩抬高角度下三头肌各头的作用。以下为该实验条件下的结果概述： 该研究说明肩位置会影响特定伸肘任务中的肌肉活动与模型估计，但训练效果仍需纵向研究判断。 肱三头肌的内部力臂与外部阻力臂需要分别分析。内部力臂随肘角和解剖结构变化；外部力矩则由负荷大小及其作用线到肘轴的垂直距离决定。自由重量中前臂接近水平时外力矩通常较大，绳索中则取决于拉力方向。肌肉为平衡外力矩所需的力还受内部力臂和其他组织贡献影响。过头位会改变长头长度，但不能单凭力臂或长度推导全程主动张力更高。"], [7, 13.1.3 三角肌前束", "三角肌（deltoid）是一块多羽状肌，覆盖肩关节外侧面，分为前束（anterior deltoid）、中束（middle/lateral deltoid）和后束（posterior deltoid）三个部分。三部分均止于肱骨三角肌粗隆（deltoid tuberosity），但起点各异。 前三角肌（anterior deltoid）起自锁骨外侧三分之一前缘，主要参与肩关节前屈与内旋。在卧推、肩推等复合动作中，前三角肌作为协同肌承受显著负荷。不同动作可改变三角肌各部分的参与程度；急性肌电排序需要结合负荷、动作范围和测量方法解释，不能单独作为长期训练效果的排名。 是否增加前平举，应结合既有卧推、肩推训练量，前束的进展、恢复及专项需求判断。复合动作可能已提供相当刺激。额外孤立练习的时间成本与收益，应通过实际进展而非固定规则评估。"], [7, 13.1.4 三角肌中束", "三角肌中束主要起自肩峰，参与肩外展，并与冈上肌及肩胛周围肌群共同完成抬臂。其贡献随角度、负荷方向和动作平面改变。 三角肌的内部力臂与哑铃对肩产生的外部力矩不同。直立侧平举时，哑铃作用线到肩的水平距离通常随抬臂增加，在手臂接近水平时较大；这描述外部负荷要求，不能直接认定中束肌纤维张力在同一角度达到峰值。 三角肌中束对肩部外观和外展能力具有重要作用。侧平举可用于集中安排外展负荷，但肩推等动作也涉及中束。是否需要更多孤立训练，应结合目标和总训练量决定，不把侧平举定义为唯一不可替代的方法。"], [7, 13.1.5 三角肌后束", "后三角肌（posterior deltoid）起自肩胛冈（spine of scapula）下唇，主要功能为肩关节水平外展（horizontal abduction）与外旋（external rotation）。后束在解剖功能上与面拉（face pull）章节（§7）中描述的后链肌群高度重叠——面拉动作的核心目标肌群即包含后三角肌。 在推类动作较多的方案中，可检查后束相关的水平外展与伸肩训练是否充足。ACE科普摘要对后侧平举和斜板划船给出了较高肌电的定性描述；这不是完整同行评议纵向研究，不能据其排名判断所有人的训练缺口。 三角肌后束参与肩部运动，并与肩袖及其他肌群协同。其力量不足不能单独用于解释肱骨头前移或肩痛；肩部症状与稳定性需结合负荷史、功能和专业评估判断。"], [7, 13.2.1 肱二头肌：握法与肩关节角度对肌肉激活的影响", "Coratella等人（2023）以十名竞技健美运动员为受试者，比较了站姿杠铃弯举中旋后位（supinated）、旋前位（pronated）和中立握（neutral）三种握法对肱二头肌、肱桡肌和前三角肌的肌电激活差异。 该研究提示握法会影响所测弯举的急性肌电，但大统计效应量并不自动表示临床获益或更大肌肥大。前三角肌活动差异也不能单独证明肱骨头稳定需求或代偿原因。握法应同时考虑舒适度、目标与渐进加重的可行性。 弯举的外部肘力矩等于负荷乘以作用线到肘轴的垂直距离。上臂相对稳定、使用自由重量时，前臂接近水平通常对应较大的外力矩。肱二头肌的内部力臂和长度也随关节位置变化，但它们不能与外部阻力臂混为一谈。实际难点还受加速度、疲劳及技术影响，因此不能用固定90°预测每个人的粘滞点；动作两端也不代表肌肉张力必然为零。 Marcolin 等人（2018）比较了直杠、EZ杠和哑铃弯举的急性肌电。在所测条件下，EZ杠与哑铃之间存在部分肱二头肌和肱桡肌活动差异，离心阶段的结果也受器械影响。这可作为动作选择线索。"], [7, 13.2.2 肱二头肌：拉长位训练的肥大效应", "Pedrosa等人（2023）以19名未受训年轻女性为受试者，采用坐姿哑铃牧师凳弯举（seated dumbbell preacher curl），比较了仅训练拉长位（initial range of motion，即肘关节接近完全伸展至中间角度的下半段，0°至68°）与仅训练缩短位（final range of motion，即肘关节从中间角度至完全屈曲的上半段，68°至135°）对臂部肌肉适应的差异。受试者以自身对照设计，一臂训练拉长位，对侧臂训练缩短位，每周3次，持续8周。 研究发现，拉长位训练组在肱二头肌远端（70%肱骨长度处）横截面积（CSA）的增长显著优于缩短位训练组（p = 0.001）。在50%肱骨长度处的CSA变化两组无显著差异（p = 0.311）。拉长位训练组在1RM力量增长上也显著优于缩短位（p < 0.001）。 Wolf 等人（2023）的系统综述与荟萃分析显示，总体全幅度或较长幅度训练具有小幅优势，但估计存在不确定性。拉长位部分幅度的亚组结果为进一步研究提供线索，区间跨越无效值，尚不能确认其稳定优于全幅度。不同肌肉、动作和样本也不宜直接互换。"], [7, 13.2.2 肱二头肌：拉长位训练的肥大效应（续）", "拉长位训练可能通过不同长度下的主动、被动受力及相关信号影响适应，但具体机制仍在研究。Pedrosa研究没有直接测量titin作用或肌节数量。Blazevich等人（2025）的历史、系统及荟萃综述。 Wolf等（2026，在线2025）的系统综述纳入8项研究、120人，提示较长肌长训练可能有利于整体肥大或估算肌束长度变化，但研究质量和人群、肌群范围有限，未直接证明人体肌节串联增加。因此可逐步加入可耐受的长肌长负荷，不应强迫疼痛终末位或将全部训练改为半程（DOI:doi:10.1016/j.smhs.2025.03.001）。 训练实践中，可把在较长肌肉长度下承受负荷作为动作选择的一个因素，同时保留可控全程练习。斜凳弯举和背对滑轮的Bayesian弯举可改变肩位置与负荷曲线，但Pedrosa的牧师凳肘角比较并未直接测试它们的优越性。仰卧本身不保证肩处于最大伸展；有前肩不适时，不应强求更大肩伸展。"], [7, 13.2.3 肱三头肌：过头位训练对长头的肥大优势", "Maeo 等人（2023，2022年在线发表）以21名成人进行12周自身对照研究，一臂练过头绳索肘伸展，另一臂练中立位绳索下压，每周2次，比较肱三头肌体积变化。 研究结果显示： 过头位使用较低绝对负荷仍获得更大的体积增长，提示不能只按外部重量判断增肌刺激。该研究支持所用方案的效果差异，但没有直接测量长头全程张力。 过头位与中立位会改变长头的初始长度，也可能改变力臂、关节姿势和外部阻力曲线。肩前屈通常使长头相对拉长，但随肘伸展仍会发生缩短。实际肌纤维长度和张力不能仅从肩角度推算，也不能认定其全程处在长度—张力曲线的最高区间。 研究中外侧头与内侧头的合并体积增长也较大，说明结果不能只由跨肩长头的长度变化解释。血流、局部代谢或其他组织相互作用可作为可能机制，但该试验没有直接证实这些解释，教学时应与已测得的体积结果区分。"], [7, 13.2.4 三角肌中束：侧平举的力学特征与阻力曲线", "侧平举是安排肩外展负荷的常用动作。自由重量的主要外力为重力；力学分析应使用肩轴到负荷作用线的垂直距离，而不是仅用肱骨长度。 在忽略加速度、躯干移动及肘角变化的简化模型中，肩外力矩为τ=F·r·sinθ，其中r是肩旋转中心到手中负荷的距离，θ是该连线与竖直方向的夹角。0°附近力矩较小，30°约为最大值的50%，60°约87%，接近水平时最大。上肢自身重量也有贡献。上述关系描述外部力矩。 哑铃侧平举在起始段的外部力矩较小，这是其阻力曲线的特点。是否需要额外增加起始段负荷，应根据目标和训练反应判断；内部肌肉力臂的优势不等同于主动张力或肌肥大优势。 缆绳侧平举可通过滑轮位置和站位改变拉力方向，使起始段产生不同于哑铃的肩外力矩。缆绳保持绷紧不代表关节力矩恒定，仍需分析拉力线与上肢位置。器械选择应考虑舒适度、可控范围和加重便利性。 Larsen 等人（2025）对24名有训练经验者进行8周左右臂随机分配的侧平举训练。在统一活动范围下，哑铃与滑轮条件的三角肌中束厚度均增加，未观察到明确的组间优势。该直接比较支持两种器械均可使用。"], [7, 13.2.5 三角肌后束：面拉与反向飞鸟的对比", "后束相关动作包括面拉、坐姿后侧平举和俯身反向飞鸟。ACE科普摘要报告后侧平举和45°斜板划船具有较高的后束肌电，可作为选择线索；动作的长期效果应通过可持续负荷和实际训练进展判断。 俯身反向飞鸟通过躯干前倾，使手臂相对躯干完成水平外展。外部力矩仍取决于负荷重力线到肩轴的垂直距离，肘角和躯干倾斜会改变力矩曲线。后束参与该任务，但不能只根据纤维走向判断其力学效率优于另一动作。 面拉通常组合水平外展、屈肘及不同程度的肩外旋，具体成分随绳索高度和技术改变；后侧平举更集中于水平外展。两者均涉及多块肌肉，不应把所有面拉都定义为90°外展位或保证相同的肩袖负荷。 可按目标将面拉与后侧平举组合或择一使用。需要练习外旋时，可明确控制相应动作和负荷；以后束增肌为目标时，应关注可重复的幅度和渐进训练量。现有依据不足以给二者的肩部健康或矫正价值作普适排名。"], [7, 13.2.6 三角肌前束：复合动作中的充分性与孤立动作的边际收益", "前三角肌参与卧推和肩推等复合推动作。是否增加前平举，应根据个人训练目标、总训练量、进展与恢复决定；短时肌电不能单独判断额外孤立练习的必要性。 自由重量前平举的肩外力矩通常随手中负荷到肩轴的水平距离增加而增大，手臂接近水平时较大，继续上举后可能减小。计算时应包含整条上肢位置及肘角，而不是仅用肱骨长度。外力矩变化不等同于前束主动张力曲线。 Bagchi 与 Raizada（2016）以10名健康男性比较掌心向下、中立及掌心向上的前平举，每种执行5次，记录前三角肌与上斜方肌的急性肌电。这里的supine grip指掌心向上的握法，并非身体仰卧。 所报告的原始肌电中，掌心向上条件的前三角肌数值较高、上斜方肌数值较低。该资料未提供可充分比较的标准化%MVC，样本与测量条件亦有限，不宜据此推断肌肉力量、临床效果或长期增肌排序。 若需要前束孤立训练，可比较掌心向上、中立或掌心向下的舒适度，并选择能够渐进负重的方式。较低的上斜方肌肌电不等同于抑制有害代偿，也不足以证明反手前平举力学效率更高。"], [7, 13.3.1 弯举：上臂位置与负荷控制", "保持上臂相对稳定，可使弯举的活动范围和阻力曲线更容易重复。上臂前后移动会改变肩位置、负荷轨迹及肘部需求，但轻微移动不一定是错误，应结合动作目标判断。 在困难阶段借助明显躯干摆动或肩部移动，可能改变肘屈肌承担的任务。若目标为受控弯举，可降低负重，使用座椅或牧师凳支撑，并保持可重复的节奏；实际难点位置不固定在90°。 教学口令建议：让上臂保持选定位置，缓慢屈伸肘部，避免为了完成次数而突然摆动。肘部可自然位于躯干侧面或支撑垫上，不必夹紧；疲劳使目标技术无法维持时，应结束该组或减重。"], [7, 13.3.2 弯举中的前臂旋后控制", "前臂握位会改变肱二头肌、肱肌与肱桡肌的协作。旋后握可作为肱二头肌训练的常用选择，但保持旋后姿势并不一定同时存在明显旋后外阻力。中立或旋前握不会关闭肱二头肌，也不意味着固定的肌肉负荷比例。 教学中可将握法作为任务与舒适度的选择变量： 旋后位（掌心朝上）：适合常规弯举；部分实验中肱二头肌活动较高。 中立握（锤式）：提供不同握持与前臂条件，仍有多块肘屈肌参与。 旋前位（掌心朝下）：改变屈肘肌群力学条件，需匹配腕部控制和负重。 以肱二头肌肥大为目标时，可把舒适的旋后弯举作为基础选项，并通过负荷、训练量和长期进展判断效果。Coratella 等人的急性肌电差异不能直接预测握法之间的肌肥大差距。"], [7, 13.3.3 三头肌训练：肩位置与动作选择", "Maeo 等人（2023，在线2022）的研究支持将过头伸肘作为可选的增肌动作，但不要求所有人采用同一肩角度。教学要点如下： 过头位动作：肩前屈使长头相对拉长。选择可以控制且舒适的肩位置，允许肘部根据体型自然调整，不强迫贴紧耳朵。缓慢屈伸肘部，并根据肩、肘反应确定范围和负重。 中立位及仰卧动作：绳索下压通常将上臂置于躯干旁；仰卧臂屈伸的肩角度则取决于上臂方向，常包含肩前屈，不能一律归入肩中立。三头均可参与，不按动作名称认定只刺激某两头。 方案搭配建议：在肩活动范围允许时，可组合过头伸肘与下压，提供不同任务条件；有不适者可选择更耐受的角度、单臂或器械版本。是否同时安排两类动作，取决于总训练量和目标，而非所有人的硬性要求。"], [7, 13.3.4 侧平举：抬举平面与舒适度", "可从手臂位于额状面前方约30°—40°的肩胛平面附近开始侧平举，再根据体型和舒适度调整。肩胛也会随上举运动，不要求整个过程固定在同一个平面： 其一，抬举平面会改变肌肉协作与关节力学，但不能据纤维方向单独确定中束有效力矩最大。 其二，肩位置、旋转、肩胛运动和负荷共同影响局部受力。肩胛平面可作为常用起点，但不能保证避开所有肩峰下接触或预防肩痛，影像距离也不等同于临床损伤。 教学口令建议：手臂向舒适的前外侧抬起，拇指保持中立或略向上，不强迫小指高于拇指。允许肩胛自然上回旋；有疼痛或既往肩袖症状时，调整幅度与负重，必要时接受评估。"], [7, 13.3.5 三角肌训练的容量分配", "以下组数仅为有一定训练基础者的经验模板，不是三角肌各束的普适最佳剂量。需合并计算推拉主项的相关训练量，并依据接近力竭程度、进展和恢复逐步调整： 前束：已有卧推或肩推时，可先不额外安排前平举，或试用每周3—4组；缺乏推类主项时，6—8组可作为经验起点之一。上述数字未经直接研究确认为最优，新手可从更少训练量开始。 中束：可用侧平举补充外展负荷。有训练基础者可尝试每周10—16组的经验范围，但应计入其他动作的参与，并按恢复和进展调整，不要求新手直接达到该量。 后束：划船等动作也可提供后束负荷，其大小受肘位和技术影响。若目标与进展提示需要补充，可试用每周6—10组后侧平举或相关动作的经验范围；已有足够拉类训练时应减少额外组数。"], [7, 错误一：弯举中的躯干摆动（借力）", "错误描述：以严格弯举为目标时，训练者通过明显躯干摆动启动负荷，使动作节奏和肘屈任务难以重复。 力学后果：躯干运动和加速度会改变负荷轨迹及各关节需求。重点是动作是否符合目标、是否受控以及是否引起症状。 纠正方法：① 使用坐姿、靠墙或支撑版本减少不必要摆动；② 降低负重，维持可重复的屈伸；③ 保持适当腹部张力与呼吸，疲劳后不强行完成变形次数。"], [7, 错误二：侧平举中的肩带运动失控", "错误描述：负荷过大或疲劳时出现突然耸肩、躯干摆动或疼痛相关动作。正常抬臂本来就需要斜方肌参与肩胛上回旋，不能把所有肩胛上移视为代偿。 力学后果：肩胛和肱骨共同完成抬臂，斜方肌参与不代表中束停止受力。耸肩应结合控制、负荷及症状判断是否调整。 纠正方法：① 减轻负重，采用能够控制的范围；② 提示手臂与肩胛协调抬起，不强制全程压肩；③ 可用较高次数练习技术，但15—20次不是唯一有效范围，也无需先激活下斜方肌才能训练。"], [7, 错误三：三头肌训练中上臂位置失控", "错误描述：在过头伸肘或下压过程中，上臂突然向两侧或前后移动，使负荷轨迹偏离预定任务。这里是肩位置变化，不是肘关节自身发生外展。 力学后果：上臂位置改变可影响肌肉长度和阻力曲线，但不能笼统判定长头力臂一定缩短或额状面效率更低。判断重点是轨迹可否重复、肩肘是否舒适和是否符合训练目标。 纠正方法：① 选择舒适的上臂位置，不强求贴耳；② 用绳索或单臂方式允许自然调整；③ 降低负重，用镜面或触觉反馈控制不必要摆动。"], [7, 错误四：侧平举的力臂与负重不匹配", "错误描述：手臂伸得更直会延长有效力臂，若负重未相应调整，可能超出当前控制能力；肘伸直本身不是错误，应避免不舒适的过伸。 力学后果：自由重量条件下，伸肘增加肩到负荷的距离，通常使非零抬举角度的肩外力矩增加。其增量随手臂接近水平而增大，并非在0°—30°达到峰值。力矩大小不能直接判断组织是否超过耐受；绳索和器械需按其拉力方向另行分析。 纠正方法：① 可保持轻微屈肘以调整力臂，无需固定在15°—30°；② 用舒适且可重复的手臂轨迹上举；③ 改变肘角后相应调整重量，不单纯追求更长力臂。"], [7, 错误五：三头肌下压中的明显肩部借力", "错误描述：下压时上臂明显从前方摆向后方，使任务由较集中的肘伸展变为更多肩、肘联合运动。 力学后果：肩伸肌可能增加参与，肱三头肌长头本身也具有肩伸作用。不能把肩部运动解释为完全没有三头肌刺激；若目标是可重复的肘伸训练，则应控制不必要的摆动。 纠正方法：① 让上臂保持舒适而相对稳定的位置；② 可用单臂或另一手轻触反馈；③ 调整负荷和站位，保留正常呼吸与肩肘舒适度。"], [7, 13.5.1 肱二头肌训练动作序列", "退阶层级 动作 支撑条件 关键特征 退阶一 坐姿器械弯举 坐姿，前臂置于支撑垫上 支撑有助于控制上臂和躯干，按器械轨迹与舒适度选择；不保证完全消除肩部活动 退阶二 坐姿哑铃弯举 坐姿，背部靠紧椅背 背靠支撑可减少躯干摆动，仍需肩肘协调；双侧独立运动 标准层级 动作 支撑条件 关键特征 标准一 站姿杠铃弯举 双脚站立 旋后弯举的常用形式；EZ杠可按手腕舒适度选用，不设普适激活排名 标准二 站姿哑铃弯举（旋后位） 双脚站立 允许双侧独立轨迹；Coratella 2023急性结果支持所测条件下旋后握肌电较高，不代表长期优势 进阶层级 动作 支撑条件 关键特征 进阶一 倾斜哑铃弯举（incline dumbbell curl） 仰卧于45°至60°斜凳 上臂位于躯干后方时增加肩伸展，可改变肱二头肌长度；Pedrosa未直接比较该动作与牧师凳 进阶二 仰卧哑铃弯举（lying dumbbell curl） 仰卧于平板凳 肩角度取决于上臂相对躯干的位置；仰卧不保证最大伸展或最大拉长 进阶三 Bayesian cable curl 背对低滑轮站姿 通过站位与滑轮方向改变肩位置和阻力曲线；保持绳索张力不等于恒定肘力矩"], [7, 13.5.2 肱三头肌训练动作序列", "退阶层级 动作 支撑条件 关键特征 退阶一 仰卧绳索臂屈伸（supine cable extension） 仰卧于平板凳 仰卧提供躯干支撑；肩角度由上臂位置决定，负荷可调，不设统一最低难度或康复阶段 标准层级 动作 支撑条件 关键特征 标准一 绳索下压（cable push-down） 站姿，肩关节中立位 上臂在体侧附近进行伸肘；三头均可参与，负荷与长度随肘角变化 标准二 过头绳索肘伸展（overhead cable extension） 站姿，肩关节前屈位 长头相对拉长；Maeo2023（在线2022）在所测12周方案中观察到较大整体体积增长，非所有人的必需动作 进阶层级 动作 支撑条件 关键特征 进阶一 单臂过头绳索肘伸展 站姿，单侧执行 便于分别调整两侧负荷与轨迹；不保证消除所有借力或更强拉伸感 进阶二 仰卧杠铃臂屈伸（skull crusher） 仰卧于平板凳 躯干获支撑；上臂通常处于一定肩前屈，按肩肘舒适度选择角度与范围 进阶三 窄距卧推（close-grip bench press） 仰卧位 上肢开放链复合推动作，三头与胸肩共同工作；不能据Kholinne模型确定该动作的各头贡献"], [7, 13.5.3 三角肌训练动作序列", "层级 动作 关键特征 退阶 坐姿器械肩推 躯干支撑较多，仍需匹配器械轨迹与肩活动范围 标准一 站姿哑铃肩推 可训练推力与站姿控制 标准二 反手前平举（supinated front raise） 可按舒适度选用；Bagchi2016为原始肌电研究 进阶 阿诺肩推（Arnold press） 加入肩部旋转与抬举组合；按控制及舒适度选择，不是必经进阶 层级 动作 关键特征 退阶 侧卧侧平举 躯干得到支撑并改变重力阻力曲线；并非完全消除稳定需求 标准一 哑铃侧平举（肩胛平面内执行） 以舒适平面和拇指中立或略向上开始，允许肩胛运动；不保证预防肩痛 标准二 缆绳侧平举（对侧低滑轮） 通过站位改变起始段力矩；绳索持续张力不等于恒定关节负荷 进阶 侧平举 + lengthened partials 可按目标试用特定区段，不必在力竭后追加；牧师凳及提踵研究不能直接证明侧平举拉长位半程更优 层级 动作 关键特征 退阶 俯卧于斜凳的哑铃反向飞鸟 胸部支撑可减少躯干摆动，后束与其他肩带肌群共同参与 标准一 坐姿后侧侧平举（seated rear lateral raise） 常用水平外展练习；ACE科普肌电资料仅供定性参考 标准二 面拉（face pull） 组合水平外展与不同程度外旋，按技术和负荷选用，不设肩部健康价值最高排名 进阶 45°斜板划船 + 末端外旋 划船与末端外旋是不同任务的组合；ACE对划船的描述不能直接验证此组合的优势"], [7, 参考文献", "1. Coratella G, Tornatore G, Longo S, Toninelli N, Padovan R, Esposito F, Cè E. Biceps brachii and brachioradialis excitation in biceps curl exercise: Different handgrips, different synergy. Sports. 2023;11(3):64. doi:doi:10.3390/sports11030064 Marcolin G, Panizzolo FA, Petrone N, et al. (2018). Differences in electromyographic activity of biceps brachii and brachioradialis while performing three variants of curl. PeerJ 6:e5165. DOI:doi:10.7717/peerj.5165；PMID:30013836。 3."], [7, 参考文献（续）", "Pedrosa GF, Simões MG, Figueiredo MOC, Lacerda LT, Schoenfeld BJ, Lima FV, Chagas MH, Diniz RCR. Training in the initial range of motion promotes greater muscle adaptations than at final in the arm curl. Sports. 2023;11(2):39. doi:doi:10.3390/sports11020039 Maeo S, Wu Y, Huang M, Sakurai H, Kusagawa Y, Sugiyama T, Kanehisa H, Isaka T (2023; online 2022). Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead versus neutral arm position."], [7, 参考文献（续）", "Eur J Sport Sci 23(7):1240–1250. DOI:doi:10.1080/17461391.2022.2100279。 Kholinne E et al. (2018). Different roles of each head of the triceps brachii muscle during elbow extension. Acta Orthop Traumatol Turc 52(3):201–205. DOI:doi:10.1016/j.aott.2018.02.005；PMID:29503079；PMCID: PMC6136322。 6. Sweeney SM, Porcari JP, Camic CL, et al. Dynamite Delts: ACE Research Identifies Top Shoulder Exercises. ACE ns? A systematic review. Sports Med Health Sci. 2026;8(1):34–42（2025-03-06在线发表）. DOI:doi:10.1016/j.smhs.2025.03.001。"], [1, 本章导读", "2015年，Luca Cavaggioni等人研究了呼吸结合伸展的训练效果。32名有运动习惯、没有下背痛的健康男性分为两组，每组16人，在六周内分别完成呼吸结合姿势伸展，或传统腹部与髋伸练习。研究期间要求受试者不参加其他体育锻炼。两组每周训练两次，每次在10分钟单车热身后完成15分钟指定练习。研究测量了卷腹次数、功能性动作筛查（FMS）评分以及用力肺活量（FVC）等指标。呼吸与伸展组在部分指标上的改善较大。这为健康男性的训练提供了一种组合方案；效果同时涉及呼吸、姿势和伸展三个部分。卷腹次数反映特定条件下的腹部耐力，FMS描述筛查动作的完成表现，FVC属于肺功能指标。这些测量分别回答不同问题，与最大力量、专项表现及最大摄氧量的评估有所区别。 研究者认为，呼吸结合柔韧练习可作为腹部训练的一个选项。对于疼痛人群、不同年龄及长期训练效果，还需要专门研究。实际教学中，可以结合学员目标，将这类练习与力量、耐力和专项训练搭配。 研究应用要点：识别受试人群、明确练习组合、区分测试指标，并根据持续训练后的结果调整课表。 下表列出论文报告的训练前后组均值，便于比较变化方向与幅度。"], [1, 本章导读（续）", "表中变化率由已展示的组均值计算，仅描述各组变化；组间推断以原研究的统计分析为准。 呼吸与伸展组的平均卷腹次数从40.0次增加到54.0次，传统训练组从39.0次增加到43.0次；FMS平均分分别由11.4分增加到16.5分、由11.0分增加到11.7分。将呼吸练习加入深蹲、硬拉或卧推课程时，可先把它用于学习呼吸与躯干用力的配合，再直接记录目标动作的技术、负荷和舒适度。这个试验的测量范围是卷腹表现、FMS与肺功能，专项力量和伤害结局需要各自的评价。"], [1, 理解研究的两个关键条件", "第一，训练方法的适用性取决于人群和目标。呼吸训练既用于健康人群的体能练习，也用于疾病康复；两者的负荷、监测和终点可能不同。阅读康复教材时，可学习呼吸的基本机制，同时辨认哪些方案需要医疗评估。教练选用健康人群的方案，应结合训练经验、运动耐受和课程目标，而不是只依据方法的名称。 第二，这个试验比较的是两套完整方案。受试者原先有运动习惯，但试验期间暂停了其他锻炼，因此不能将结果解释为在原有课表上额外加入呼吸的效果。传统组也完成了卷腹、旋转卷腹、臀桥与四足支撑对侧伸展等有明确目的的练习。课表可以保留这些动作，再根据需要加入呼吸和活动度练习。训练多样性应服务于目标和恢复；是否需要改变课表，应由技术、负荷、疲劳及长期进展共同判断。 接下来，将研究线索转化为可以观察、练习和复测的教学步骤。 本章末提供研究方案的要点与教学起点。练习前后可用一致的方法记录呼吸舒适度、动作控制和卷腹表现；若同时测量深蹲或单脚平衡，应将它们作为个人训练追踪项目另行记录。 现在，我们要来深入的了解人体呼吸这一回事，我们将从呼吸的解剖与力学切入介绍， 我只会讲解跟使用相关，并且你马上可以感受到的解剖与力学，拿起解剖这张地图，⼀起来探索自己的身体吧！ 从一呼一吸认识身体的协调"], [1, 呼吸的力学：气流、胸膜腔压力与腹腔压力", "吹气球时，气流由较高压力处流向较低压力处。人体呼吸同样依赖压力差，但肺的扩张来自呼吸肌推动胸廓运动，以及肺与胸壁之间的力学联系。理解呼吸时，先区分空气经过的气道和肺泡、包围肺的胸膜腔，以及容纳内脏的腹腔。 吸气时，膈肌等吸气肌活动使胸廓容积增大，胸膜腔压力下降，肺随之扩张，肺泡压力短暂低于大气压，空气沿气道进入肺。安静呼气时，吸气肌活动减弱，肺和胸壁的弹性回缩使肺泡压力略高于大气压，空气排出。 气球用于类比充气后的容积变化。正常呼气结束后，肺内仍保留功能残气量，肺保持开放。 气球和针筒可以帮助理解容积与压力的变化，但人体是由肺、胸壁、气道和呼吸肌共同构成的系统。一次吸入的气量受到呼吸驱动、肌肉力量、胸肺顺应性及气道阻力等因素影响。安静呼吸通常只使用肺容量的一部分；运动时通气需求提高，呼吸深度与频率会随之调整。膈肌是这一过程中的主要吸气肌。"], [1, 膈肌：主要吸气肌", "膈肌收缩时穹隆下降，与胸廓运动一起扩大胸腔容积，使肺膨胀。通气让空气进入和离开肺，气体交换则主要发生在肺泡与肺毛细血管之间。有氧运动能力还取决于心血管运输、血液携氧和肌肉利用氧的能力。呼吸练习的效果应根据它实际改善的指标来评价。 可将膈肌下降类比为针筒活塞移动：内部容积增大，有利于形成吸气所需的压力差。这个比喻强调压力与容积的关系；实际空气经气道进入肺泡，胸膜腔保持封闭，腹腔内则主要为组织与脏器。 针筒模型：以活塞移动类比吸气时的容积变化，帮助理解形成气流的压力差。 吸气时胸廓扩大、膈肌下降；呼气时相应结构回落。人体空气沿气道进入和离开肺。 从这个比喻延伸到练习时，可观察两个方面： 胸廓活动：吸气时，肋骨和胸骨的运动可增加胸廓前后径及横径。变化幅度由任务、关节活动、呼吸肌功能和组织顺应性共同决定。 膈肌与腹壁协调：吸气时膈肌下降，腹壁和盆底根据姿势与负荷作出相应调整；主动呼气时腹肌收缩可提高腹腔压力，协助膈肌上移与气体排出。 一次呼吸包含肌肉活动与组织形变，但不同训练方式具有不同适应目标。低负荷呼吸练习适合学习节律与协调，呼吸肌力量训练需要明确阻力和剂量，而较大外部负荷下的躯干训练还要求全身协作。教学时先建立舒适的呼吸，再逐步将它融入目标动作。"], [1, 腹腔压力与呼吸、躯干负荷", "腹腔上方为膈肌，下方为盆底，前外侧为腹壁肌群，后方包括脊柱及其周围结构。腹腔内容物以组织和液体为主，压力取决于膈肌、腹壁、盆底的协同活动、组织顺应性与外部负荷。安静吸气时腹壁常向外扩张；在搬举、支撑或主动呼气时，腹肌也可能在呼吸过程中持续活动。腹部外观的变化反映整体策略，具体肌肉活动需要相应测量。 腹腔压力的数值必须结合测量情境解释。世界腹腔间隔室综合征学会2013年共识所列的约5–7 mmHg，是危重成人的常见腹压范围；持续或反复达到12 mmHg及以上属于该临床框架中的腹腔高压。运动、咳嗽和搬举时可出现短暂腹压升高，评价时还需考虑持续时间、负荷和症状。训练中的漏尿、坠胀或疼痛，应结合个人情况评估并调整练习。 安静吸气时，膈肌活动扩大胸腔，腹腔内容物随之移位；安静呼气主要依靠弹性回缩。用力呼气时，腹壁肌与部分肋间肌活动增强，协助减小胸廓容积和排气。支撑或抗阻任务中，呼吸节律与腹壁张力可同时调节，以满足通气和力学需求。 胸腹壁协调示意。右侧腹壁主动收缩对应主动呼气；安静呼气主要依靠弹性回缩。负荷任务中，腹肌也可能在吸气时持续活动。"], [1, 腹腔压力与呼吸、躯干负荷（续）", "加深吸气需要相应的吸气肌活动和胸腹壁活动空间；主动延长或加强呼气则增加呼气肌参与。用力程度应与任务匹配，在低负荷教学中优先保持舒适、连续的呼吸。 吸气练习关注胸廓扩张与膈肌活动；主动呼气练习关注平稳排气与腹壁协调。肌力、耐力和活动度的变化需要通过相应测试分别判断。 潮气量是一次平静呼吸吸入或呼出的气量，会随体型、姿势、运动和呼吸驱动变化。功能残气量（FRC）是一次平静呼气结束时肺内的气体容积，等于补呼气量与残气量之和；残气量是最大呼气后仍留在肺内的气量。肺总量（TLC）是最大吸气后肺内的气体总量。肺内持续保留一定气量有助于维持呼吸间歇中的气体交换。身高、年龄、性别等与肺容量参考值有关，肺功能评估需使用适合人群的参考方程和规范测量。 肺容量与肺容积示意。图中数值用于说明组成关系，个人测量需结合体型、年龄和参考方程解释。 现在我们了解事情是怎么发生的，下一步是一一认识这些事件中的角色们，认识他们的时候，记得要思考他长得位置与上述介绍的呼吸功能有什么相关？当这个角色出包了， 会如何影响我们的呼吸功能呢？"], [1, 膈肌的形状与附着", "膈肌呈双穹隆形，其周边肌纤维起于胸骨、下六肋及肋软骨内面和腰椎相关结构，并向中央腱汇聚。中央腱是腱性组织，随肌纤维牵拉而移动；膈脚是附着于上腰椎的肌性部分，右侧通常向下延伸较左侧多。下位肋中，第11、12肋属于浮肋，第8至10肋经肋软骨与肋弓相连。膈肌与胸廓、腹壁共同形成呼吸时的力学联系，下肋活动和腹壁张力会随呼吸任务改变。"], [1, 横膈脚的位置与功能", "膈脚与食管裂孔关系密切，参与食管胃交界处的抗反流功能。中央腱与膈脚在结构和作用上各不相同。呼吸练习可从舒适姿势与节律开始；存在胃食管反流的学员，还应结合饮食、症状及医疗处理。Young等人2010年的动物实验关注膈脚相关神经支配，其研究对象和终点与人体脊柱伸展练习治疗反流不同。"], [1, 膈肌的功能与神经支配", "膈肌既参与呼吸，也可在四肢运动和负荷任务中参与姿势控制及腹腔压力调节。Wallden于2017年的文章从解剖与临床思考角度讨论了这些联系，为理解整体协调提供线索。具体练习是否改善疼痛、消化或情绪，需要针对相应人群和结局的研究。 教学中可分别观察呼吸舒适度、任务完成情况与症状变化，避免用一个指标代表全部身体功能。 膈神经主要起自C3–C5脊神经根，沿前斜角肌表面向下进入胸腔，为膈肌提供运动支配。前斜角肌自身由颈神经前支的肌支支配。颈部肌肉活动、呼吸方式与姿势可能相互影响，判断膈肌或膈神经功能需要结合临床检查。教练在低负荷呼吸练习中可观察颈部是否过度用力，并调整体位或难度。 膈肌中央部的感觉主要由膈神经传入，周边部感觉还涉及下位肋间神经。McCoss等人2017年的研究测量了手法处理后即时压力痛阈等反应，提供的是短期感觉反应资料。呼吸教学通常从主动练习与姿势调整开始，个别手法是否适用应由受过相应训练的专业人员评估。 鳄鱼式呼吸采用俯卧位，让学员感受腹部与支撑面的接触，以及后外侧胸廓随吸气的扩张。口令可以是“轻松吸气，感受下肋向周围展开；缓缓呼气，保持颈肩舒适”。空气实际进入肺，背部扩张是胸廓运动的感觉。作者在教学中曾观察到部分学员练习后肩活动范围即刻增加；可在相同测试条件下记录这一变化，并观察是否持续。这样的个体反应适合用于调整课程，具体产生变化的组织或神经机制仍需专门测量。"], [1, 横膈与体态", "膈肌参与呼吸，也能响应姿势控制需求。Hodges等人1997年在人快速抬臂任务中，观察到膈肌活动在三角肌启动前约20毫秒出现，提示前馈性姿势调节。该时序反映神经肌肉协调，与动作前额外吸入氧气的机制不同。训练中可通过逐渐增加四肢动作和外部负荷，练习呼吸与躯干控制的配合。"], [1, 横膈与骨盆底肌群", "安静吸气时，膈肌与盆底常表现为协调下降，呼气时回升；具体幅度会受姿势、主动收缩及负荷影响。盆底还参与脏器支持和控尿等功能。在死虫、熊爬及其他抗阻动作中，可逐步学习腹壁、呼吸和盆底的协调；出现漏尿或明显下坠感时应调整负荷，并寻求相应评估。 身体感受与情绪的象征性示意，用于课堂讨论；箭头表达感受，并非解剖位移或呼吸测量结果。 不同身体感受的象征性示意。理解情绪与呼吸，应结合个人体验和具体测量。"], [1, 横膈与情绪", "情绪与呼吸会相互影响：紧张、惊讶或放松时，呼吸频率、深度和节律可能改变；个体之间也存在差异。教学可让学员比较自然呼吸与轻缓呼吸时的主观感受。下面的体态图可作为身体感受的讨论材料，情绪状态和膈肌功能仍需结合多方面信息理解。 膈肌教学的四个观察方向 颈肩用力是否与任务相称，呼吸是否舒适。 胸廓是否有自然的扩张与回落，动作是否伴随疼痛。 体位改变后，呼吸体验和任务表现是否变化。 学员的紧张程度、注意力和练习偏好。 这些观察帮助教练选择练习体位和口令。通过一致条件下的前后比较，可判断某项调整是否适合当前学员。呼吸训练的结果应按目标分别记录，例如舒适度、节律、呼吸肌表现或专项活动能力；多系统症状则需要更完整的评估。"], [1, 当我们深吸气", "当运动或其他任务提高通气需求时，呼吸会加深或加快。理解吸气的机械过程，可以从两个相互配合的方面入手： 胸廓扩张，增加胸腔的前后径与横径。 膈肌收缩下降，增加胸腔纵向容积。 吸气量还受到气道阻力、肺和胸壁顺应性等因素影响。部分肋间肌与斜角肌可参与正常呼吸；通气需求增加时，其他辅助肌的参与也会变化。若安静时持续呼吸费力，尤其伴气短或不适，应结合整体情况评估。 那么有哪些肌肉可以辅助完成上述两种深呼吸的机制呢？ 肋骨运动：肋间肌及其他与胸廓相连的肌肉协调参与胸廓扩张。 胸腹壁协调：膈肌附着、肋骨活动以及腹壁和盆底反应共同影响压力与容积变化。 先来说说第⼀种，这些肌肉如何增加胸腔的大小？要了解这个概念，就要先知道，为什么我们的胸腔可以一下大一下小？这就不得不佩服造物主奇妙的创造。"], [1, 认识胸腔", "躯干的两个主要骨性区域是胸廓与骨盆，其间通过脊柱相连。胸廓内包含肺和心脏等器官，腹腔位于膈肌下方，骨盆腔与腹腔相连续。 胸廓由胸椎、肋骨、肋软骨和胸骨共同构成，兼顾器官保护与呼吸所需的活动。骨盆环由左右髋骨与骶骨等结构构成，通过关节和韧带传递负荷。两者的形态和活动特点不同，受伤风险还取决于外力、骨质及接触方式。教学时可用模型比较结构，再联系呼吸和承重任务。 胸廓在提供保护与支持的同时，通过肋椎关节、肋横突关节及肋软骨等结构产生适当活动。吸气时胸廓前后径和横径的变化，有助于胸腔容积增加。 肋骨运动可用泵柄式和桶柄式两个比喻理解。这些描述强调运动方向，实际各肋骨的运动是三维的，并有节段和个体差异。 桶柄式运动：主要增加胸廓横径。 泵柄式运动：主要增加胸廓前后径。 像提起水桶把手一样，肋骨外侧部分随吸气向上、向外运动，使胸廓横向扩展。可以将手轻放下位肋外侧，感受呼吸时的扩张与回落；以舒适、自然的幅度完成。 泵柄式运动可类比水泵把手抬起：胸骨及肋骨前端向上、向前移动，增加前后径。胸椎姿势会影响胸廓运动，但吸气时的脊柱位移因任务而异。“胸骨轻轻向前上方展开”可作为感受胸廓的口令，练习时仍需保持腰背舒适。 胸廓扩张来自膈肌、肋间肌及其他肌群的协调。观察时可同时留意前、侧、后胸廓的运动，不必追求所有人相同的扩张比例。"], [1, 认识吸气辅助肌", "下列肌群在不同呼吸条件下发挥作用，理解时需结合附着与固定端： 膈肌是主要吸气肌；外肋间肌及部分肋间肌纤维参与肋骨抬升和胸廓协调。 斜角肌作用于上位肋，胸锁乳突肌可在吸气需求较高时协助提起胸骨与胸廓。 腰方肌可固定第12肋，同时参与躯干侧屈和腰盆控制；后下锯肌的实际呼吸作用仍有讨论。 肩带或上肢相对固定时，部分胸肌可协助胸廓运动，其作用取决于姿势、固定端和呼吸需求。 脊柱周围肌群参与姿势维持，胸廓位置与呼吸活动可随任务共同调整。 肌肉的作用随固定端而改变。例如上肢支撑在桌面时，部分肩带肌可以参与辅助呼吸。这个例子有助于理解附着点与外部支持的关系。具体哪块肌肉参与多少，需要依据任务条件和测量来判断。 在卧推、俯卧撑等动作中，肌肉同时承担运动与姿势控制任务，呼吸策略会随负荷改变。课表可结合力量训练、适当的活动度练习与呼吸协调。若学员在某动作中出现呼吸不顺，先检查负荷、节奏、体位及症状，再评估是否需要调整。肌肉体积、肌肉张力与呼吸功能之间并非简单的一一对应关系。"], [1, 认识吸气辅助肌（续）", "腰方肌连接髂嵴、腰椎横突和第12肋，纤维分束存在个体差异。它参与躯干侧屈、腰盆负荷控制和第12肋固定等任务。Phillips、Mercer与Bogduk于2008年发表的解剖与力学研究描述了腰方肌的纤维结构，并估算不同方向的力矩。 该研究描述的后层主要包含髂腰与髂肋纤维，中层主要为腰肋纤维，前层可见髂肋纤维。部分标本还观察到其他变异纤维。 这些名称标示各束纤维连接的区域，提示腰方肌可通过不同纤维方向参与多种任务。 阅读下图时，可依次辨认髂嵴、腰椎横突与第12肋，并追踪不同纤维的附着路径。 腰方肌各束的附着并不完全相同，其中既有连接肋骨的纤维，也有髂骨与腰椎之间的纤维。肌肉功能应结合纤维方向、关节位置和实际负荷理解。 Park等人2013年在9名健康受试者中使用细丝肌电，比较腰大肌与腰方肌不同区域在躯干、髋任务及坐姿变化中的活动。结果体现了区域和任务相关的肌肉招募。该研究测量的是肌电活动，适合用于理解不同动作需求下的协作方式。"], [1, 认识吸气辅助肌（续）", "关于力矩大小，Phillips等人2008年的模型估算显示，腰方肌矢状面伸展力矩较小，不及所比较的竖脊肌和多裂肌伸展力矩的10%。这是特定方向的力矩比较；脊柱稳定还受到肌群协同、刚度、负荷方向和神经控制影响。 因此，在呼吸与躯干课程中，可同时考虑腰方肌的肋骨固定、侧向控制及负荷适应，而依据具体任务选择练习。 髂腰韧带连接腰椎与髂骨，参与限制腰骶交界处的过度位移。Leong等人1987年的生物力学研究探讨了这一作用。腰方肌与附近筋膜、韧带的关系有助于理解区域负荷，但单侧骨盆上提、髋内旋或腰部紧绷具有多种可能解释。教练可记录动作中的侧向偏移和症状，通过减小幅度、降低负荷或改变支撑复测；持续疼痛需要进一步评估。"], [1, 主动呼气与腹壁协调", "安静呼气主要依靠呼吸系统的弹性回缩，膈肌活动减弱、穹隆回升，胸廓与腹壁随之回落。主动呼气时，腹肌和部分肋间肌的活动可进一步协助排气。练习时可用手轻触腹壁感受整体张力变化，同时观察颈肩和面部是否保持舒适。 主动呼气（active expiration）或用力呼气（forceful expiration）可作为学习腹壁参与的方式。训练目的在于协调、呼气力量或任务配合时，所需用力和持续时间也会不同。 平静呼气结束后，还可主动呼出一部分补呼气量；即使最大呼气后，肺内仍保留残气量。练习应在舒适范围内完成，结束时自然进入下一次吸气。 用力呼气依靠腹壁肌群及胸廓呼气肌的协作。腹直肌、腹内外斜肌和腹横肌可提高腹压，协助膈肌上移；内肋间肌骨间部等可参与降低肋骨。胸横肌只是其中的一部分。 学习主动呼气，可先选择舒适的仰卧、坐姿或站姿，放松面部和颈肩，轻缓而连续地呼出气体。若下肋或腹部疼痛，先减小用力并评估原因。涉及腹部或肋缘深部手法时，应由具备相应资质的专业人员根据个体情况处理。"], [1, 主动呼气与腹壁协调（续）", "腹壁收缩改变腹腔内的压力与组织形状，作用由周围结构共同承受。“像轻轻挤牙膏一样收拢腹壁”可以作为整体用力的感觉提示，再配合缓缓呼气。压力并非只向上作用，因此同时留意盆底舒适度和全身用力程度。 Mesquita Montes等人的实验提示，增加呼气负荷可提高腹部肌肉的活动，腹横肌与腹内斜肌联合信号是其中一项测量。低负荷教学可先尝试舒适吸气约2–3秒、缓缓呼气约4–6秒，重复3–5个呼吸，再恢复自然呼吸；这些数字是教学起点，可按个人耐受调整。保持连续气流，不以憋住最后一口气为目标。出现头晕、憋闷或明显用力不适时，回到自然呼吸。手触腹部有助于获得整体反馈，单凭软硬感难以分辨各深层肌肉的活动。 Mesquita Montes等人2017年发表的姿势比较研究让29名健康学生以吸气2秒、呼气4秒的节律练习，发现，在吸气和呼气阶段，站姿的腹外斜肌及腹横肌／腹内斜肌联合活动均高于仰卧。三脚支撑位与四足跪姿也呈现不同的活动水平。姿势改变了支撑和负荷需求，可用于调节练习难度；肌电较高本身并不代表该姿势对每位学员更合适。"], [1, 主动呼气与腹壁协调（续）", "实践顺序可以从舒适呼吸开始，逐步加入腹壁参与，再在死虫、四足支撑或站姿任务中保持合适的节律。每一步均记录学员的体验和动作表现。 对于下背痛或产后学员，可依据评估将呼吸练习纳入综合训练；同时关注症状、日常功能、盆底反应与负荷耐受。个体进阶速度取决于实际反应和需要。"], [1, 呼吸总结：", "呼吸训练的目标可以是放松与节律学习、胸腹壁协调、呼吸肌能力或运动中的通气配合。目标不同，评估方式也不同。练习中保留自然呼吸所需的余地，根据任务调整深度与频率，避免把每次最大吸气和最大呼气作为统一标准。 呼吸受到气体交换需求、神经调节、情绪、环境及肌肉骨骼条件共同影响。紧张时的呼吸变化存在个体差异；高海拔环境还涉及低氧适应，预防高原病需要独立的环境和医学知识。教练可在自身专业范围内帮助学员形成舒适、可持续的练习习惯。 研究方案与课堂应用：Cavaggioni等人的呼吸伸展组合包含仰卧双腿伸直并举臂、长坐位前伸，以及跪坐中的侧屈和旋转等姿势；练习安排为每式2组、每组6次，吸气2–3秒、呼气8–10秒。整套方案持续六周，每周两次，每次10分钟单车热身后练习15分钟。课堂中可先减少呼吸次数或缩短呼气时间，找到舒适姿势，再逐步增加。记录所做的具体调整，便于比较前后表现。对于出现持续气短、疼痛或其他异常症状的学员，应结合医疗评估安排训练。"], [1, 把呼吸练习放进训练课表", "呼吸训练并不是只有一种形式。若目标是降低紧张和建立节律，可以在低负荷姿势中练习连续、舒适的呼吸；若目标是提高呼吸肌力量或耐力，则需要有明确阻力、持续时间和进阶方式；若目标是深蹲、硬拉或推举中的躯干控制，则应把呼吸放回相应动作与负荷中练习。三类目标可以互相支持，但评估指标不同。 课程开始时可先用1至2分钟观察自然呼吸，不要求学员刻意改变。记录呼吸是否顺畅、颈肩是否明显用力、吸气时胸腹壁哪些区域容易产生运动，以及是否伴随头晕、胸闷、疼痛或漏尿。观察用于决定练习难度，不用于单独诊断某块肌肉失能。 低负荷练习可从仰卧屈膝、侧卧、俯卧鳄鱼式或坐姿中选择一种。让学员完成3至5个舒适呼吸，吸气时感受下位肋向前、向侧方和向后展开，呼气时让胸腹壁自然回落。一次练习约1至3组；组间恢复自然呼吸。节律只是帮助学习的工具，能够持续、舒适地呼吸比达到固定秒数更重要。"], [1, 把呼吸练习放进训练课表（续）", "当学员能够在低负荷姿势中保持顺畅呼吸，可逐步加入手臂抬举、脚跟滑动、死虫、四足支撑、熊爬或站姿抗阻。每次只改变一个主要变量，例如力臂、支撑面、负荷或速度，观察呼吸是否仍能与动作协调。若为了维持姿势而持续屏气、面部明显用力或动作范围快速缩小，可以减小难度后重新尝试。 在中高强度抗阻训练中，短暂屏气与用力呼吸可能作为负荷策略出现。是否使用以及如何使用，应考虑训练经验、任务强度、血压相关风险、症状和专业指导。教学重点是让学员理解自然连续呼吸、主动呼气和较高负荷下的躯干加压是不同策略，并能在合适情境中选择。"], [1, 呼吸与力量动作的三个教学案例", "案例一：深蹲下降时过早憋气。先降低重量，让学员在起始位完成自然吸气，下降过程中保持选定的躯干张力，并在上升阶段按训练目标呼气。比较调整前后的稳定感、动作速度和舒适度。若较高负荷需要更强的加压策略，再在技术稳定和风险评估后逐步教授。 案例二：俯卧撑时颈肩过度紧张。先提高手部支撑，缩短杠杆，让学员在保持肩胛自然运动的同时完成连续呼吸。口令可使用“吸气时保持颈部放松，呼气时平稳推离支撑面”。若降低负荷后表现改善，说明当前任务强度是重要变量；这并不等同于已经定位某一条神经或某块肌肉的问题。 案例三：硬拉起始位呼吸困难。先检查髋屈幅度、腹部是否被大腿明显压迫、腰带位置和训练重量，再尝试抬高起始高度或减轻负荷。让学员比较自然呼吸、准备腹壁张力与实际起拉之间的关系。若呼吸困难在低负荷与休息时也持续存在，应从训练技术问题之外继续评估。 三个案例采用同一逻辑：先明确任务，再调整可控变量，最后复测。呼吸体验、动作完成度和训练结果分别记录。这样既能保留呼吸训练的价值，也能避免用单一机制解释所有表现。"], [1, 六周呼吸与伸展组合的教学版", "Cavaggioni等人的研究方案每周训练两次，持续六周。每次先完成10分钟单车热身，再进行约15分钟的呼吸与姿势伸展。研究中的四种姿势包括仰卧伸腿举臂、长坐位前伸，以及跪坐中的侧屈和旋转。每个姿势完成2组，每组6次呼吸，吸气约2至3秒、呼气约8至10秒。这个数字描述原研究协议。 用于普通课堂时，可先以更短的呼气和更少的重复次数开始，例如每个姿势3至5次呼吸，吸气约2至3秒、呼气约4至6秒。学员适应后再增加重复次数或延长呼气。练习过程中保留自然吸气的需要，不追求把空气全部排尽。 训练前后可使用一致条件记录：自然呼吸舒适度、指定姿势的可控范围、卷腹或其他课程目标动作的完成表现。若使用FMS，应按其标准流程评分，并把筛查分数与最大力量、耐力和疼痛结局分开解释。若目标是提高硬拉或深蹲，还需要直接记录这些动作的负荷、速度和技术。 六周结束后，根据实际变化决定保留、调整或替换练习。某项指标改善，表示这套组合可能对该学员有帮助；没有改善时，可检查出勤、练习执行、测量一致性及目标是否匹配，再调整课表。"], [1, 参考文献与学习资料", "本章参考文献 Mesquita Montes A, et al. (2017; 2016在线发表). Abdominal muscle activity during breathing in different postural sets in healthy subjects. DOI: 10.1016/j.jbmt.2016.09.004. PMID: 28532880. Wallden M. (2017). The diaphragm—more than an inspired design. DOI: 10.1016/j.jbmt.2017.03.013. PMID: 28532878. Cavaggioni L, et al. (2015). Effects of different core exercises on respiratory parameters and abdominal strength. DOI: 10.1589/jpts.27.3249. PMID: 26644685. Stocks J, Quanjer PH. (1995)."], [1, 参考文献与学习资料（续）", "Reference values for residual volume, functional residual capacity and total lung capacity. DOI: 10.1183/09031936.95.08030492. PMID: 7789503. Phillips S, Mercer S, Bogduk N. (2008). Anatomy and biomechanics of quadratus lumborum. DOI: 10.1243/09544119JEIM266. PMID: 18441751. Park RJ, et al. (2013). Changes in regional activity of the psoas major and quadratus lumborum with voluntary trunk and hip tasks and different spinal curvatures in sitting. DOI: 10.2519/jospt.2013.4292. PMID: 22960605."], [1, 参考文献与学习资料（续）", "Leong JC, Luk KD, Chow DH, Woo CW. (1987). The biomechanical functions of the iliolumbar ligament in maintaining stability of the lumbosacral junction. DOI: 10.1097/00007632-198709000-00005. PMID: 3686218. Hodges PW, Butler JE, McKenzie DK, Gandevia SC. (1997). Contraction of the human diaphragm during rapid postural adjustments. DOI: 10.1111/j.1469-7793.1997.539bb.x. PMID: 9423192. Mesquita Montes A, et al. (2016)."], [1, 参考文献与学习资料（续）", "Abdominal muscle activity during breathing with and without inspiratory and expiratory loads in healthy subjects. DOI: 10.1016/j.jelekin.2016.07.002. PMID: 27434376. Young RL, et al. (2010). Sensory and motor innervation of the crural diaphragm by the vagus nerves. DOI: 10.1053/j.gastro.2009.08.053. PMID: 19732773. McCoss CA, Johnston R, Edwards DJ, Millward C. (2017)."], [1, 参考文献与学习资料（续）", "Preliminary evidence of Regional Interdependent Inhibition, using a 'Diaphragm Release' to specifically induce an immediate hypoalgesic effect in the cervical spine. DOI: 10.1016/j.jbmt.2016.08.015. PMID: 28532881. Kirkpatrick AW, et al. (2013). Intra-abdominal hypertension and the abdominal compartment syndrome: updated consensus definitions and clinical practice guidelines from the World Society of the Abdominal Compartment Syndrome. DOI: 10.1007/s00134-013-2906-z. PMID: 23673399."], [1, 参考文献与学习资料（续）", "指标 组别 训练前 训练后 均值变化 由展示均值计算的变化率 卷腹次数 呼吸与伸展 40.0 54.0 +14.0 35.0% 卷腹次数 传统练习 39.0 43.0 +4.0 10.3% FMS得分 呼吸与伸展 11.4 16.5 +5.1 44.7% FMS得分 传统练习 11.0 11.7 +0.7 6.4%"], [12, 本章导读", "本章首先介绍动作学习与感觉、神经控制之间的关系，并说明如何利用熊爬观察成人的四肢协调和负荷耐受。 随后讨论手腕、肘、肩带与腰盆髋在支撑和移动中的作用，以及可操作的练习进阶。"], [12, 为什么动作会影响大脑发展？", "婴儿逐渐学会翻身、坐、移动和站立，每项技能都有较宽的发展时间范围和个体差异。翻身使婴儿能够改变身体方向、探索周围环境，也提醒照顾者需要相应调整保护措施。观察这些变化，有助于理解动作能力如何随成长与经验发展。 本课程从呼吸和地面动作逐步讨论到站立、蹲和负重任务。儿童动作发展里程碑提供了观察支撑、平衡与移动的视角；用于成人教学时，我们可以借鉴这些姿势，调整支撑面积、重心高度和四肢负荷，让学员重新练习不熟悉的动作。成人学习同时受到既往经验、身体条件和训练目标的影响。 婴儿从翻身到爬行、站立和步行，伴随身体生长、神经系统成熟、练习经验与环境机会的共同变化。不同个体可能采用不同的移动策略；动作的发展是多种条件不断相互作用的过程。 到底，婴儿又是怎么从一个动作里程碑，进入另外一个动作里程碑的呢？ 将这个问题带回成人训练，我们可以思考：改变支撑点和任务难度后，学员需要哪些能力，又能从哪一步开始学习？儿童的发展顺序提供启发，成人进退阶仍应依据当下能力设计。"], [12, 为什么动作会影响大脑发展？（续）", "认识动作发展里程碑（milestone） 人类出生后的动作与认知能力仍在持续发展。随着肌力、体型、感觉和神经控制的变化，婴儿逐渐能够完成更多与环境互动的任务。其他动物也有各自的发展和学习过程。 离开母体后，儿童继续在活动、游戏和照顾者互动中积累经验。成熟与经验共同影响发展：地面的材质、可探索的空间、触手可及的物品和他人的回应，都可能改变动作练习的机会。 如果借用「环境也是孕育成长的空间」这个比喻，我们想强调的是：训练环境可以为学习创造机会。器械高度、支撑方式和反馈口令都能改变动作要求，教练可以据此为不同学员设计合适的练习。"], [12, 动作经验与发展研究为我们提供了什么线索？", "儿童动作观察可为发育评估提供信息，需要结合年龄、病史和标准化程序。成人熊爬练习则主要用于观察当前任务中的协调、支撑能力与症状反应。 动作里程碑包含维持姿势与移动的能力，例如坐、站、爬行和行走。这些动作提供了不同的支撑与重心转换任务。成人训练可以选择其中适合目标的部分，帮助学习新的协调方式。 基础动作（fundamental movement）的教学重点，是认识身体如何与支撑面及外部负荷互动。 练习观察：比较仰卧、四足跪姿与站姿时的支撑面积、重心高度和可移动的肢体。 重新练习地面动作，如同复习曾学过但较少使用的技能。不同课程会采用爬行、翻滚或姿势转换，结合自己的目标组织练习；例如Animal Flow、FMS相关练习、Ido Portal体系或DNS课程中，都可见到地面任务。选择这些动作时，可以具体说明训练目的：学习承重、改变支撑点、协调对侧肢体，或增加活动范围。再用学员的实际表现检验方法是否合适。"], [12, 婴儿研究有助于理解动作经验与发展之间的关联；成人训练效果则需要成人研究来判断。下面分别介绍这两类证据。", "Corbetta等人2014年研究43名12月龄婴儿，分析行走经验、手的使用偏好与脑电活动之间的关系。研究关注早期行走中手臂协作可能如何关联后续伸手任务，提供了跨任务动作经验与脑功能组织的线索。 结果显示，早期行走经验与手的侧化发展及脑电活动模式的变化相关。 可以把这项发现理解为：一种新动作经验，可能与其他任务中的协调方式变化相联系。 研究中的神经功能解释来自行为和脑电指标，是对发育过程的解释框架。 伸手取物是一种目标导向动作，需要结合支撑、重心转移与手臂控制。教学时也可以借鉴这一特点，让学员在四足支撑中轻触前方标记，再比较支撑手与躯干如何配合。这个成人练习是动作设计的应用，与婴儿研究的具体实验应分别理解。 Bell与Fox在1992年的研究中讨论额区脑电与婴儿认知任务表现的关系；1996年的研究进一步比较不同爬行经验的8月龄婴儿的脑电相干性。 1996年的分组包含尚未爬行、爬行1至4周、5至8周及9周以上的婴儿。 教学时，可将婴儿的探索活动作为理解感觉、动作与环境互动的例子；成人训练则依据成人研究和个人训练反应安排。"], [12, 婴儿研究有助于理解动作经验与发展之间的关联；成人训练效果则需要成人研究来判断。下面分别介绍这两类证据。（续）", "这些数据说明动作经验与发育中的脑电模式存在关联。脑电相干性反映记录信号之间的统计关系，研究者据此讨论皮质组织变化的可能解释。成人训练中的认知和协调效果，还需结合相应的人群与结局进行评估。 由这些研究可形成一条教学启发： 动作中的感觉反馈、协调练习与环境互动，值得在训练设计中受到重视；实际收益应通过目标相关的表现来观察。 Maclellan等人2012年研究成人手足爬行，记录身体右侧26块肌肉的肌电，并结合已知神经支配估计脊髓运动神经元池的活动分布。图中C5至S2分别指颈、胸、腰和骶髓节段。爬行与步行表现出不同的时空组织，说明改变支撑和移动方式会改变神经肌肉任务。 由表面肌电及肌肉节段支配信息建立的活动分布图。标示脊髓节段的纵轴用于表达映射结果；这类图属于间接估算。 对成人而言，爬行可以是练习四肢协调、肩带承重和姿势转换的一种选择。Matthews等人2016年的小型成人试验在四周四足训练后观察到部分认知灵活性和关节位置感指标的改善。训练中可结合方向变化、触碰目标和节律要求，但应以学员能否更好完成具体任务作为反馈。"], [12, 婴儿研究有助于理解动作经验与发展之间的关联；成人训练效果则需要成人研究来判断。下面分别介绍这两类证据。（续）", "Buxton等人的随机试验于2020年在线发表、2022年进入正式卷期。42名活跃大学年龄受试者参与八周研究，训练组在平常活动之外，每周参加两次、每次60分钟的四足动作课程。训练组的FMS总分及部分关节主动活动范围改善较大；动态平衡、握力和俯卧撑耐力的组间差异未达显著。课程包含多种姿势与转换，这些结果为整体课程提供了参考。"], [12, 熊爬时的肌⾁刺激与关节辅助", "先来说说，爬⾏的时候，你的身体会需要哪些因素才能爬的好。 手掌或稳定把手能够舒适承重。手腕伸展不耐受时，可提高支撑面、使用把手或减轻负荷；选择后再观察手腕、肘和肩的反应。 在面朝下的四点或六点支撑姿势下，躯干可以在维持相对稳定，并且手脚可以自由产生动作 为了满足以上两点，进行⼀个基础的爬行。你的身体在⼀眼瞬间，做了很多事。 首先来聊聊第一点，手掌可以支撑在地面上，也就是地面反作用力可以通过你的手掌手垫，将力量透过手臂，传递到肩关节、肩胛骨以及你的脊椎。为了让你的身体象是一张桌子一样稳定，手臂上每一个关节都需要在这个姿势下扮演好自己的角色。"], [12, 该如何扮演好支撑的角色呢？这个问题，又要分为两个部分回答：", "观察上肢支撑时，可以依次关注手腕、肘、盂肱关节、肩锁区域与肩胛胸廓配合。先了解既往损伤、目前症状与医疗建议，再从较容易的支撑任务开始。训练中同时询问感受、观察动作和疲劳；如果负荷或幅度调整后仍有明显不适，应进一步评估。 五个上手臂的关键稳定处如下： 上肢支撑：观察部位与教学提示 肩胛与胸廓：肩胛运动、胸廓位置与承重的协调。 盂肱关节：可用活动范围、肩袖和其他肩带肌的共同控制。 肩锁区域：既往伤情、局部症状及支撑耐受。 肘与前臂：肘部舒适、前臂和肩部位置适合支撑。 手腕与手掌：接触稳定、负荷可耐受，并能调整支撑角度。"], [12, 手部具有纵向与横向的弓形结构，帮助适应接触面和传递负荷。熊爬时，可以从双手约肩宽、手指自然分开开始，尝试食指朝前或稍外转的位置，寻找手腕舒适的支撑角度。手指方向是调整姿势的线索，手掌的实际受力还取决于关节位置与重心。", "手掌接触地面时，压力会随身体前后与左右移动而重新分配。让学员感受大鱼际、小鱼际及掌指区域的接触，避免局部明显疼痛或失去支撑。小幅尺桡偏可随任务出现，重点是逐步建立可耐受的负荷与控制。 Scordino等人2016年在6具尸体手腕上模拟两种俯卧撑支撑位置，切断舟月骨间韧带后测量舟月关节间的牵张力。在相关测试条件下，腕伸展位约为45 N，中立位约为25 N。研究针对韧带受损模型，为理解修复组织在不同腕位下的受力提供依据。 手部支撑：手弓与腕位 支撑训练对手腕的要求受到负重比例、腕伸展角度、时间与既往伤情共同影响。初学可先在墙面或高台上承重，再逐步过渡到地面。若存在持续局部痛、明显肿胀或外伤后活动受限，应先处理这些问题，再制定负荷计划。 在能够耐受的范围内，腕部承重可以逐步训练。先找到舒适的手位，使用小幅重心转移体验压力变化，再增加时间或移动距离。每次调整一项变量，观察当次及训练后的反应。 手腕与手掌的教学口令 「手指自然展开，找到舒适的手掌支撑；身体移动时，感受接触压力如何变化。」 观察局部疼痛、支撑是否稳定及手位调整后的变化。"], [12, 手部具有纵向与横向的弓形结构，帮助适应接触面和传递负荷。熊爬时，可以从双手约肩宽、手指自然分开开始，尝试食指朝前或稍外转的位置，寻找手腕舒适的支撑角度。手指方向是调整姿势的线索，手掌的实际受力还取决于关节位置与重心。（续）", "肘与前臂的位置 手掌向下支撑通常需要前臂旋前；肘窝朝向的变化也受到肩关节旋转影响。教学时可以轻微调整肩部方向与手位，找到肘、腕和肩都舒适的姿势。 DiTano等人2003年用9具尸体标本测量前臂旋前、旋后时不同腕部韧带的张力。各韧带束随姿势出现不同的受力变化，体现了组织之间的共同约束。图中的比较适用于受测韧带与实验条件。 在手掌保持接触的情况下，肩部旋转会影响肘窝方向和前臂的姿态。可尝试较小的姿势调整，比较是否更容易推稳地面。若某个口令使手掌翘起、手腕痛或肩部不适，应减少调整幅度或换用其他支撑方式。 肩、肘、腕会在承重任务中共同分配负荷。观察整个上肢与躯干的配合，再调整手位、支撑面高度或重量，可比仅固定一个关节方向更容易找到合适的动作。 前臂骨间膜参与桡骨与尺骨之间的连接和负荷传递。 Hotchkiss等人1989年的解剖与力学研究描述了前臂骨间膜不同区域的结构，并讨论其限制桡骨近端迁移的作用。中央束的厚度与其他区域存在差异，体现的是膜内区域结构的不同。 旋前与旋后都属于正常前臂运动。关节稳定依赖骨性结构、韧带和肌肉协同，选择支撑姿势时需同时考虑任务和个人耐受。"], [12, 肩锁关节关键稳定：肩锁关节的完整性", "肩锁关节位于锁骨外侧端与肩峰之间，参与肩带传力。既往跌倒或撞击、肩顶部疼痛、某些上肢动作不适，都是训练前值得了解的信息。症状的来源需要结合完整评估判断；教练可据此调整支撑负荷并决定是否转介。 训练前可采用简短的准备检查：询问既往伤情与当前症状，观察舒适的抬手与轻负荷支撑，再确认是否能够逐步增加承重。专门的诊断性检查由具备相应资质的专业人员执行。 Krill等人2018年的系统综述比较了肩锁关节临床检查。Paxinos与O’Brien试验串联使用时的特异度约为95.8%，但对诊断概率的总体改变仍有限。临床解释需要结合病史、其他检查和检查前的患病可能性。训练中若出现疼痛、支撑明显失控或疲劳导致动作持续变形，可先结束本组并调整负荷。 肩锁区域的训练观察 询问肩顶部或相关动作中的疼痛，以及既往外伤和医疗建议。 用可耐受的轻负荷支撑观察反应，必要时转介。 肩部支撑练习的起点与调整 恢复时间取决于损伤类型、严重程度、既往情况和治疗进程。负重进阶可依据症状、活动范围、力量与任务耐受逐步安排。有明确伤情或持续疼痛时，先取得相应评估与训练建议，再选择支撑版本；训练强度用个人可以控制的负荷描述，并追踪反应。"], [12, 肩锁关节关键稳定：肩锁关节的完整性（续）", "盂肱关节与肩袖协作 手掌大致位于肩下方时，地面反作用力经上肢传至肩带，肩袖与其他肌肉共同调节肱骨头和肩胛的位置。先比较两侧舒适的活动范围与轻负荷支撑，再根据差异调整手位或支撑高度。若怀疑急性脱位，或外伤后出现明显畸形、剧痛和活动障碍，应及时就医处理。"], [12, 肩胛胸壁关节关键稳定：脊椎协调", "熊爬中的肩胛需要随上肢承重与移动协调运动，前锯肌、斜方肌、肩袖及躯干肌共同参与。教学时可观察肩胛、胸廓与手臂的配合，允许适当运动，同时维持可控制的支撑；静态保持和移动任务对肌肉的要求各有不同。 熊式静态保持、原地交替抬手脚和向前移动，会改变支撑点和肌肉工作的时间安排。Pyka等人在2017年会议报告中让30名有休闲运动习惯者各完成30秒的三种任务，原地抬肢与移动条件的所测肌肉活动高于静态保持，其中腹外斜肌在原地抬肢时更高。下图呈现该会议资料的肌电结果。课堂可短时间尝试三个版本，结合用力感、动作完成度与恢复情况选择任务。 Pyka等2017年会议报告：30名受试者三种熊式任务的标准化肌电，误差线为标准误。图中BH、LL、BC分别对应静态保持、原地抬肢和移动爬行。 Maclellan等人的研究表明，成人爬行具有不同于步行的肌肉活动组织方式。用于教学时，可关注手脚交替、支撑转移和躯干控制，逐步建立顺畅的移动节律。"], [12, 肩胛胸壁关节关键稳定：脊椎协调（续）", "如果学员有腿长差异、腰盆部或颈部症状，应先了解具体情况，再判断爬行是否适合。可以从较高支撑面、膝部着地或短距离开始，观察其功能与症状变化。训练选择应围绕个人目标，而不是根据单一体态为所有人规定同一动作。 躯干控制与髋部协调 熊爬可同时训练肩带承重、躯干控制与四肢协调。它在课表中的用途取决于负荷和任务：短时间练习可以侧重技能，较长持续时间或更困难的支撑可提高耐力与力量需求。 熊爬与死虫都要求在四肢移动时调节躯干位置，便于进行教学类比。翻转身体后，重力、支撑点和肩部承重改变，控制需求也随之变化。练习时需要重新观察伸展、旋转和侧向摆动，而不是直接复制仰卧时的用力方式。 由哪些肌肉协同产生躯干的稳定呢？ 腹壁、脊柱后方与髋部肌群共同参与熊爬。教练观察的是动作结果，例如重心转移是否平顺、腰盆部是否出现超出任务目标的摆动，以及呼吸和症状反应。死虫与熊爬可提供不同观察条件，帮助调整练习难度。 腰方肌与髋关节的连动性 腰方肌连接髂嵴、腰椎横突及第12肋，参与腰盆部侧向控制，并可影响第12肋的固定。其力学作用依区域、姿势与任务而变；判断整体稳定需求时，应把它与腹壁和其他脊柱肌共同考虑。"], [12, 肩胛胸壁关节关键稳定：脊椎协调（续）", "坐姿动作观察：比较两侧骨盆移动、髋活动及舒适度，再根据实际任务调整练习。 在单侧承重或侧向重心转移中，骨盆上提、躯干侧屈和髋关节运动可能共同出现。具体组合受到支撑位置、步幅、关节活动范围和动作策略影响。课堂可在坐姿或站姿练习小幅左右重心转移，感受不同部位如何协作。 对左右差异的处理可以从任务调整开始：改变支撑面、缩小移动范围或降低速度，再比较舒适度与控制。如果差异持续伴随疼痛或明显功能受限，可进一步评估其原因。 熊爬时如果脚的轨迹向内绕行，可同时观察步幅、手脚间距、骨盆转动和髋部舒适度。先尝试较短的步幅或更宽的支撑，比较轨迹是否自然改善。轨迹的变化可作为动作学习反馈，具体肌肉或韧带问题需要其他评估信息。 本章的两个实践重点 利用爬行练习支撑与四肢协调，通过可重复的任务观察当前能力。 根据手腕、肘、肩带与腰盆髋的反应，调整支撑方式、步幅、速度和练习量。 学会了，你该如何实践本章节的内容呢？"], [12, 肩胛胸壁关节关键稳定：脊椎协调（续）", "初学可从四足跪姿开始，双手约肩宽，找到舒适手位，练习小幅前后重心转移。能够平顺呼吸与承重后，再让膝盖短暂离地，随后尝试对侧手脚交替小步前进。可先做2至3组，每组约10至20秒或4至6个交替步，组间休息至可以平稳继续；这些是教学起点。观察支撑是否舒适、呼吸是否连续、动作能否重复，再逐步增加距离或方向变化。出现持续疼痛或动作失控时，降低负荷或结束本组。"], [12, Reference:", "Corbetta D, et al. (2014). Brain reorganization as a function of walking experience in 12-month-old infants: implications for the development of manual laterality. DOI: 10.3389/fpsyg.2014.00245. PMID: 24711801. Bell MA, Fox NA. (1992). The relations between frontal brain electrical activity and cognitive development during infancy. DOI: 10.1111/j.1467-8624.1992.tb01685.x. PMID: 1446545. Bell MA, Fox NA. (1996)."], [12, Reference:（续）", "Crawling experience is related to changes in cortical organization during infancy: evidence from EEG coherence. PMID: 8911771. https://pubmed.ncbi.nlm.nih.gov/8911771/ Maclellan MJ, et al. (2012). Features of hand-foot crawling behavior in human adults. DOI: 10.1152/jn.00693.2011. PMID: 21975454. Scordino L, Werner FW, Harley BJ. (2016). Force in the Scapholunate Interosseous Ligament During 2 Simulated Pushup Positions. DOI: 10.1016/j.jhsa.2016.02.010. PMID: 27021634. DiTano O, et al. (2003)."], [12, Reference:（续）", "Biomechanical function of the distal radioulnar and ulnocarpal wrist ligaments. DOI: 10.1016/S0363-5023(03)00183-7. PMID: 12877850. Hotchkiss RN, et al. (1989). An anatomic and mechanical study of the interosseous membrane of the forearm: pathomechanics of proximal migration of the radius. DOI: 10.1016/0363-5023(89)90017-8. PMID: 2703671. Krill MK, et al. (2018). A concise evidence-based physical examination for diagnosis of acromioclavicular joint pathology: a systematic review."], [12, Reference:（续）", "DOI: 10.1080/00913847.2018.1413920. PMID: 29210329. Matthews MJ, et al. (2016). Quadrupedal movement training improves markers of cognition and joint repositioning. DOI: 10.1016/j.humov.2016.02.002. PMID: 26896559. Buxton JD, et al. (2022; 2020在线发表). The Effects of a Novel Quadrupedal Movement Training Program on Functional Movement, Range of Motion, Muscular Strength, and Endurance. DOI: 10.1519/JSC.0000000000003818. PMID: 33021583. Pyka DT, Coburn JW, Brown LE, Costa PB. (2017)."], [12, Reference:（续）", "Effects of Static, Stationary, and Traveling Trunk Exercises on Muscle Activation. NSCA National Conference, Las Vegas. 会议报告，30名受试者；作者发布版本：https://www.researchgate.net/publication/318471304 Pyka DT, Costa PB, Coburn JW, Brown LE. (2017). Effects of Static, Stationary, and Traveling Trunk Exercises on Muscle Activation. International Journal of Kinesiology and Sports Science, 5(4), 26–32. DOI: 10.7575/aiac.ijkss.v.5n.4p.26. 期刊版本，40名受试者。"], [12, Reference:（续）", "部位 主要观察 可用提示 手掌与腕 接触、支撑角度与承重舒适度 让掌面稳定接触；必要时垫高手部或使用稳定把手 前臂与肘 掌撑地时前臂旋前；肘部承重控制 手掌保持接触，在舒适范围内控制肘部位置 盂肱关节 肩袖与其他肌群共同参与控制 根据当前范围和负荷练习，保留肩部舒适度 肩锁区域 既往伤情、局部症状与支撑耐受 从较容易的支撑开始，逐步增加负荷 肩胛与胸廓 随承重和移动协调调整 平稳推离支撑面，让肩胛随任务自然运动 结构或任务 教学要点 近侧横弓、远侧横弓与纵弓 手部结构兼顾稳定与适应接触面的能力，负荷会随接触方式分布 手掌支撑 以稳定且舒适的接触为目标，手指可自然展开 腕伸展与尺、桡偏 活动方向会改变局部受力；根据症状与负荷耐受调整角度 难度调整 可垫高手部、缩短支撑时间，或选用稳定把手 观察结果 训练安排 轻负荷支撑舒适且可控 从较高支撑面或四足跪姿开始，逐步延长时间 支撑时出现不适或控制困难 减少承重、调整手位与范围，复测反应 外伤后明显畸形、剧痛或活动障碍 及时接受医疗评估与处理"], [3, 本章导读", "死虫看似简单，却需要专注于手脚与躯干的协调。许多学员刚开始练习时，会发现自己很容易屏气、挺腰或让骨盆随四肢移动。把一个动作拆小，在可控制的范围内反复练习，是学习这项技能的起点。"], [3, 死虫到底是个什么样的动作呢？", "「死虫」得名于仰卧时手脚交替移动的外观。它提供了一个有地面支撑的练习环境，便于学习四肢与躯干的分化控制，以及在四肢移动时调节腰椎和骨盆的位置。"], [3, 分化与抗旋转是什么概念？", "分化的意思是就是分开控制的意思，当我想要举起我的手的时候，我希望单独做出举⼿的动作，⽽不是但随腰椎的过度挺直；当我想要把脚踢出去的时候，不想要伴随骨盆的翻转。 分化控制帮助我们按任务需要组织动作。例如伸手拿远处的物品时，既可以主动带动躯干，也可以练习在躯干相对安定的情况下抬起手臂。 练习时先说明希望哪一部分移动、哪一部分保持相对稳定，学员才有清楚的观察目标。不同任务可以采用不同的协调方式。 分化控制的教学口令可以是「手脚移动，躯干保持在你能控制的位置」。适当的躯干肌活动有助于应对四肢移动带来的力矩，参与程度随负荷改变。课堂上可以比较自然举手与先准备腹壁张力再举手时的感受，找到更容易完成任务的方式。我也曾观察到部分学员在核心练习后完成硬拉更顺畅；这种即时变化可能同时受到热身、熟悉动作、注意力和疲劳等因素影响。硬拉的长期力量进步仍需通过系统训练和重复测试评估。 躯干控制包括对屈曲、伸展、侧屈和轴向旋转的调节，也包括在需要时主动产生这些运动。训练前先确定外力会把身体带向哪里，再选择与目标相应的任务。"], [3, 分化与抗旋转是什么概念？（续）", "例如站在地铁里受到侧方碰撞时，身体需要结合跨步、髋踝调节与躯干肌活动保持平衡。碰撞的位置和方向不同，可能同时产生侧屈、旋转或前后倾的需求。 在死虫中，手臂或腿远离躯干会改变重力作用的力臂。腿逐渐伸向地面时，腹壁需要协助控制腰椎伸展与骨盆前倾的趋势；单侧或对侧肢体移动还会改变旋转和侧向控制需求。可以先移动一只手或一条腿，再逐步组合。 实际上，躯干分化与抗旋转的挑战充斥在我们的生活中，妈妈需要单手推着娃娃车，或是站在地铁上单手拉着吊环维持身体稳定，我们生活中几乎所有的行为都是单手单脚移动，也因此对脊椎产生许多抗旋转的需求。 日常旋转是正常活动的一部分。腰痛与活动负荷、既往症状、睡眠、心理和社会因素等有关，个体差异很大。训练可从可耐受的动作开始，逐步提高力量、耐力与信心，并观察功能变化。 以上说明了分化练习与多方向躯干控制的意义。死虫提供了一个便于观察的起点，之后还可以把练习延伸至坐、站、搬举和运动专项。"], [3, 分化与抗旋转是什么概念？（续）", "分化练习可以在多种姿势下进行。仰卧时，地面提供触觉反馈和部分支撑，学员容易感受到骨盆位置与腰背接触的变化。腰椎本身具有自然曲线，起始时可保留舒适的小弧度，也可根据任务轻微后倾骨盆。观察重点是四肢移动后，能否继续控制所选择的位置、自然呼吸并保持舒适。若控制变差，先缩短手脚移动距离或增加支撑，再比较表现。"], [3, 多裂肌对于腰椎的重要性与相关研究", "多裂肌位于脊柱后方深层，参与脊柱伸展、节段控制及对外部扰动的调节。腹壁肌、竖脊肌、膈肌和髋周肌也会依任务共同参与。认识多裂肌，有助于理解深层肌与整体动作之间的关系。 Goubert等人2016年的系统综述纳入15项研究，对慢性腰痛人群多裂肌萎缩提供了中等程度的证据，其他肌肉和不同病程中的结果较不一致。Thakar等人2016年回顾120例接受手术的成人峡部型腰椎滑脱病例，观察到多裂肌横截面积较小、竖脊肌横截面积较大的群体差异。这些结果提示特定临床人群值得关注的肌肉形态特征；个人训练能力还需结合症状和功能评估。 Wan等人2015年用MRI比较急性与慢性单侧腰痛患者的椎旁肌形态和脂肪浸润。Hildebrandt等人2017年也研究了多裂肌脂肪浸润与腰部功能指标的关系。下图展示MRI脂肪浸润分级；它描述的是影像中的组织组成。疼痛、动作控制与生活功能需要各自评估，再与影像结果一并解释。"], [3, 多裂肌的位置", "多裂肌从骶部向上延伸至颈椎区域，肌束通常跨越约2至4个椎节，连接下方的骶骨或椎骨附着点与上方棘突。其斜向排列参与伸展、旋转力矩及节段控制，具体作用取决于所在区域、姿势和其他肌肉的共同活动。 多裂肌在不同脊柱区域的厚度和肌束形态不同，也存在个体差异。体表标记可以帮助理解大致位置；深层肌肉的真实大小与组织状态需要影像等方法测量。 FARES线下课程会通过体表绘图练习寻找脊柱棘突和附近骨性标志，理解肌束的走向。绘图、动作想象与轻触可以用作感知回馈，帮助学员把解剖知识连接到动作体验。实际练习中再观察呼吸、用力感和动作控制，逐步建立可重复的技巧。"], [3, 通过动作观察练习躯干控制", "猫与骆驼式可作为探索脊柱屈伸的低负荷动作。四足跪姿下，在舒适范围内缓慢改变脊柱形态，比较不同位置的用力和呼吸感受。教练可观察运动是否平顺、是否出现不适，以及能否按口令控制速度；这些观察适合指导动作选择。接下来介绍的仰卧下躯干旋转练习，则提供另一种有地面支撑的控制任务。 仰卧下躯干旋转（lower trunk rotation）可用于观察腰盆部随腿部移动的协调及症状反应。练习前说明本次希望使用的幅度和骨盆运动方式，过程如下： 仰躺姿势下，双脚膝盖弯曲，双脚脚掌放在地面上 找到腰背舒适的起始位置，感受骨盆与地面的接触，保持自然呼吸。 慢慢的将双膝盖并拢的腿部，往一侧侧倒 观察骨盆、腰背与胸廓如何随腿部移动，以及动作是否舒适、平顺。 腿部向侧方移动的幅度增大时，骨盆通常也会逐渐滚动。若本次目标是保持骨盆相对安定，就缩小腿部的移动范围；若目标是探索腰盆部活动，则允许可控制的滚动。 可在学员同意后轻触腰盆部，或请其想象骨盆稳稳放在地面，帮助理解任务。通过减小幅度、放慢速度和重复尝试，寻找呼吸顺畅、症状可接受的动作方式。"], [3, 从低负荷控制到抗阻训练", "低负荷动作可用来熟悉腰盆部的位置与运动控制，随后根据目标和耐受逐步加入抗阻训练。Colado等人2011年的实验比较了不同稳定及力量动作的椎旁肌电活动，提供了负荷选择的参考。实际进阶可从髋铰链、较高起点的提举或轻重量硬拉开始，同时观察动作完成度、用力感及训练后的反应。 Colado等人2011年的实验比较与主要结果如下： 该研究比较了无腰痛志愿者完成局部稳定动作与多关节力量动作时的椎旁肌电活动，结果描述的是各测试条件下的即时肌肉活动。 该研究纳入25名无腰痛志愿者。在所比较的条件中，硬拉等多关节负重任务可以产生较高的椎旁肌活动。论文采用的70% MVIC指最大随意等长收缩的参照条件；它与一次最大动态举重重量（1RM）属于不同测量。 图中的比较反映当次实验的肌电幅度。训练时可根据学员能力，从较容易的局部控制任务逐渐过渡到多关节负重任务；是否使用不稳定支撑，取决于想练习的任务。长期力量、耐力与疼痛变化，需通过训练周期和后续评估判断。"], [3, 从低负荷控制到抗阻训练（续）", "在课程中，我重视把低负荷动作体验连接到硬拉等整体技能。学习硬拉时，可以先探索髋关节活动、四足跪姿后坐和髋铰链，再用木杆或轻重量练习。根据器械与目标调整起始高度、杠铃与身体的距离，并通过视频或轨迹回馈改善动作。学习所需时间因经验、症状和信心而异；教练应依据表现推进，而不必在一堂课内完成固定进阶。 训练规划可以借用财务规划的类比：先了解现有能力与目标，再分配合适的负荷和恢复。起始评估包括症状、日常活动、动作经验和目前能承受的训练量。低负荷控制练习与较大肌群的抗阻训练可以相互配合，在连续观察和调整中逐渐提高整体能力。 我曾指导一位被诊断为腰椎滑脱的大学教授。他对身体状况较为担心，我们讨论的重点是如何在医疗建议与症状允许的范围内恢复活动，并循序增加力量训练。我希望他看到身体仍有可以培养的能力，而不是仅凭诊断名称放弃所有负重活动。具体动作与负荷，需要结合他的病情和当下反应选择。 有⼀次上课，他终于忍不住问我 他当时的疑问是：腰椎已有结构性问题，今后还能进行力量训练吗？"], [3, 从低负荷控制到抗阻训练（续）", "这类讨论需要把结构、症状与功能分开考虑。结构性诊断并不完整代表一个人的活动能力；是否适合某种负荷，应结合病情、医疗意见和训练反应共同判断。我们的训练目标是逐步改善可完成的活动与信心。 对他来说，理解训练可以逐步调整，比立即挑战某个重量更有帮助。 专业指导需要把知识转化为学员能够理解并执行的步骤。对于有明确诊断的人，教练应与医疗专业建议衔接，在可承受的负荷下建立活动经验，持续记录训练反应，帮助学员逐渐扩展自己的能力。"], [3, 死虫姿势下的腰盆部观察", "下躯干旋转与死虫都利用了仰卧支撑，但训练任务不同：前者可以探索腰盆部的运动与控制，后者常要求在四肢移动时维持所选择的躯干位置。两者可根据学员需要组合使用。 死虫练习中，仰卧于地面，在舒适的腰盆起始位缓慢移动手脚。基础变化包括手臂向头侧移动、交替屈伸髋膝；也可在保持控制的范围内加入肩外展或髋旋转。躯干允许随呼吸产生自然的小幅变化，任务是控制四肢移动带来的额外摆动。 当腿伸长并接近地面时，抗伸展需求通常增加；不对称的肢体移动还可能增加轴向旋转和侧向控制需求。教练可分别调整力臂、幅度与支撑点，使挑战与学员能力相匹配。 完成这些任务需要哪些肌群共同参与？ 腹壁肌、脊柱后方肌群与髋部肌群会根据动作共同调节。我的教学中也会使用骨盆时钟，让学员在仰卧时探索骨盆的小幅前后倾和侧向滚动，建立不同方向的位置感。练习完成后，再进入死虫，比较四肢移动时是否更容易保持选定位置。 在能够舒适控制腰盆位置后，可以利用手脚的重量与移动距离逐步增加挑战，并记录不同版本的完成次数和主观难度。"], [3, 执行方法如下：", "第一步：仰卧，找到舒适的腰盆起始位。逐一抬起双脚，使髋膝接近90°；若难度过高，可把小腿放在椅面上，或保留一只脚着地。保持呼吸，观察能否控制起始位置。 第二步：一次缓慢移动一只手，逐渐向头侧伸展。手臂只移动到能够保持腰盆控制、肩部舒适的范围；不必强求贴近耳旁或触地。 第三步：在手臂移动的同时，尝试伸出对侧腿。先缩短移动距离，再逐步接近地面。左右缓慢交替，观察骨盆是否出现超出任务目标的前倾、旋转或侧移。 第四步：如有需要，加入小幅肩外展或髋旋转，比较不同方向对躯干控制的挑战。一次先改变一个变量。 当某个版本可以舒适完成每侧约6至8次、呼吸自然且动作可重复时，可把它作为一次进阶讨论的起点。初学可安排1至2组，组间休息至能够平顺完成下一组；次数和组数可随目标调整。进阶方式包括增加力臂、轻阻力或转入四足、站姿等任务。负重死虫也可以用于特定训练目的，选择哪一种版本取决于学员需要，而非固定的动作效率排序。"], [3, 腰大肌与腰盆髋协作", "腰大肌连接腰椎与股骨小转子，是重要的髋屈肌。它跨越腰盆髋区域，在不同姿势中也会影响脊柱的受力与控制。学习这块肌肉时，需要同时考虑髋关节运动、躯干固定方式和外部负荷。 下图为Neumann肌动学教材中的腰盆髋关系示意，可帮助理解髋伸展与腰盆部位置之间的联系。把它应用于死虫时，应把腿部移动与骨盆、腰椎的实际反应一起观察： 腿部从髋屈曲位置向地面伸展时，可能伴随骨盆前倾的趋势，其程度受到姿势、肌肉张力和主动控制影响。 骨盆前倾可与腰椎伸展共同出现，也可以通过主动控制限制其幅度。 腹直肌、腹内斜肌和腹外斜肌等可提供抵抗骨盆前倾与腰椎过度伸展的力矩；腹横肌与脊柱后方肌群也参与调节躯干刚度和受力。腰大肌主要根据髋屈任务与脊柱姿势参与协作。 各肌的活动水平随任务改变，观察整体动作与使用合适的测量方法，有助于理解这种协作。 在死虫中使用「骨盆稍微向后转」或「保持腰背的位置」等口令，目的是帮助学员调节腰盆姿势。选择口令后，观察动作是否更容易控制、呼吸是否顺畅，并保留有效的提示。腰大肌的参与需要结合髋部动作与负荷来理解。"], [3, 腰大肌与腰盆髋协作（续）", "解剖知识帮助教练理解关节之间的关系，教学口令则需要让学员容易执行。例如「想象骨盆是一只水桶，轻轻调整桶口方向」可以表达骨盆倾斜；「手脚伸远，躯干保持安定」可以表达分化控制。口令是否合适，要看它对动作和感受的实际帮助。 腰盆位置相对稳定时，相关躯干肌可以在近似等长的条件下调节张力；同时，移动手脚所需肌肉的长度和活动会随着关节角度改变。矢状面抵抗腰椎伸展的任务通常称为抗伸展，绕脊柱长轴的控制则属于轴向抗旋转。 观察要点：腿部伸展时，比较腰盆位置、呼吸、用力感和可控制的移动距离。 下位肋骨的外观受到胸廓形态、呼吸、躯干姿势和个体差异影响。死虫中如果伸腿伴随明显挺腰或骨盆前倾，可先缩短力臂、调整腿部支撑或减小范围，再观察变化。Dewberry等人2003年的研究分析了悬垂双侧髋屈曲中的骨盆与股骨运动，提示任务和膝位会影响腰盆髋之间的运动分配；该结果适用于其特定测试情境。 死虫可帮助学员探索胸廓与骨盆在四肢移动时的相对控制。之后可在坐姿、站姿和负重任务中重新练习，并观察是否有助于完成实际目标。体态外观与功能应分别记录，进步可以表现为更舒适、更有力量或更容易控制动作。"], [3, 腰大肌与腰盆髋协作（续）", "训练沟通应帮助学员理解自己的身体，减少对单一外观的担忧。教练可以询问哪些活动受到影响、哪些动作引起不适，以及学员希望恢复什么能力，再共同选择可执行的步骤。对疼痛保持关注，对体态保持客观，持续用功能和生活体验检验训练的价值。"], [3, 万物皆死虫", "我的好友、FARES课程开发者Rise曾拍摄一个影片，从死虫逐渐转换到地板卧推、臀桥、臀推、四足支撑、深蹲、坐姿、站姿与悬挂。影片展示了一条教学思路：在不同身体位置中，反复探索四肢活动与躯干控制的关系。 （影片的连结在此：https://mp.weixin.qq.com/s/vkqRyuAbcQWRJgmfIEtxhw） 迁移练习：分别尝试死虫、四足支撑和徒手深蹲，比较支撑点、重力方向、呼吸与躯干控制的变化。 把死虫放在课程较前的位置，是为了提供一个容易观察和调整负荷的学习环境。 通过改变手脚的位置，学员可以练习控制伸展、旋转及侧向扰动。掌握后，再根据目标决定继续增加死虫负荷，或把技巧应用到爬行、站姿、深蹲和搬举。每一次姿势变化都会改变支撑条件和受力，需要重新练习与评估。"], [3, 死虫的负荷调节方法", "死虫的难度由多个变量共同决定。腿或手离躯干越远，重力产生的外部力矩通常越大；双侧同时移动比单肢移动需要更多协调；降低支撑点、增加外部负重或延长每次动作时间，也会提高任务需求。教练可以先改变力臂和动作范围，再考虑增加重量。 最容易的起点可以是仰卧屈膝、双脚着地，只移动一只手；也可以把小腿放在椅面上，减少髋屈肌维持腿位的需求。下一步可交替抬脚或滑动脚跟，再进入髋膝约90°的桌面位。是否进入下一步，以呼吸、腰盆位置、动作重复性和症状反应为依据。 进阶时，一次只增加一个主要变量。例如先把手臂移动得更远，保持腿不动；随后再增加单腿伸展；最后组合对侧手脚移动。使用弹力带、药球或哑铃时，先确认负荷方向与训练目标，再从能完成每侧6至8次的轻负荷开始。这个次数是课堂起点，可以根据力量、耐力或技术目标调整。 退阶并不意味着动作失败。缩短腿的移动距离、弯曲膝关节、把一只脚放回地面、提高手部支撑或减少每组次数，都可以让学员在当前能力下获得稳定的练习经验。连续几次训练均能保持目标技术且恢复良好时，再逐步增加挑战。"], [3, 死虫课堂的观察与反馈", "观察一：呼吸。学员是否在动作开始后立刻屏气，是否能在手脚移动时保持平稳呼吸。若呼吸中断，可以缩小范围或降低负荷，再尝试较慢的动作节奏。 观察二：腰盆控制。先约定本次希望保持的腰盆位置，再观察腿部伸展时是否出现超出目标的前倾、旋转或侧移。腰部与地面之间保留舒适的小弧度并不等同于动作失败；重点是位置是否可控、可重复并且没有不适。 观察三：四肢路径。手臂是否能够在肩部舒适范围内移动，腿部是否沿预定方向伸展。若躯干为了完成更大范围而明显失去控制，先缩短路径，再逐渐增加。 观察四：症状与恢复。练习中的疼痛、麻木、明显下坠感或漏尿需要记录。训练后和次日的反应同样重要。出现持续或加重的症状时，应降低负荷并按需要进一步评估。 反馈可使用外部目标和内部感觉两类口令。外部目标例如“脚跟向前方墙面伸远”“手背向头顶方向移动”；内部感觉例如“保持腹壁张力”“让骨盆停在选定位置”。选择能改善实际动作的口令，不要求所有学员使用同一句提示。"], [3, 从死虫迁移到力量训练", "死虫提供仰卧支撑和清晰的四肢移动路径，适合学习躯干与四肢协调。迁移到站姿和负重动作时，重力方向、支撑面和关节力矩都会改变，因此需要在新任务中重新练习，而不是假设低负荷动作会自动转化为硬拉或深蹲表现。 进入髋铰链时，可先用墙触臀或木杆反馈练习髋部向后移动，同时保持自然呼吸。随后加入壶铃或抬高起点的硬拉。每次增加重量后，重新观察躯干位置、杠铃路径、用力感和症状。死虫可以作为热身或辅助练习，主项能力仍由主项训练建立。 进入单侧任务时，可使用单手提物、分腿站姿抗阻或单侧推拉，练习抵抗旋转与侧屈。负荷应允许学员保持预定动作，同时自然调整躯干。身体完全不移动并不是所有任务的目标；控制意味着运动幅度与方向符合任务需要。 训练记录可包含死虫版本、每侧次数、外部负荷、主观难度、呼吸表现，以及主项训练的重量和技术。连续数周的数据比一次触诊或一次动作外观更适合判断进步。"], [3, Reference:", "Goubert D, et al. (2016). Structural Changes of Lumbar Muscles in Non-specific Low Back Pain: A Systematic Review. PMID: 27676689. https://pubmed.ncbi.nlm.nih.gov/27676689/ Wan Q, Lin C, Li X, Zeng W, Ma C. (2015). MRI assessment of paraspinal muscles in patients with acute and chronic unilateral low back pain. DOI: 10.1259/bjr.20140546. PMID: 26105517. Thakar S, et al. (2016)."], [3, Reference:（续）", "Lumbar paraspinal muscle morphometry and its correlations with demographic and radiological factors in adult isthmic spondylolisthesis: a retrospective review of 120 surgically managed cases. DOI: 10.3171/2015.9.SPINE15705. PMID: 26771373. https://pubmed.ncbi.nlm.nih.gov/26771373/ Colado JC, et al. (2011). The Progression of Paraspinal Muscle Recruitment Intensity in Localized and Global Strength Training Exercises Is Not Based on Instability Alone. DOI: 10.1016/j.apmr.2011.05.015."], [3, Reference:（续）", "PMID: 22032222. Hildebrandt M, et al. (2017). Correlation between lumbar dysfunction and fat infiltration in lumbar multifidus muscles in patients with low back pain. DOI: 10.1186/s12891-016-1376-1. PMID: 28068962. Hodges PW, Richardson CA. (1997). Contraction of the abdominal muscles associated with movement of the lower limb. DOI: 10.1093/ptj/77.2.132. PMID: 9037214. 此项研究用于理解下肢动作与腹部肌活动的关系。 Dewberry MJ, et al. (2003)."], [3, Reference:（续）", "Pelvic and femoral contributions to bilateral hip flexion by subjects suspended from a bar. DOI: 10.1016/S0268-0033(03)00096-2. PMID: 12828897. https://pubmed.ncbi.nlm.nih.gov/12828897/"], [2, 本章导读", "我曾在練習捲腹的過程中經歷腹直肌分離，也曾在調整訓練後感到腹部功能改善。這段經驗使我更重視動作選擇與負荷安排。個人的症狀變化受到訓練、恢復和生活等多方面影響；評估腹直肌分離時，還需要結合腹直肌間距、腹壁張力、疼痛與日常功能。本章介紹腹壁肌肉的結構、捲腹的研究結果，以及如何依照學員的目標與反應安排練習。"], [2, 捲腹的解剖： 腹直肌", "腹壁的主要肌肉包括腹直肌、腹外斜肌、腹內斜肌與腹橫肌。腹直肌位於腹部前側、白線兩旁；側腹壁由外向內依次為腹外斜肌、腹內斜肌和腹橫肌。這些肌肉共同參與軀幹運動、腹腔壓力調節與呼吸，各自的參與程度隨姿勢和任務改變。 腹直肌左右各一條，起於恥骨嵴和恥骨聯合，向上附著於劍突以及第5至第7肋軟骨。 腹直肌雙側收縮可使軀幹屈曲；當胸廓相對固定時，也可參與骨盆後傾，並與其他腹壁肌共同調節腹壓。 常見的「六塊腹肌」外觀，來自左右腹直肌、中央白線與橫向腱劃共同形成的輪廓。腱劃的數目、位置和對稱程度有個體差異。Anita等人2015年解剖54具北印度成人標本，觀察到三條腱劃最常見，也有較少或較多腱劃的變異。照片中可見的腹肌塊數還會受到腱劃完整程度與皮下脂肪影響。 白線位於腹部正中，由兩側腹壁肌的腱膜交織形成，連接左右腹直肌鞘，是腹壁傳遞張力的結構之一。 妊娠等情況下，腹壁受到持續牽張，白線的寬度與力學特性可能改變，左右腹直肌間距隨之增大。腹直肌分離的功能表現因人而異；教練可記錄負荷時的腹壁反應、舒適度和日常活動能力，必要時配合醫療專業評估。"], [2, 捲腹的解剖： 腹直肌（续）", "腹直肌外側緣附近的半月線大致縱向延伸；弓狀線則是下腹部腹直肌鞘後層結構轉變的界線，位置具有個體差異。弓狀線以下，三層側腹壁肌的腱膜均從腹直肌前方通過，腹直肌後方主要為腹橫筋膜等結構。這是腱膜包覆方式的改變。觸診下腹部時，可將輕柔收縮的感受用作學習回饋；準確區分腹橫肌與腹內斜肌的活動通常需要更具體的測量方法。 Dafkou等人2020年以11名健康受試者進行急性超聲測量，比較仰臥抬軀幹、抬腿和兩者結合時腹直肌的厚度及長度變化。抬腿任務對遠端區域的形態變化較明顯，而不同任務間整體厚度變化未顯示一致差異。這項研究提供了腹直肌區域形態反應的線索；安排上、下腹部訓練時，仍應以可控制的負荷、完整課表及持續訓練後的表現為依據。"], [2, 捲腹的解剖：腹外斜肌", "腹外斜肌起於第5至第12肋，向下內方延伸，連接白線、髂嵴及恥骨附近結構，其腱膜下緣參與形成腹股溝韌帶。它主要接受胸腹神經與肋下神經支配。雙側活動參與軀幹屈曲與腹壓調節，單側活動可參與同側側屈及對側旋轉。在推、拉、走路和投擲等整體動作中，它也會與肩帶和髖周肌肉協調。教學可借助斜向動作說明肌群協作，再以實際負荷方向分析每個人的任務需求。 Kim與Park於2018年讓20名健康男性在髖屈曲45°和90°兩種姿勢下完成捲腹，比較最大吸氣、緩慢呼氣與最大呼氣三種條件。 研究記錄的是當次動作的肌電活動。主要觀察如下： 在本研究的兩種髖角度中，90°條件的腹內、外斜肌活動較高；腹直肌活動未呈現顯著差異。 最大呼氣條件下，腹內斜肌活動高於緩慢呼氣條件。 最大呼氣條件下，腹內、外斜肌活動高於最大吸氣條件。 教學時可把髖屈曲約90°配合呼氣作為增加腹斜肌參與的動作選項。先讓學員掌握舒適、連續的呼吸，再依耐受增加呼氣力度。目標是協調呼吸與軀幹動作；長期力量或肌肥大效果需要透過持續訓練與追蹤判斷。"], [2, 捲腹的解剖：腹橫肌與腹內斜肌", "腹橫肌與腹內斜肌都參與腹壁張力和軀幹控制。兩者下部纖維方向較接近，在若干姿勢與呼吸任務中可共同活動；它們的作用也隨外部負荷和動作方向改變。 Hodges與Richardson於1997年研究快速上肢動作的預備性軀幹肌活動，發現腹橫肌的啟動時序較少受手臂方向影響，其他受測軀幹肌的時序則有方向差異。 這類預備性活動反映神經系統對動作擾動的調節。Miller與Medeiros在1987年的研究則以40名受試者探索視覺、聽覺、觸覺與動作感受提示對捲腹離心階段的影響。 該研究在慢慢向後放下軀幹時，使用多種感覺提示引導下腹部參與。其表面肌電測量反映腹內斜肌與腹橫肌區域的聯合訊號。課堂可使用「慢慢放下，感受腹壁保持張力」等口令，經學員同意後配合輕觸回饋，並觀察是否更容易控制動作。 離心捲腹可用來練習控制下降。先選擇能自行維持的小幅抬起位置，再緩慢返回地面，讓腹壁持續參與。 Ha與Shin於2020年比較30°、60°和90°及不同收縮方向的捲腹，觀察到角度與肌電、腹橫肌厚度比之間的差異，其中30°離心條件的腹橫肌厚度比較大。這項急性比較可用於理解姿勢改變；實際幅度仍需配合學員的動作控制、頸部舒適度和訓練目的。"], [2, 捲腹的保護原則", "捲腹需要軀幹屈曲，脊柱負荷會隨幅度、速度、外加阻力和個人姿勢而變化。有腰痛或椎間盤相關病史時，先了解目前症狀、醫療建議以及日常活動的耐受程度，再選擇合適的幅度與負荷。早晨僵硬或疼痛可作為症狀記錄的一部分，診斷則需要完整評估。若出現新發或加重的放射痛、麻木、無力，應停止當次誘發動作並轉介評估。"], [2, 捲腹時安全的速度", "Barbado等人2015年比較不同捲腹節律時的軀幹運動控制，使用力台壓力中心等指標反映身體與支撐面的交互作用。動作速度會改變控制需求，脊柱內部負荷則需要另外的測量或建模。初學時可嘗試每次完整動作約2至4秒，平順抬起並放下；這是便於觀察的教學起點。若學員需要借力、憋氣或出現不適，可先降低幅度、減少次數或放慢節律，再依任務需要調整。"], [2, 捲腹時的呼吸與頸部舒適度", "Yoon等人2014年在12名健康受試者中比較安靜吸氣與緩慢呼氣條件。緩慢呼氣時，胸鎖乳突肌活動較低，腹橫肌／腹內斜肌區域的聯合肌電活動較高。練習時可讓抬起階段配合舒適呼氣，頭頸隨軀幹自然移動，再觀察頸部用力感是否減少。"], [2, 卷腹的變化型：加上軀幹旋轉的捲腹", "Eriksson Crommert等人的研究於2018年在線發表、2021年刊於正式卷期，比較常見捲腹變化的腹肌活動。手臂位置與軀幹旋轉方向會改變各肌的參與。研究報告的腹橫肌最高活動約為最大收縮的40%；這是標準化活動水平。旋轉捲腹可作為方向性負荷的一種變化，安排時應配合學員的耐受與控制，並逐步調整幅度。 捲腹可用於學習腹部發力，也可透過阻力、次數、組數與節律安排，服務於軀幹屈肌力量或耐力目標。呼吸口令、視覺提示和適當觸覺回饋，有助於部分學員理解動作。動作簡單有利於入門和追蹤進步，熟練後仍可依訓練目的保留。 在課表中，依照目標安排捲腹與其他核心動作的比例，兼顧訓練負荷和恢復。每個動作的價值來自它是否適合當前的學員與任務。 對於希望以捲腹改善腹部功能的產後學員，可參考Gluppe等人2023年的隨機試驗。研究納入70名產後6至12個月、有腹直肌分離的女性，進行12週包含抬頭、捲腹和旋轉捲腹的訓練。與對照組相比，訓練改善了腹直肌力量與厚度，腹直肌間距則沒有明確的組間改變。"], [2, 卷腹的變化型：加上軀幹旋轉的捲腹（续）", "這提供了在合適人群中漸進安排腹部訓練的依據。練習目標可設定為提高腹壁承受負荷與完成活動的能力，同時追蹤疼痛、漏尿、腹部不適及生活功能；產後恢復階段不同時，負荷與進度也需相應調整。 以下提供兩種教學應用。初學可先做1至2組，每組6至8次，每次完整動作約2至4秒，組間休息至呼吸和局部疲勞恢復。這些數字是低負荷學習的起點，可依個人能力增減。 第一種是小幅度捲腹與控制下降。仰臥屈膝，雙腳得到支撐，先自行抬起頭肩至舒適的小幅度，再慢慢放回。若抬起困難，可減少幅度或以適當支撐協助頭部； 手臂前伸或置於胸前可作為較容易的選項；手臂位置向頭側移動會改變負荷，使用時保持頭頸舒適，避免用手拉扯頭部。能平順完成6至8次且呼吸自然後，可逐步增加次數、幅度或阻力，每次先調整一項。 第二種是調整髖部支撐與呼氣方式。可嘗試將髖、膝維持約90°，必要時把小腿放在椅面支撐，在小幅捲起時平順呼氣。比較這個姿勢與雙腳著地時的控制感和舒適度，再選擇適合的版本；若增加呼氣力度使頸部緊繃或頭暈，回到自然呼吸並降低難度。"], [2, 卷腹的變化型：加上軀幹旋轉的捲腹（续）", "若學員先出現明顯頸部疲勞，可降低抬起幅度、減少次數，或適度支撐頭部，讓頭頸與胸廓協調移動。也可改用四足跪姿的小幅脊柱屈伸，探索不同支撐位置下的控制感。以動作舒適、呼吸順暢和可重複完成為觀察重點。 掌握捲腹後，可依目標繼續增加捲腹負荷，或加入死蟲、平板支撐、四足支撐與站姿抗阻等任務。捲腹偏向動態軀幹屈曲，其他動作提供不同方向的控制需求；選擇時兼顧日常活動、專項能力和學員偏好。"], [2, Reference:", "Barbado D, et al. (2015). Effect of Performance Speed on Trunk Movement Control During the Curl-Up Exercise. DOI: 10.1515/hukin-2015-0031. PMID: 26240646. https://pubmed.ncbi.nlm.nih.gov/26240646/ Anita, Haque M, Gupta A, Nasar A. (2015). Variation in Tendinous Intersections of Rectus Abdominis Muscle in North Indian Population with Clinical Implications. DOI: 10.7860/JCDR/2015/14027.6028. PMID: 26266107. Dafkou K, et al. (2020)."], [2, Reference:（续）", "Assessment of Rectus Abdominis muscle thickness during isometric trunk and leg lifting exercises using extended field of view (EFOV) ultrasound. DOI: 10.11152/mu-2526. PMID: 32905563. Ha SY, Shin D. (2020). The effects of curl-up exercise in terms of posture and muscle contraction direction on muscle activity and thickness of trunk muscles. DOI: 10.3233/BMR-191558. PMID: 32144977. Eriksson Crommert M, Bjerkefors A, Tarassova O, Ekblom MM. (2021; 2018在線發表)."], [2, Reference:（续）", "Abdominal Muscle Activation During Common Modifications of the Trunk Curl-up Exercise. DOI: 10.1519/JSC.0000000000002439. PMID: 29319600. Yoon TL, et al. (2014). Slow expiration reduces sternocleidomastoid activity and increases transversus abdominis and internal oblique muscle activity during abdominal curl-up. DOI: 10.1016/j.jelekin.2013.10.003. PMID: 24210796. Miller MI, Medeiros JM. (1987)."], [2, Reference:（续）", "Recruitment of internal oblique and transversus abdominis muscles during the eccentric phase of the curl-up exercise. DOI: 10.1093/ptj/67.8.1213. PMID: 2956614. Hodges PW, Richardson CA. (1997). Feedforward contraction of transversus abdominis is not influenced by the direction of arm movement. DOI: 10.1007/PL00005644. PMID: 9166925. Kim SH, Park SY. (2018). Effect of hip position and breathing pattern on abdominal muscle activation during curl-up variations. DOI: 10.12965/jer.1836170.085."], [2, Reference:（续）", "PMID: 30018932. Karst GM, et al. (2004). Effects of Specific Exercise Instructions on Abdominal Muscle Activity During Trunk Curl Exercises. DOI: 10.2519/jospt.2004.34.1.4. PMID: 14964586. Gluppe S, et al. (2023). Curl-up exercises improve abdominal muscle strength without worsening inter-recti distance in women with diastasis recti abdominis postpartum: a randomised controlled trial. DOI: 10.1016/j.jphys.2023.05.017. PMID: 37286390."]]}</script>
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5;
  color: #111;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== HEADER ========== */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid #e0e0e0;
  background: #fff;
  flex-shrink: 0;
}
.chat-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.chat-header-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #111;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.chat-header-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: #111;
  letter-spacing: 0.5px;
}
.chat-header-sub {
  font-size: 0.65rem;
  color: #999;
  letter-spacing: 0.5px;
}
.close-btn {
  display: none;
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: #999;
  font-size: 18px;
  border-radius: 50%;
  transition: all 0.2s;
  align-items: center;
  justify-content: center;
}
.close-btn:hover { background: #f0f0f0; color: #111; }

/* ========== MESSAGES ========== */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: #f5f5f5;
}
.message {
  display: flex;
  gap: 8px;
  max-width: 88%;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.ai { align-self: flex-start; }
.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.message.user .msg-avatar { background: #111; color: #fff; }
.message.ai .msg-avatar { background: #e8e8e8; color: #333; }
.bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 0.8rem;
  line-height: 1.6;
  word-break: break-word;
}
.message.user .bubble {
  background: #111;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.ai .bubble {
  background: #fff;
  color: #111;
  border: 1px solid #e8e8e8;
  border-bottom-left-radius: 4px;
}
.bubble h2 { font-size: 0.85rem; margin: 8px 0 4px; font-weight: 600; }
.bubble h3 { font-size: 0.82rem; margin: 6px 0 3px; font-weight: 600; }
.bubble strong { font-weight: 600; }
.bubble code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; font-size: 0.75rem; }
.bubble ul { padding-left: 16px; margin: 4px 0; }
.bubble li { margin: 2px 0; }
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

/* ========== TYPING INDICATOR ========== */
.typing {
  display: none;
  align-self: flex-start;
  padding: 10px 14px;
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  gap: 4px;
  align-items: center;
}
.typing.show { display: flex; }
.typing span {
  width: 6px;
  height: 6px;
  background: #999;
  border-radius: 50%;
  animation: typingDot 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

  // ========== TOKENIZER ==========
  function tokenize(text) {
    text = text.toLowerCase();
    const tokens = [];
    const enMatches = text.match(/[a-z][a-z0-9_-]*/g);
    if (enMatches) tokens.push(...enMatches);
    const masked = text.replace(/[a-z][a-z0-9_-]*/g, ' ');
    const nums = masked.match(/\d+\.?\d*%?/g);
    if (nums) tokens.push(...nums);
    const zhSegments = text.match(/[\u4e00-\u9fff]+/g);
    if (zhSegments) {
      for (const seg of zhSegments) {
        let i = 0;
        while (i < seg.length) {
          let matched = false;
          const maxLen = Math.min(seg.length - i, 6);
          for (let len = maxLen; len > 1; len--) {
            const candidate = seg.substring(i, i + len);
            if (EBST_DICT.has(candidate)) {
              tokens.push(candidate);
              i += len;
              matched = true;
              break;
            }
          }
          if (!matched) {
            tokens.push(seg[i]);
            if (i < seg.length - 1) tokens.push(seg.substring(i, i + 2));
            i++;
          }
        }
      }
    }
    return tokens;
  }

  // ========== QUERY PREPROCESSING ==========
  function preprocessQuery(query) {
    const queryLower = query.toLowerCase();
    const chapterMatch = queryLower.match(/第(\d+)[章节]|ch(\d+)/i);
    const chapterHint = chapterMatch ? parseInt(chapterMatch[1] || chapterMatch[2]) : null;
    let queryClean = queryLower.replace(/请问|帮我|我想问|我想知道|请告诉我|告诉一下|一下|能不能|请问一下|什么是|是什么|怎么|如何/g, '');
    const baseTokens = tokenize(queryClean);
    const expandedSet = new Set(baseTokens);
    for (const tok of baseTokens) {
      if (SYNONYM_MAP[tok]) {
        expandedSet.add(SYNONYM_MAP[tok]);
        const synTokens = tokenize(SYNONYM_MAP[tok]);
        synTokens.forEach(t => expandedSet.add(t));
      }
    }
    return { tokens: Array.from(expandedSet), chapterHint };
  }

  // ========== IDF PRE-COMPUTATION ==========
  const N = blocks.length;
  const df = {};
  for (const b of blocks) {
    const content = (b[2] + ' ' + b[1]).toLowerCase();
    const seen = new Set();
    const toks = tokenize(content);
    for (const t of toks) {
      if (!seen.has(t)) { seen.add(t); df[t] = (df[t] || 0) + 1; }
    }
  }
  const idf = {};
  for (const t in df) {
    idf[t] = Math.log((N + 1) / (df[t] + 1)) + 1;
  }

  // ========== TF-IDF SEARCH ==========
  function searchKnowledge(query, topK) {
    topK = topK || 6;
    const { tokens: qTokens, chapterHint } = preprocessQuery(query);
    if (!qTokens.length) return [];

    const scores = [];
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const content = (b[2] + ' ' + b[1]).toLowerCase();
      const title = (b[1] || '').toLowerCase();
      const cTokens = tokenize(content);
      const tf = {};
      for (const t of cTokens) tf[t] = (tf[t] || 0) + 1;
      const cLen = cTokens.length || 1;

      let score = 0;
      for (const qt of qTokens) {
        const isDictWord = EBST_DICT.has(qt) || qt.length >= 3;
        const weight = isDictWord ? 3.0 : 1.0;
        if (tf[qt] && idf[qt]) {
          score += (tf[qt] / cLen) * idf[qt] * weight;
        }
        if (!tf[qt] && content.includes(qt)) {
          score += 0.5 * (idf[qt] || 1.0) * weight;
        }
      }
      if (score > 0 && title) {
        for (const qt of qTokens) {
          if (title.includes(qt)) {
            score *= 1.5;
            break;
          }
        }
      }
      if (chapterHint && b[0] === chapterHint) {
        score *= 2.0;
      }
      if (score > 0) scores.push({ idx: i, score: score });
    }

    scores.sort((a, b) => b.score - a.score);
    return scores.slice(0, topK).map(s => s.idx);
  }

  // ========== BUILD CONTEXT ==========
  function buildContext(indices) {
    if (!indices || indices.length === 0) {
      return '【未找到直接相关的教材段落】\n建议在对话中引导学生回顾教材目录，或提出更具体的问题。';
    }
    const parts = [];
    const seen = new Set();
    for (const idx of indices) {
      const b = blocks[idx];
      const key = b[0] + '|' + b[2].substring(0, 50);
      if (seen.has(key)) continue;
      seen.add(key);
      const chName = chapters[b[0]] || ('Ch' + b[0]);
      let ctx = '【第' + b[0] + '章 - ' + chName;
      if (b[1]) ctx += ' · ' + b[1];
      ctx += '】\n' + b[2];
      parts.push(ctx);
    }
    return parts.join('\n\n---\n\n');
  }

  // ========== MARKDOWN RENDERER ==========
  function renderMarkdown(text) {
    if (!text) return '';
    let html = text;
    html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^[•·\-\*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m) { return '<ul>' + m + '</ul>'; });
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    html = html.replace(/\n\n/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p><\/p>/g, '');
    html = html.replace(/<p>(<h[23]>)/g, '$1');
    html = html.replace(/(<\/h[23]>)<\/p>/g, '$1');
    html = html.replace(/<p>(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)<\/p>/g, '$1');
    return html;
  }

## 能力边界

- 涉及其他专业领域时，建议咨询相关专业人员

## 语言风格
- 专业但易懂
- 回答控制在 200-400 字
- 使用 Markdown 格式（加粗、列表）提高可读性`;

  // ========== API CALL ==========
  async function callDeepSeek(userQuestion) {
    const indices = searchKnowledge(userQuestion, 5);
    const context = buildContext(indices);

    const sysContent = SYSTEM_PROMPT + '\n\n## 教材内容（相关段落）\n' + (context || '（未找到相关内容）');

    conversationHistory.push({ role: 'user', content: userQuestion });

    const messages = [
      { role: 'system', content: sysContent },
      ...conversationHistory.slice(-6)
    ];

    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-372c38675f5e45ed8db9d8cde2136356'
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: messages,
        max_tokens: 1024,
        temperature: 0.3
      })
    });

    if (!resp.ok) {
      throw new Error('API error: ' + resp.status);
    }

    const data = await resp.json();
    const reply = data.choices[0].message.content;
    conversationHistory.push({ role: 'assistant', content: reply });

    if (conversationHistory.length > 10) {
      conversationHistory.splice(0, conversationHistory.length - 8);
    }

    return reply;
  }

  // ========== FOLLOW-UP SUGGESTIONS ==========
  function generateFollowUps(reply, originalQuery) {
    const container = document.getElementById('suggestions');
    if (!container) return;
    container.innerHTML = '';

    const suggestions = [];
    const replyLower = reply.toLowerCase();

    const chapterTopics = {
      1: ['膈肌的呼吸力学', '腹内压在力量训练中的应用', '瓦尔萨尔瓦动作的安全性'],
      2: ['卷腹的腹直肌激活', '卷腹的颈椎安全策略', '卷腹与其他腹肌训练的比较'],
      3: ['死虫的腰椎稳定策略', '死虫的呼吸与腹内压', '躯干控制的神经肌肉机制'],
      4: ['平板支撑的躯干控制策略', '俯卧撑的肣胂骨运动学', '核心稳定的呼吸机制'],
      5: ['卧推的肣胂骨设置', '卧推的拱形与腿部驱动', '卧推的锁定与肣关节安全'],
      6: ['肩推的肣胂骨稳定策略', 'Overhead Press的锁定技术', '肩推中的呼吸与腹内压'],
      7: ['二头肌训练的生物力学', '三头肌的长头与外侧头激活', '侧平举的阻力曲线分析'],
      8: ['深蹲的呼吸与腹内压', '深蹲的膝关节力学', '深蹲的运动范围优化'],
      9: ['分腿蹲的骻关节力学', '分腿蹲的膝关节稳定性', '分腿蹲与深蹲的肌肉激活对比'],
      10: ['高位下拉阻力曲线分析', '直臂下压的肌肉激活顺序', '肣胂骨运动学在拉类动作中的作用'],
      11: ['引体向上的进阶训练方法', '握力对引体向上表现的影响', '引体向上的肣胂骨激活策略'],
      12: ['划船动作的肣胂骨后缩机制', '不同划船变式的肌肉激活差异', '划船中的肘部轨迹优化'],
      13: ['面拉的肩袖激活策略', '面拉改善肣胂骨运动学', '面拉的常见错误与修正'],
    };

    const chapterRefs = reply.match(/第(\d+)[章节]|第(\d+)章|Ch(\d+)/gi);
    let detectedChapters = [];
    if (chapterRefs) {
      detectedChapters = [...new Set(chapterRefs.map(r => {
        const m = r.match(/\d+/);
        return m ? parseInt(m[0]) : null;
      }).filter(Boolean))];
    }

    for (const ch of detectedChapters) {
      if (chapterTopics[ch]) {
        const topics = chapterTopics[ch].filter(t => !replyLower.includes(t.toLowerCase()));
        suggestions.push(...topics.slice(0, 2));
      }
    }

    if (suggestions.length === 0) {
      const keywordSuggestions = {
        '肩胛骨': ['肩胛骨运动学', '肩胛骨稳定策略', '肩胛骨在拉类动作中的作用'],
        '肩袖': ['肩袖肌群功能', '肩袖损伤预防', '肩袖在肩推中的作用'],
        '力矩': ['力矩与阻力曲线', '力矩在训练中的应用', '力臂优化策略'],
        '深蹲': ['深蹲的呼吸技术', '深蹲膝关节力学', '深蹲运动范围'],
        '卧推': ['卧推肩胛骨设置', '卧推拱形技术', '卧推肩关节安全'],
        '引体向上': ['引体向上进阶方法', '引体向上握力', '引体向上肩胛骨激活'],
        '高位下拉': ['高位下拉阻力曲线', '高位下拉肩胛骨运动', '高位下拉变式对比'],
        '腹内压': ['腹内压与呼吸', '瓦尔萨尔瓦动作', '腹内压在深蹲中的应用'],
        '周期化': ['线性周期化设计', '板块周期化特点', '减量训练策略'],
        '肌肥大': ['机械张力与肌肥大', '代谢压力机制', '肌浆与肌原纤维肥大']
      };

      for (const [keyword, sugs] of Object.entries(keywordSuggestions)) {
        if (replyLower.includes(keyword) || originalQuery.toLowerCase().includes(keyword)) {
          suggestions.push(...sugs.slice(0, 2));
          break;
        }
      }
    }

    if (suggestions.length === 0) {
      suggestions.push('这个动作的生物力学分析', '如何在训练中应用', '与其他动作的对比');
    }

    const finalSuggestions = suggestions.slice(0, 3);
    for (const sug of finalSuggestions) {
      const chip = document.createElement('div');
      chip.className = 'suggestion-chip';
      chip.textContent = sug;
      chip.onclick = function() { sendSuggestion(this); };
      container.appendChild(chip);
    }
    container.classList.add('show');
  }

  // ========== SEND MESSAGE ==========
  window.sendMessage = async function() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');

    addMessage(text, 'user');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    document.getElementById('suggestions').classList.remove('show');
    typing.classList.add('show');

    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;

    try {
      const reply = await callDeepSeek(text);
      typing.classList.remove('show');
      addMessage(reply, 'ai');
      generateFollowUps(reply, text);
    } catch (err) {
      typing.classList.remove('show');
      addMessage('抱歉，AI 服务暂时不可用。请稍后再试。\n\n错误信息：' + err.message, 'ai');
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  };

  window.sendSuggestion = function(el) {
    document.getElementById('userInput').value = el.textContent;
    document.getElementById('suggestions').classList.remove('show');
    sendMessage();
  };

  // ========== KEYBOARD ==========
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ========== CLOSE BUTTON IF IN IFRAME ==========
  if (window.parent !== window) {
    document.getElementById('closeBtn').style.display = 'flex';
  }

  // ========== FOCUS INPUT ==========
  document.getElementById('userInput').focus();
})();
</script>
